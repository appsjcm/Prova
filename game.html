<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a2040">
<title>Cosmo Kid</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overscroll-behavior:none;touch-action:none}
body{background:#0a2040;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:monospace;color:#fff;overflow:hidden;touch-action:none;overscroll-behavior:none}
h1{font-size:1.9rem;margin-bottom:5px;letter-spacing:4px;text-transform:uppercase;background:linear-gradient(135deg,#00ccff,#00ff88);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
#hud{display:flex;gap:12px;margin-bottom:6px;flex-wrap:wrap;justify-content:center}
.hb{text-align:center}
.hl{font-size:8px;color:#6688aa;letter-spacing:2px;text-transform:uppercase}
.hv{font-size:1.3rem;font-weight:bold;color:#00ccff}
#hl{letter-spacing:2px}
#hpwr{transition:color .3s}
#wrap{position:relative}
canvas{display:block;border:2px solid #44aadd;border-radius:8px;box-shadow:0 0 50px rgba(0,200,255,.25)}
#ov{position:absolute;inset:0;background:rgba(0,20,60,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:6px;gap:8px;padding:20px;backdrop-filter:blur(1px)}
#ov.off{display:none}
#ov-t{font-size:2.8rem;font-weight:900;color:#00ccff;letter-spacing:5px;text-align:center;text-shadow:0 0 30px #00ccff,0 0 60px rgba(0,180,255,.4);line-height:1}
#ov-sub{font-size:.65rem;color:#5588aa;letter-spacing:4px;text-transform:uppercase;margin-top:2px}
#ov-hi{font-size:.76rem;color:#99aacc;letter-spacing:1px;text-align:center;margin-top:4px}
#ov-m{color:#7799cc;font-size:.75rem;text-align:center;line-height:1.9;max-width:280px}
#ov-b{color:#99aacc;font-size:.74rem;text-align:center}
#ov-btn{padding:0;font-size:1.15rem;font-weight:bold;letter-spacing:4px;text-transform:uppercase;background:linear-gradient(160deg,#0099dd,#0055aa);color:#fff;border:2px solid rgba(0,200,255,.55);border-radius:14px;cursor:pointer;width:100%;max-width:290px;min-height:64px;box-shadow:0 0 35px rgba(0,130,220,.5),0 5px 20px rgba(0,0,0,.5);transition:transform .1s,box-shadow .1s;margin-top:8px}
#ov-btn:hover,#ov-btn:active{transform:scale(1.05);box-shadow:0 0 50px rgba(0,200,255,.8),0 5px 20px rgba(0,0,0,.5)}
#ctrl{margin-top:7px;color:#3a4a5a;font-size:.66rem;text-align:center;line-height:2}
.k{display:inline-block;background:#0d1a2a;border:1px solid #2a3a4a;border-radius:3px;padding:1px 5px;color:#5a7a9a}
#fs-btn{position:fixed;top:10px;right:10px;z-index:300;background:rgba(0,20,50,.75);border:1.5px solid rgba(0,200,255,.3);color:#99bbcc;width:40px;height:40px;font-size:.9rem;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.4)}
#fs-btn:hover,#fs-btn:active{background:rgba(0,200,255,.18);color:#00ccff;border-color:rgba(0,200,255,.6)}
/* ── TOUCH CONTROL STRIP ── */
#tc{display:none;position:fixed;bottom:0;left:0;right:0;height:120px;pointer-events:none;z-index:200;background:linear-gradient(transparent,rgba(0,4,18,.52) 32%);padding-bottom:env(safe-area-inset-bottom,0px)}
.tcb{position:absolute;border-radius:50%;background:rgba(0,8,30,.62);border:2px solid rgba(255,255,255,.2);color:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;pointer-events:all;touch-action:none;user-select:none;-webkit-user-select:none;transition:background .06s,border-color .08s,box-shadow .08s,transform .06s;box-shadow:0 3px 12px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08)}
.tcb:active,.tcb.on{transform:scale(.9);background:rgba(0,130,215,.42);border-color:rgba(0,215,255,.92);box-shadow:0 0 18px rgba(0,180,255,.55),0 2px 6px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.12)}
/* Left: virtual joystick */
#joy-base{position:absolute;left:8px;bottom:6px;width:108px;height:108px;border-radius:50%;background:rgba(0,6,24,.48);border:2px solid rgba(255,255,255,.1);pointer-events:all;touch-action:none;box-shadow:0 4px 18px rgba(0,0,0,.5),inset 0 0 30px rgba(0,30,80,.3)}
#joy-knob{position:absolute;top:50%;left:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:radial-gradient(circle at 36% 36%,rgba(0,170,255,.9),rgba(0,80,210,.78));border:2px solid rgba(0,210,255,.65);box-shadow:0 0 14px rgba(0,150,255,.5),inset 0 1px 0 rgba(255,255,255,.25);pointer-events:none;will-change:transform;transition:transform .04s}
#joy-knob.run{box-shadow:0 0 22px rgba(0,220,255,.8),inset 0 1px 0 rgba(255,255,255,.3)}
/* Right: action buttons */
#tc-a{right:6px;bottom:36px;width:80px;height:80px;font-size:2.2rem;background:rgba(0,30,90,.7);border-color:rgba(0,180,255,.4);box-shadow:0 0 24px rgba(0,140,255,.22),0 4px 16px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.1)}
#tc-a.on{background:rgba(0,90,220,.52);border-color:rgba(0,225,255,.96);box-shadow:0 0 30px rgba(0,200,255,.75),0 2px 8px rgba(0,0,0,.4)}
#tc-b{right:92px;bottom:50px;width:62px;height:62px;font-size:1rem;letter-spacing:.5px}
#tc-x{right:46px;bottom:8px;width:56px;height:56px;font-size:1rem;color:rgba(0,200,255,.38);border-color:rgba(0,180,255,.18)}
#tc-x.fire-on{color:rgba(0,235,255,.96);border-color:rgba(0,215,255,.82);box-shadow:0 0 18px rgba(0,200,255,.6),inset 0 1px 0 rgba(255,255,255,.1)}
#tc-p{right:163px;bottom:12px;width:42px;height:42px;font-size:.95rem;color:rgba(180,210,255,.65);border-color:rgba(100,150,200,.22);background:rgba(0,10,40,.55)}
/* warnings */
.warn{animation:wpulse .45s infinite}
@keyframes wpulse{0%,100%{opacity:1}50%{opacity:.45}}
/* ── RESPONSIVE ── */
@media (max-width:480px){
  h1{font-size:1.25rem;margin-bottom:2px;letter-spacing:2px}
  .hv{font-size:.92rem}.hl{font-size:6px}
  #hud{gap:8px;margin-bottom:3px}
}
@media (orientation:portrait) and (max-width:700px){
  #ov-t{font-size:2rem;letter-spacing:3px}
  #ov-btn{min-height:68px;font-size:1.05rem}
  #ov-m{font-size:.72rem}
}
/* Portrait touch: HUD drawn on canvas, body flush to top */
@media (orientation:portrait){
  body.touch{justify-content:flex-start;padding-top:max(8px,env(safe-area-inset-top,8px))}
  body.touch #hud,body.touch #ctrl{display:none!important}
}
@media (orientation:landscape) and (max-height:500px){
  h1,#ctrl{display:none!important}
  #hud{gap:5px;margin-bottom:1px;flex-wrap:nowrap}
  .hv{font-size:.74rem}.hl{font-size:5px}
  /* TC becomes full-height side overlay — no bottom strip */
  #tc{top:0;height:100%;background:none;padding:0}
  /* Joystick: vertically centered on left */
  #joy-base{left:4px;top:50%;bottom:auto;transform:translateY(-50%);width:86px;height:86px}
  #joy-knob{width:36px;height:36px;margin:-18px 0 0 -18px}
  /* Action buttons: vertically centered on right */
  #tc-a{right:6px;bottom:auto;top:calc(50% - 86px);width:72px;height:72px;font-size:1.9rem}
  #tc-b{right:88px;bottom:auto;top:calc(50% - 31px);width:60px;height:60px}
  #tc-x{right:6px;bottom:auto;top:calc(50% + 4px);width:54px;height:54px;font-size:.88rem}
  #tc-p{right:156px;bottom:auto;top:8px;width:36px;height:36px;font-size:.8rem}
}
body.touch h1{display:none}
/* Fullscreen */
:fullscreen h1,:fullscreen #ctrl,:-webkit-full-screen h1,:-webkit-full-screen #ctrl{display:none!important}
:fullscreen #hud,:-webkit-full-screen #hud{margin-bottom:3px}
:fullscreen #ov-t,:-webkit-full-screen #ov-t{font-size:3.5rem}
:fullscreen #ov-btn,:-webkit-full-screen #ov-btn{max-width:340px;min-height:74px;font-size:1.25rem}
:fullscreen canvas,:-webkit-full-screen canvas{border-color:transparent;box-shadow:none}
/* Difficulty selector */
#ov-diff{display:flex;gap:7px;justify-content:center;margin:2px 0 4px}
.dbtn{flex:1;max-width:88px;min-height:44px;border-radius:10px;border:2px solid rgba(255,255,255,.18);background:rgba(0,8,30,.55);color:rgba(255,255,255,.7);font-size:.62rem;font-weight:bold;letter-spacing:.5px;cursor:pointer;font-family:monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:all .12s;padding:4px 2px}
.dbtn:hover{transform:scale(1.06)}
.dbtn.sel{transform:scale(1.08)}
/* Cheat menu */
#ch-ov{display:none;position:fixed;inset:0;background:rgba(0,0,20,.94);z-index:500;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px}
#ch-ov.on{display:flex}
.ch-t{font-size:1.4rem;font-weight:900;color:#ffee22;letter-spacing:4px;text-shadow:0 0 20px #ffcc00}
.ch-h{font-size:.6rem;color:#5588aa;letter-spacing:2px;text-transform:uppercase}
#ch-btns{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-width:360px}
.ch-b{background:rgba(0,40,80,.8);border:1.5px solid rgba(0,200,255,.3);color:#cce8ff;font-size:.68rem;padding:5px 10px;border-radius:6px;cursor:pointer;font-family:monospace;transition:all .1s}
.ch-b.on{background:rgba(0,180,100,.25);border-color:#00ff88;color:#00ff88}
.ch-b:hover{border-color:#00ccff;color:#00ccff}
#ch-warp{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:360px;margin-top:2px}
.ch-w{background:rgba(60,0,80,.8);border:1px solid rgba(200,0,255,.3);color:#cc88ff;font-size:.65rem;padding:4px 8px;border-radius:4px;cursor:pointer;font-family:monospace}
.ch-w:hover{background:rgba(120,0,160,.6);border-color:#dd44ff;color:#ee88ff}
.ch-c{margin-top:6px;background:rgba(80,0,0,.8);border:1px solid rgba(255,80,80,.4);color:#ff8888;font-size:.7rem;padding:5px 16px;border-radius:6px;cursor:pointer;font-family:monospace}
.ch-c:hover{background:rgba(160,0,0,.5);border-color:#ff4444}
</style>
</head>
<body>
<h1>Cosmo Kid</h1>
<div id="hud">
  <div class="hb"><div class="hl">Puntos</div><div class="hv" id="hs">000000</div></div>
  <div class="hb"><div class="hl">Cristales</div><div class="hv" id="hc">x00</div></div>
  <div class="hb"><div class="hl">Vidas</div><div class="hv" id="hl">&#9829;&#9829;&#9829;</div></div>
  <div class="hb"><div class="hl">Tiempo</div><div class="hv" id="ht">300</div></div>
  <div class="hb"><div class="hl">Mision</div><div class="hv" id="hn">1/3</div></div>
  <div class="hb"><div class="hl">Estado</div><div class="hv" id="hpwr">-</div></div>
  <div class="hb"><div class="hl">Nivel</div><div class="hv" id="hdiff" style="font-size:.72rem">MEDIO</div></div>
  <div class="hb"><div class="hl">Musica</div><div class="hv" id="hmu" style="cursor:pointer;font-size:.95rem" title="M = silenciar">&#9835;</div></div>
  <div class="hb"><div class="hl">Efectos</div><div class="hv" id="hsfx" style="cursor:pointer;font-size:.95rem" title="N = efectos">&#9834;</div></div>
</div>
<div id="wrap">
  <canvas id="c" width="600" height="380"></canvas>
  <div id="ov">
    <div id="ov-t">COSMO KID</div>
    <div id="ov-sub">Aventura Espacial · 8 Misiones</div>
    <div id="ov-hi"></div>
    <div id="ov-m"></div>
    <div id="ov-b"></div>
    <div id="ov-diff"></div>
    <button id="ov-btn">JUGAR</button>
  </div>
</div>
<div id="ch-ov">
  <div class="ch-t">&#9733; COSMO TRUCOS &#9733;</div>
  <div class="ch-h">Escribe COSMO &middot; Toca "COSMO KID" x5</div>
  <div id="ch-btns">
    <button class="ch-b" id="ch-inf">&#9829; Vidas Infinitas</button>
    <button class="ch-b" id="ch-ghost">&#128123; Modo Fantasma</button>
    <button class="ch-b" id="ch-jump">&#128640; Super Salto</button>
    <button class="ch-b" id="ch-turbo">&#9889; Turbo Velocidad</button>
    <button class="ch-b" id="ch-nospk">&#128737; Sin Pinchos</button>
    <button class="ch-b" id="ch-star9">&#11088; Estrella Permanente</button>
  </div>
  <div class="ch-h" style="margin-top:6px">Warp a mision:</div>
  <div id="ch-warp"></div>
  <button class="ch-c" id="ch-cl">&#x2715; Cerrar</button>
</div>
<div id="ctrl">
  <span class="k">&#8592;&#8594;</span> mover &nbsp;
  <span class="k">&#8593;</span><span class="k">Z</span> saltar &nbsp;
  <span class="k">&#8595;</span> agachar &nbsp;
  <span class="k">X</span> laser &nbsp;
  <span class="k">Shift</span> correr &nbsp;
  <span class="k">P</span> pausa
</div>
<button id="fs-btn" title="Pantalla completa">&#x26F6;</button>
<div id="tc">
  <div id="joy-base"><div id="joy-knob"></div></div>
  <div class="tcb" id="tc-p">&#9646;&#9646;</div>
  <div class="tcb" id="tc-b">RUN</div>
  <div class="tcb" id="tc-a">&#9650;</div>
  <div class="tcb" id="tc-x">&#10022;</div>
</div>
<script>
'use strict';
const cv=document.getElementById('c'),ct=cv.getContext('2d');
const CW=600,CH=380,GY=320;
const GRAV=0.52,JV=-12,WS=2.6,RS=4.8;
const MAX_LV=8;
const wrap=document.getElementById('wrap');
let NOW=0;

// ── AUDIO ───────────────────────────────────────────────────
let AC=null;
function initAC(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();}
['click','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,initAC,{once:true}));
function beep(freq,type,vol,dur,freq2,delay){
  if(sfxMuted||!AC||AC.state!=='running')return;
  try{
    const o=AC.createOscillator(),g=AC.createGain();
    o.connect(g);g.connect(AC.destination);
    o.type=type||'sine';
    const t=AC.currentTime+(delay||0);
    o.frequency.setValueAtTime(freq,t);
    if(freq2)o.frequency.exponentialRampToValueAtTime(freq2,t+dur*.8);
    g.gain.setValueAtTime(Math.min(vol||.1,.35),t);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.start(t);o.stop(t+dur+.05);
  }catch(e){}
}
const SFX={
  jump:()=>beep(300,'square',.08,.13,580),
  land:()=>beep(85,'triangle',.14,.07,45),
  coin:()=>{beep(900,'sine',.09,.07);beep(1350,'sine',.09,.1,null,.06);},
  stomp:()=>beep(130,'square',.2,.1,30),
  laser:()=>beep(720,'sawtooth',.05,.07,160),
  hurt:()=>beep(160,'sawtooth',.2,.22,65),
  die:()=>[320,250,190,130,75].forEach((f,i)=>beep(f,'square',.1,.12,null,i*.09)),
  pu:()=>[420,580,740,940].forEach((f,i)=>beep(f,'sine',.1,.14,null,i*.08)),
  blk:()=>beep(170,'sawtooth',.13,.1,55),
  brk:()=>{beep(200,'sawtooth',.2,.14,40);beep(120,'sawtooth',.15,.14,50,.05);},
  cp:()=>{beep(660,'sine',.1,.1);beep(880,'sine',.1,.12,null,.1);beep(1100,'sine',.1,.16,null,.22);},
  win:()=>[[523,0],[659,.15],[784,.3],[1047,.45]].forEach(([f,d])=>beep(f,'sine',.13,.35,null,d)),
  over:()=>[[360,0],[290,.2],[220,.4],[150,.65]].forEach(([f,d])=>beep(f,'square',.11,.28,null,d)),
  combo:n=>beep(400+n*80,'sine',.12,.1,null),
  star:()=>[500,700,900,1200].forEach((f,i)=>beep(f,'sine',.07,.08,null,i*.04)),
  spring:()=>{beep(200,'square',.18,.06,700);beep(700,'sine',.1,.18,null,.05);},
  warn:()=>beep(880,'square',.07,.07,660),
  shield:()=>{beep(660,'sine',.15,.06,300);beep(300,'square',.2,.15,80,.08);},
  shot:()=>beep(340,'sawtooth',.09,.1,90),
};

// ── MUSIC ─────────────────────────────────────────────────────
let musicActive=false,musicBeat=0,musicNextT=0,musicMuted=false,sfxMuted=false;
const MELODIES=[
  [523,659,784,659,523,392,440,523,587,659,698,659,587,523,494,523],
  [349,440,523,440,349,262,294,349,392,440,466,440,392,349,330,349],
  [220,262,330,294,220,196,220,247,262,247,220,196,175,196,220,247],
  [196,220,247,220,196,175,196,165,175,196,175,165,147,165,175,196],
  [440,494,440,392,349,392,440,494,523,494,440,392,440,494,523,440],
];
const MEL_IDX=[0,1,2,3,4,3,4,2];
const BEAT_DUR=0.22;
function scheduleMusicNotes(){
  if(musicMuted||!musicActive||!AC||AC.state!=='running')return;
  const now=AC.currentTime;if(musicNextT<now)musicNextT=now;
  while(musicNextT<now+0.5){
    const mel=MELODIES[MEL_IDX[Math.min(levelNum,7)]],freq=mel[musicBeat%mel.length];
    const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);
    o.type='triangle';o.frequency.value=freq;const t=musicNextT;
    g.gain.setValueAtTime(0.048,t);g.gain.exponentialRampToValueAtTime(0.001,t+BEAT_DUR*.9);
    o.start(t);o.stop(t+BEAT_DUR);musicNextT+=BEAT_DUR;musicBeat++;
  }
}
function startMusic(){musicActive=true;musicBeat=0;if(AC)musicNextT=AC.currentTime;}
function stopMusic(){musicActive=false;}
const hmuEl=document.getElementById('hmu');
const hsfxEl=document.getElementById('hsfx');
function setMusicIcon(){hmuEl.textContent=musicMuted?'🔇':'♩';hmuEl.style.color=musicMuted?'#555':'#00ccff';}
function setSFXIcon(){hsfxEl.textContent=sfxMuted?'–♪':'♪';hsfxEl.style.color=sfxMuted?'#555':'#00ccff';}
setMusicIcon();

// ── SCREEN SHAKE ─────────────────────────────────────────────
let shk=0;
function shake(n){shk=Math.max(shk,n);}

// ── FULLSCREEN ──────────────────────────────────────────────
let fsWanted=false;
function isFS(){return!!(document.fullscreenElement||document.webkitFullscreenElement);}
function requestFS(el){try{const f=el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen;if(f){f.call(el);fsWanted=true;}}catch(e){}}
function exitFS(){try{const f=document.exitFullscreen||document.webkitExitFullscreen;if(f){f.call(document);fsWanted=false;}}catch(e){}}
const fsBtn=document.getElementById('fs-btn');
fsBtn.addEventListener('click',()=>{initAC();isFS()?exitFS():requestFS(document.documentElement);});
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{
  const fs=isFS();if(!fs&&fsWanted)fsWanted=false;
  fsBtn.innerHTML=fs?'&#x2715;':'&#x26F6;';
  fsBtn.style.opacity=fs?.45:1;
  resize();
}));

// ── RESIZE ──────────────────────────────────────────────────
let tcH=0,isTouchDevice=false;
function resize(){
  const fs=isFS();
  const land=innerWidth>innerHeight;
  const topH=fs?0:(isTouchDevice&&land?30:isTouchDevice?8:118);
  const botH=isTouchDevice&&!land?120:0;
  const sidePad=isTouchDevice&&land?196:0; // room for side controls
  const maxS=fs?3.5:land&&isTouchDevice?2.2:1.6;
  const s=Math.min((innerWidth-4-sidePad)/CW,(innerHeight-topH-botH)/CH,maxS);
  cv.style.width=CW*s+'px';cv.style.height=CH*s+'px';wrap.style.width=CW*s+'px';
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(()=>{resize();if(fsWanted&&!isFS())requestFS(document.documentElement);},400));
// Prevent default scroll/bounce
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
resize();

// ── INPUT ───────────────────────────────────────────────────
const K={},JP={};
window.addEventListener('keydown',e=>{if(!K[e.code])JP[e.code]=true;K[e.code]=true;if(['Space','ArrowUp','ArrowLeft','ArrowRight','ArrowDown'].includes(e.code))e.preventDefault();if(e.code==='KeyP')togglePause();if(e.code==='KeyM'){musicMuted=!musicMuted;if(!musicMuted&&musicActive&&AC)musicNextT=AC.currentTime;setMusicIcon();}if(e.code==='KeyN'){sfxMuted=!sfxMuted;setSFXIcon();}});
window.addEventListener('keyup',e=>K[e.code]=false);
window.addEventListener('blur',()=>{for(const k in K)K[k]=false;});

let boss=null,bossProjs=[];
function mkBoss(x,hp){hp=Math.max(2,Math.round((hp||8)*df().bsc));return{x,y:60,w:56,h:56,hp,maxHp:hp,vx:0,vy:0,onG:false,alive:true,inv:0,timer:0,rage:false,triggered:false};}
function updBoss(sl){
  if(!boss||!boss.alive)return;
  // Wait dormant until player enters boss arena
  if(!boss.triggered){
    boss.vy+=GRAV;if(boss.vy>16)boss.vy=16;
    boss.y+=boss.vy;
    for(const s of sl){if(!hit(boss,s))continue;if(boss.vy>=0){boss.y=s.y-boss.h;boss.vy=0;}break;}
    if(player&&Math.abs(player.x-(boss.x+28))<520){
      boss.triggered=true;boss.vx=-2;
      shake(8);SFX.warn();
      parts.push(new TextPop(boss.x+28,boss.y-24,'¡JEFE FINAL!','#ff4400'));
      for(let i=0;i<20;i++)parts.push(new Pop(boss.x+28,boss.y+28,(Math.random()-.5)*12,-Math.random()*9,'#ff5500',44));
    }
    return;
  }
  if(boss.inv>0)boss.inv--;
  boss.timer++;boss.vy+=GRAV;if(boss.vy>16)boss.vy=16;
  boss.x+=boss.vx;
  for(const s of sl){if(!hit(boss,s))continue;boss.vx>0?(boss.x=s.x-boss.w,boss.vx=-Math.abs(boss.vx)):(boss.x=s.x+boss.w,boss.vx=Math.abs(boss.vx));break;}
  boss.onG=false;boss.y+=boss.vy;
  for(const s of sl){if(!hit(boss,s))continue;if(boss.vy>=0){boss.y=s.y-boss.h;boss.vy=0;boss.onG=true;}else{boss.y=s.y+boss.h;boss.vy=1;}break;}
  if(boss.onG&&boss.timer%(boss.rage?52:80)===0)boss.vy=boss.rage?-16:-13;
  if(boss.timer%120===0)boss.vx=(player.x>boss.x?1:-1)*(2.5+(boss.maxHp-boss.hp)*.4+(boss.rage?.9:0));
  const bfi=boss.rage?55:90;
  if(boss.timer%bfi===bfi-35&&player&&!player.dead&&!player.goal){
    const dx=player.x+10-(boss.x+28),dy=player.y+player.h/2-(boss.y+28);
    const d=Math.sqrt(dx*dx+dy*dy)||1;const sp=((boss.rage?3.8:3)+.5*(boss.maxHp-boss.hp))*df().pspd;
    bossProjs.push({x:boss.x+28,y:boss.y+28,vx:dx/d*sp,vy:dy/d*sp,life:220,active:true});
    if(boss.rage){const a=.32,s2=Math.sin(a),c2=Math.cos(a);bossProjs.push({x:boss.x+28,y:boss.y+28,vx:(dx/d*c2-dy/d*s2)*sp,vy:(dx/d*s2+dy/d*c2)*sp,life:220,active:true});}
  }
  for(const lb of lasers){
    if(!lb.active||!hit(lb,boss))continue;
    lb.active=false;if(boss.inv>0)return;
    boss.hp--;boss.inv=28;shake(4);SFX.hurt();
    parts.push(new TextPop(boss.x+28,boss.y,'-1','#ff4444'));
    for(let i=0;i<8;i++)parts.push(new Pop(boss.x+28,boss.y+28,(Math.random()-.5)*7,-Math.random()*5,'#ff6600',24));
    if(boss.hp<=0){boss.alive=false;SFX.win();shake(10);addScore(9000);
      for(let i=0;i<24;i++)parts.push(new Pop(boss.x+Math.random()*56,boss.y+Math.random()*56,(Math.random()-.5)*10,-Math.random()*9,'#ffcc00',50));
      parts.push(new TextPop(boss.x+28,boss.y-30,'¡JEFE VENCIDO!','#ffdd00'));}
    if(!boss.rage&&boss.alive&&boss.hp<=boss.maxHp*df().rage){boss.rage=true;shake(8);hap(80);SFX.warn();parts.push(new TextPop(boss.x+28,boss.y-28,'¡FURIA!','#ff4400'));for(let i=0;i<16;i++)parts.push(new Pop(boss.x+28,boss.y+28,(Math.random()-.5)*12,-Math.random()*9,'#ff5500',36));}
  }
  if(boss.inv<=0&&player.star>0&&hit(player,boss)){boss.hp--;boss.inv=36;shake(3);}
  if(boss.inv<=0&&hit(player,boss)){
    if(player.vy>0&&player.y+player.h<=boss.y+14){player.vy=-11;if(boss.inv<=0){boss.hp--;boss.inv=28;shake(4);}}
    else pHurt();
  }
}
function drawBoss(ox){
  if(!boss||!boss.alive)return;
  const x=Math.round(boss.x-ox),y=Math.round(boss.y);
  if(!boss.triggered){
    // Dormant pulsing idle
    const pulse=.6+.4*Math.sin(NOW*.04);
    ct.globalAlpha=pulse;
    ct.shadowColor='#880000';ct.shadowBlur=12*pulse;
    sphere(x+28,y+28,28,'#661100','#330800','#993322');
    ct.shadowBlur=0;ct.globalAlpha=1;
    ct.fillStyle='rgba(255,60,0,.7)';ct.font='bold 9px monospace';ct.textAlign='center';
    ct.fillText('???',x+28,y+28+4);
    return;
  }
  if(boss.inv>0&&(boss.inv/3|0)%2===1)return;
  const rp=boss.rage?(.5+.5*Math.sin(NOW*.09)):0;
  ct.shadowColor=boss.rage?`hsl(${20+rp*30|0},100%,55%)`:`hsl(${20-(1-boss.hp/boss.maxHp)*20|0},100%,50%)`;
  ct.shadowBlur=(boss.rage?24+8*rp:16)+8*(1-boss.hp/boss.maxHp);
  sphere(x+28,y+28,28,boss.rage?`hsl(${15+rp*25|0},100%,48%)`:'#cc1100',boss.rage?`hsl(${8+rp*18|0},100%,32%)`:'#880800',boss.rage?`hsl(${28+rp*30|0},100%,65%)`:'#ff6644');
  if(boss.rage){ct.strokeStyle=`rgba(255,90,0,${.28+.22*rp})`;ct.lineWidth=3;ct.beginPath();ct.arc(x+28,y+28,32,0,Math.PI*2);ct.stroke();}
  ct.shadowBlur=0;
  // Eyes
  [[x+16,y+20],[x+38,y+20]].forEach(([ex,ey])=>{
    ct.fillStyle='#fff';ct.beginPath();ct.ellipse(ex,ey,7,8,0,0,Math.PI*2);ct.fill();
    ct.fillStyle='#ffcc00';ct.beginPath();ct.arc(ex,ey+2,5,0,Math.PI*2);ct.fill();
    ct.fillStyle='#000';ct.beginPath();ct.arc(ex+1,ey+2,3,0,Math.PI*2);ct.fill();
  });
  ct.strokeStyle='#fff';ct.lineWidth=2;ct.lineCap='round';
  ct.beginPath();ct.moveTo(x+14,y+40);ct.bezierCurveTo(x+20,y+48,x+36,y+48,x+42,y+40);ct.stroke();
  for(let t=0;t<4;t++){ct.fillStyle='#ff8800';const tx=x+16+t*7;ct.beginPath();ct.moveTo(tx,y+43);ct.lineTo(tx+3,y+49);ct.lineTo(tx+6,y+43);ct.closePath();ct.fill();}
  // HP bar
  const bw=70,bh=8,bx2=x+28-35,by2=y-20;
  ct.fillStyle='rgba(0,0,0,.7)';ct.fillRect(bx2-1,by2-1,bw+2,bh+2);
  ct.fillStyle='#440000';ct.fillRect(bx2,by2,bw,bh);
  ct.fillStyle=`hsl(${boss.hp*12|0},100%,45%)`;ct.fillRect(bx2,by2,bw*boss.hp/boss.maxHp|0,bh);
  ct.fillStyle='rgba(255,255,255,.2)';ct.fillRect(bx2,by2,bw,3);
  ct.fillStyle='#fff';ct.font='bold 7px monospace';ct.textAlign='center';ct.fillText('JEFE ♥x'+boss.hp,x+28,by2-3);
}

function drawBossProj(bp,ox){
  const x=Math.round(bp.x-ox),y=Math.round(bp.y);
  ct.shadowColor='#ff4400';ct.shadowBlur=10;
  ct.fillStyle='#ff6600';ct.beginPath();ct.arc(x,y,6,0,Math.PI*2);ct.fill();
  ct.fillStyle='#ffcc44';ct.beginPath();ct.arc(x-1,y-1,3,0,Math.PI*2);ct.fill();
  ct.shadowBlur=0;
}

// ── SPIKES ────────────────────────────────────────────────────
function drawSpike(spk,ox){
  const x=Math.round(spk.x-ox),n=Math.floor(spk.w/12);
  ct.fillStyle='#aa1500';
  for(let i=0;i<n;i++){ct.beginPath();ct.moveTo(x+i*12,spk.y+spk.h);ct.lineTo(x+i*12+6,spk.y);ct.lineTo(x+i*12+12,spk.y+spk.h);ct.closePath();ct.fill();}
  ct.fillStyle='#ee3322';
  for(let i=0;i<n;i++){ct.beginPath();ct.moveTo(x+i*12+1,spk.y+spk.h-2);ct.lineTo(x+i*12+6,spk.y+2);ct.lineTo(x+i*12+11,spk.y+spk.h-2);ct.closePath();ct.fill();}
}

// ── PROCEDURAL LEVEL GENERATOR ──────────────────────────────
function buildLvGen(lw,spd,seed,hasBoss,bossHp){
  const plats=[],ens=[],cns=[],movPlats=[],springs=[],qbs=[],spikes=[];
  function rng(i){return Math.abs((Math.sin(seed*127.1+i*311.7+seed*i*83.3)*43758.5453)%1);}
  const n=Math.floor(lw/148);
  for(let i=0;i<n;i++){
    const t=i/Math.max(1,n-1);
    const x=(180+t*(lw-380))|0;
    const y=Math.max(88,Math.min(272,(200+(rng(i)-.5)*100)|0));
    const w=48+(rng(i*2.1)*36|0);
    plats.push({x,y,w,h:16});
    if(rng(i*3.7)<.38*df().edens){const isF=rng(i*5.1)<.3;const isS=!isF&&i>2&&rng(i*17.3)<.18;ens.push(isS?{t:'s',x:x+w/2-14}:{t:isF?'f':rng(i*7.3)<.5?'k':'g',x:x+w/2,sp:spd,y:isF?y-55:undefined,amp:isF?(24+rng(i*9)*16|0):undefined});}
    if(rng(i*4.1)<.55){cns.push({x:x+4,y:y-22,w:14,h:18,col:false,fr:0,ft:0});if(rng(i*6.7)<.6)cns.push({x:x+22,y:y-22,w:14,h:18,col:false,fr:0,ft:0});}
    if(rng(i*8.3)<.2)springs.push({x:x+w/2-10,y:GY-16});
    if(rng(i*9.1)<.25)qbs.push({x:x+w/2-16,y:y-64,w:32,h:32,t:'q',hit:false,bh:0,rw:['coin','mushroom','flower','star','1up','coin','mushroom','shield'][rng(i*11.3)*8|0]});
    if(rng(i*6.3)<.18&&i>2&&i<n-2){const isY=rng(i*4.7)<.4;movPlats.push({x,y:y-36,w:60,h:16,x0:x,x1:isY?x:x+90,y0:y-36,y1:isY?y-36+60:y-36,axis:isY?'y':'x',spd:1.3+rng(i*3.3)*.9,dir:1});}
    if(i>0&&i<n-1&&rng(i*13.7)<.22*df().spsc)spikes.push({x:x+20,y:GY-12,w:48,h:12});
  }
  cns.push({x:80,y:GY-22,w:14,h:18,col:false,fr:0,ft:0},{x:104,y:GY-22,w:14,h:18,col:false,fr:0,ft:0},{x:128,y:GY-22,w:14,h:18,col:false,fr:0,ft:0});
  const flagX=lw-130;
  const res={plats,blks:qbs,cns,tubes:[],ens,checkpts:[{x:lw*.47|0,active:false}],movPlats,springs,spikes,flagX,lw};
  if(hasBoss){res.bossX=flagX-200;res.bossHp=bossHp||10;}
  return res;
}
function buildLevel6(){return buildLvGen(6400,3.2,3.7);}
function buildLevel7(){return buildLvGen(7000,3.6,4.9);}
function buildLevel8(){return buildLvGen(7600,3.9,0.7,true,12);}

const LV_BUILDERS=[buildLevel1,buildLevel2,buildLevel3,buildLevel4,buildLevel5,buildLevel6,buildLevel7,buildLevel8];

// ── FACTORIES ───────────────────────────────────────────────
function mkPlayer(){return{x:60,y:GY-34,w:20,h:34,vx:0,vy:0,dir:1,onG:false,coy:0,jBuf:0,jHeld:false,crouch:false,pwr:false,fire:false,star:0,fr:0,ft:0,inv:0,dead:false,dvy:-11,goal:false,fireCool:0,djump:0,shield:false,wallDir:0,slide:0};}
function mkEnemies(defs){const es=df().espd;return defs.map(d=>{
  if(d.t==='f'){const by=d.y||(GY-120);return{t:'f',x:d.x,y:by,baseY:by,amp:d.amp||26,ph:Math.random()*6.28,w:26,h:20,vx:-(d.sp||1.0)*es,vy:0,alive:true,stomp:false,sTimer:0,shell:false,dir:-1,fr:0,ft:0};}
  if(d.t==='s'){return{t:'s',x:d.x,y:GY-28,w:28,h:28,cooldown:45+Math.random()*30|0,dir:-1,alive:true,stomp:false,sTimer:0};}
  return{t:d.t,x:d.x,y:GY-(d.t==='k'?36:26),w:d.t==='k'?28:24,h:d.t==='k'?36:26,vx:-(d.sp||1.2)*es,vy:0,alive:true,stomp:false,sTimer:0,shell:false,dir:-1,fr:0,ft:0};
});}
function getSolids(lv){
  const s=[{x:0,y:GY,w:lw,h:200}];
  lv.plats.forEach(p=>s.push(p));
  lv.blks.forEach(b=>s.push(b));
  lv.tubes.forEach(p=>s.push(p));
  if(lv.movPlats)lv.movPlats.forEach(mp=>s.push(mp));
  return s;
}
function spawnPU(type,bx,by){powerUps.push({type,x:bx,y:by-2,w:20,h:20,vx:type==='flower'?0:1.4,vy:type==='star'?-6:0,active:true,emer:14,fr:0,ft:0});}

// ── AABB ────────────────────────────────────────────────────
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function resH(e,sl){for(const s of sl){if(!hit(e,s))continue;e.vx>0?e.x=s.x-e.w:e.x=s.x+s.w;e.vx=0;break;}}
function resV(e,sl){e.onG=false;for(const s of sl){if(!hit(e,s))continue;if(e.vy>=0){e.y=s.y-e.h;e.vy=0;e.onG=true;}else{e.y=s.y+s.h;e.vy=1;}break;}}

// ── POWER-UP SYSTEM ─────────────────────────────────────────
function standH(p){return p.pwr?44:34;}
function crouchH(p){return p.pwr?30:20;}
function growPlayer(){if(player.pwr)return;const oh=player.h,nh=player.crouch?30:44;player.pwr=true;player.h=nh;player.y-=(nh-oh);updatePwrHUD();}
function shrinkPlayer(){if(player.pwr){const oh=player.h,nh=player.crouch?20:34;player.pwr=false;player.fire=false;player.h=nh;player.y+=(oh-nh);player.inv=df().inv;updatePwrHUD();return;}pDie();}
function collectPU(type){
  SFX.pu();
  if(type==='mushroom'){if(!player.pwr){growPlayer();parts.push(new TextPop(player.x+10,player.y-8,'+TANQUE','#4caf50'));}addScore(1000);}
  else if(type==='flower'){if(!player.pwr)growPlayer();player.fire=true;parts.push(new TextPop(player.x+10,player.y-8,'+LASER','#00ccff'));addScore(1000);updatePwrHUD();}
  else if(type==='star'){player.star=600;player.inv=600;SFX.star();parts.push(new TextPop(player.x+10,player.y-8,'NUCLEO!','#ffdd00'));addScore(1000);updatePwrHUD();}
  else if(type==='1up'){lives++;setHUD();parts.push(new TextPop(player.x+10,player.y-8,'1UP! +♥','#ff88aa'));}
  else if(type==='shield'){player.shield=true;parts.push(new TextPop(player.x+10,player.y-8,'+ESCUDO','#00eeff'));addScore(1000);updatePwrHUD();}
  setHUD();
}

// ── UPDATE PLAYER ───────────────────────────────────────────
function updPlayer(p,sl){
  if(p.dead){p.y+=p.dvy;p.dvy+=GRAV;return;}
  if(p.goal){p.x+=1.5;p.ft++;if(p.ft>7){p.fr=(p.fr+1)%4;p.ft=0;}return;}
  if(chts.star9&&p.star===0){p.star=10;p.inv=10;updatePwrHUD();}
  if(p.star>0){p.star--;if(p.star===0&&!chts.star9){p.inv=0;updatePwrHUD();}}
  if(p.fireCool>0)p.fireCool--;
  const wantDuck=isD()&&p.onG,ch=crouchH(p),sh=standH(p);
  if(wantDuck&&!p.crouch){p.crouch=true;p.h=ch;p.y+=(sh-ch);if(p.onG&&Math.abs(p.vx)>=RS*.75)p.slide=24;}
  else if(!wantDuck&&p.crouch&&p.slide===0){const test={x:p.x,y:p.y-(sh-ch),w:p.w,h:sh};if(!sl.some(s=>hit(test,s))){p.crouch=false;p.h=sh;p.y-=(sh-ch);}}
  const spd=(isRn()||joyIsRunning||chts.turbo||(p.star>0&&!p.crouch))?RS+(p.star>0?.6:0)+(chts.turbo?.8:0):WS;
  if(!p.crouch){if(isL()){p.vx=-spd;p.dir=-1;}else if(isR()){p.vx=spd;p.dir=1;}else{p.vx*=.72;if(Math.abs(p.vx)<.1)p.vx=0;}}
  else if(p.slide>0){p.slide--;p.vx*=.91;if(Math.abs(p.vx)<.4)p.slide=0;}
  else{p.vx*=.6;if(Math.abs(p.vx)<.1)p.vx=0;}
  if(jpJ())p.jBuf=8;else if(p.jBuf>0)p.jBuf--;
  if(p.onG)p.coy=6;else if(p.coy>0)p.coy--;
  if(p.jBuf>0&&(p.onG||p.coy>0)&&!p.crouch){p.vy=chts.jump?JV*1.45:JV;p.jHeld=true;p.jBuf=0;p.coy=0;p.djump=0;SFX.jump();}
  else if(p.jBuf>0&&!p.onG&&p.coy<=0&&p.wallDir!==0&&!p.crouch){p.vy=JV*.9;p.vx=-p.wallDir*(RS+2);p.dir=-p.wallDir;p.jHeld=true;p.jBuf=0;p.djump=0;SFX.jump();for(let i=0;i<5;i++)parts.push(new Pop(p.x+(p.wallDir>0?p.w+2:-2),p.y+p.h*.3+Math.random()*p.h*.4,(p.wallDir>0?-1:1)*(1+Math.random()*2.5),-1-Math.random()*2,'#88ccff',14));}
  else if(p.jBuf>0&&!p.onG&&p.coy<=0&&p.djump===0&&(p.pwr||p.fire||p.star>0||chts.jump)&&!p.crouch){p.vy=chts.jump?JV*1.25:JV*.85;p.jHeld=true;p.jBuf=0;p.djump=1;SFX.jump();for(let i=0;i<6;i++)parts.push(new Pop(p.x+p.w/2,p.y+p.h*.7,(Math.random()-.5)*3,-1-Math.random()*2,'#00ccff',14));}
  const hj=isJ();if(!hj){p.jHeld=false;if(p.vy<-4)p.vy=-4;}
  if(hj&&p.jHeld&&p.vy<0){p.vy-=.28;if(p.vy<-14)p.vy=-14;}
  // Wall slide: slow fall while pressing into wall
  if(p.wallDir!==0&&!p.onG&&p.vy>1.5&&((p.wallDir<0&&isL())||(p.wallDir>0&&isR()))){p.vy=Math.min(p.vy,1.5);if(NOW%9===0)parts.push(new Pop(p.x+(p.wallDir>0?p.w:-1),p.y+p.h*.4+Math.random()*p.h*.5,p.wallDir*Math.random()*.8,-Math.random()*.5,'#8899bb',5));}
  p.vy+=GRAV;if(p.vy>16)p.vy=16;
  const prevOnG=p.onG,prevVY=p.vy;
  const preHorizVx=p.vx;
  p.x+=p.vx;p.x=Math.max(camX,Math.min(lw-p.w,p.x));resH(p,sl);
  p.wallDir=(p.onG)?0:(!p.onG&&p.vx===0&&Math.abs(preHorizVx)>0.3)?(preHorizVx>0?1:-1):0;
  p.y+=p.vy;resV(p,sl);
  // Landing feedback
  if(!prevOnG&&p.onG){
    p.djump=0;
    if(prevVY>2){
      SFX.land();
      const n=Math.min(6,Math.ceil(prevVY/3));
      for(let i=0;i<n;i++)parts.push(new Dust(p.x+p.w/2,p.y+p.h));
      if(prevVY>8)shake(4);else if(prevVY>5)shake(2);
    }
  }
  // Running dust
  if(p.onG&&Math.abs(p.vx)>=RS*.85&&(NOW%5|0)<2)parts.push(new Dust(p.x+(p.dir>0?-2:p.w+2),p.y+p.h));
  // Rainbow star trail
  if(p.star>0&&(Math.abs(p.vx)>1.2||!p.onG)){const rc=['#ff4455','#ffee00','#44ff66','#00ccff','#ff88ff'][(NOW/30|0)%5];parts.push(new Pop(p.x+p.w/2,p.y+p.h*.55,(Math.random()-.5)*2,Math.random()*1.5,rc,10));}
  if(p.y>CH+60){pDie();return;}
  if(p.inv>0)p.inv--;
  if((p.fire||p.star>0)&&jpX()&&p.fireCool<=0){
    lasers.push({x:p.x+(p.dir>0?p.w+2:-14),y:p.y+(p.pwr?18:12),w:12,h:6,vx:9*p.dir,vy:0,life:200,active:true,fr:0,ft:0});
    p.fireCool=18;SFX.laser();
    parts.push(new Pop(p.x+(p.dir>0?p.w:0),p.y+(p.pwr?20:14),p.dir*3,-1,'#ffcc00',10));
  }
  if(p.onG&&Math.abs(p.vx)>.2){p.ft++;if(p.ft>=(isRn()?4:7)){p.fr=(p.fr+1)%4;p.ft=0;}}else if(!p.onG){p.fr=p.vy<-2?4:p.vy>3?5:2;}else p.fr=0;
}

// ── UPDATE ENEMY ────────────────────────────────────────────
function updEnemy(e,sl){
  if(!e.alive)return;if(e.stomp){if(--e.sTimer<=0)e.alive=false;return;}
  if(e.x>camX+CW+120||e.x<camX-120)return;
  if(e.t==='s'){
    if(!player||player.dead||player.goal)return;
    const dx=player.x+10-e.x;e.dir=dx>0?1:-1;
    if(Math.abs(dx)<400&&--e.cooldown<=0){
      e.cooldown=(90/df().pspd)|0;
      tProjs.push({x:e.x+(dx>0?28:0),y:e.y+12,vx:(dx>0?1:-1)*3.2*df().pspd,life:230,active:true});
      SFX.shot();
    }
    return;
  }
  if(e.t==='f'){
    e.x+=e.vx;e.ph+=.05;e.y=e.baseY+Math.sin(e.ph)*e.amp;
    if(e.x<0){e.x=0;e.vx=Math.abs(e.vx);}
    e.dir=e.vx>0?1:-1;if(++e.ft>=10){e.fr=(e.fr+1)%2;e.ft=0;}
    return;
  }
  e.vy+=GRAV;if(e.vy>14)e.vy=14;
  e.x+=e.vx;for(const s of sl){if(!hit(e,s))continue;e.vx>0?(e.x=s.x-e.w,e.vx=-Math.abs(e.vx)):(e.x=s.x+s.w,e.vx=Math.abs(e.vx));break;}
  e.onG=false;e.y+=e.vy;for(const s of sl){if(!hit(e,s))continue;if(e.vy>=0){e.y=s.y-e.h;e.vy=0;e.onG=true;}else{e.y=s.y+s.h;e.vy=1;}break;}
  if(e.onG){const ex=e.vx>0?e.x+e.w+2:e.x-2;if(!sl.some(s=>ex>=s.x&&ex<=s.x+s.w&&s.y>=e.y+e.h-2&&s.y<=e.y+e.h+14))e.vx=-e.vx;}
  if(e.x<0){e.x=0;e.vx=Math.abs(e.vx);}
  if(e.y>CH+80){e.alive=false;return;}
  e.dir=e.vx>0?1:-1;if(++e.ft>=14){e.fr=(e.fr+1)%2;e.ft=0;}
}

// ── UPDATE POWER-UP ─────────────────────────────────────────
function updPU(pu,sl){
  if(!pu.active)return;if(pu.emer>0){pu.emer--;pu.y-=1;return;}
  if(pu.type!=='flower'){
    pu.vy+=GRAV*.6;if(pu.vy>12)pu.vy=12;
    pu.x+=pu.vx;for(const s of sl){if(!hit(pu,s))continue;pu.vx>0?(pu.x=s.x-pu.w,pu.vx=-pu.vx):(pu.x=s.x+s.w,pu.vx=-pu.vx);break;}
    pu.y+=pu.vy;for(const s of sl){if(!hit(pu,s))continue;if(pu.vy>=0){pu.y=s.y-pu.h;pu.vy=pu.type==='star'?-7:0;}else{pu.y=s.y+s.h;pu.vy=1;}break;}
    if(pu.y>CH+80){pu.active=false;return;}
  }
  if(hit(player,pu)){collectPU(pu.type);pu.active=false;}
}

// ── UPDATE LASER ─────────────────────────────────────────────
function updLaser(lb,sl){
  if(!lb.active)return;lb.x+=lb.vx;
  for(const s of sl){if(!hit(lb,s))continue;lb.active=false;for(let i=0;i<5;i++)parts.push(new Pop(lb.x,lb.y,(Math.random()-.5)*4,-Math.random()*3,'#ffaa00',12));break;}
  if(lb.active){for(const e of enemies){if(!e.alive||e.stomp||!hit(lb,e))continue;stompE(e);lb.active=false;parts.push(new Pop(e.x+12,e.y+8,0,-4,'#ffaa00',18));break;}}
  if(lb.x<camX-100||lb.x>camX+CW+100||--lb.life<=0)lb.active=false;
  if(++lb.ft>=4){lb.fr=(lb.fr+1)%2;lb.ft=0;}
}

// ── PARTICLES ───────────────────────────────────────────────
class Pop{constructor(x,y,vx,vy,col,life){Object.assign(this,{x,y,vx,vy,col,life,ml:life});}tick(){this.x+=this.vx;this.y+=this.vy;this.vy+=.35;this.life--;return this.life>0;}draw(ox){ct.globalAlpha=this.life/this.ml;ct.fillStyle=this.col;ct.fillRect(Math.round(this.x-ox),Math.round(this.y),4,4);ct.globalAlpha=1;}}
class TextPop{constructor(x,y,txt,col){Object.assign(this,{x,y,txt,col,life:52});}tick(){this.y-=.6;this.life--;return this.life>0;}draw(ox){ct.globalAlpha=this.life/52;ct.fillStyle=this.col;ct.font='bold 11px monospace';ct.textAlign='center';ct.fillText(this.txt,this.x-ox,this.y);ct.globalAlpha=1;}}
class Dust{
  constructor(x,y){this.x=x+(Math.random()-.5)*14;this.y=y;this.vx=(Math.random()-.5)*1.6;this.vy=-1.2-Math.random()*1.4;this.life=10+Math.random()*8|0;this.ml=this.life;this.sz=2+Math.random()*2.5;}
  tick(){this.x+=this.vx;this.y+=this.vy;this.vy+=.14;this.life--;return this.life>0;}
  draw(ox){const a=this.life/this.ml,s=this.sz*a;ct.globalAlpha=a*.55;ct.fillStyle='#fff';ct.fillRect(Math.round(this.x-ox)-s/2|0,Math.round(this.y)-s/2|0,s|0,s|0);ct.globalAlpha=1;}
}

// ── CHEATS ──────────────────────────────────────────────────
const chts={inf:false,ghost:false,jump:false,turbo:false,nospk:false,star9:false};

// ── GAME ACTIONS ────────────────────────────────────────────
function pDie(){if(player.dead||player.goal)return;player.dead=true;player.dvy=-11;SFX.die();shake(6);hap(120);dmgFlash=30;if(!chts.inf)lives--;setHUD();dTimer=90;}
function pHurt(){if(player.dead||player.goal||player.inv>0||player.star>0||chts.ghost)return;if(player.shield){player.shield=false;player.inv=df().inv*.75|0;SFX.shield();shake(3);hap(20);dmgFlash=16;parts.push(new TextPop(player.x+10,player.y-8,'ESCUDO ROTO','#00eeff'));updatePwrHUD();return;}SFX.hurt();shake(5);hap(35);dmgFlash=22;shrinkPlayer();}
function stompE(e){
  SFX.stomp();shake(2);hap(12);
  comboTimer=65;
  if(e.t==='k'&&!e.shell){
    e.shell=true;e.vx=0;e.h=20;e.y+=16;
    addScore(100*comboMult);
    parts.push(new TextPop(e.x+14,e.y,'+'+100*comboMult,'#ffaa00'));
    for(let i=0;i<4;i++)parts.push(new Pop(e.x+12,e.y+8,(Math.random()-.5)*4,-Math.random()*3,'#4488ff',16));
    if(comboMult<8)comboMult*=2;return;
  }
  e.stomp=true;e.sTimer=22;
  const base=e.t==='g'?100:200;
  const pts=base*comboMult;
  addScore(pts);
  parts.push(new TextPop(e.x+12,e.y,'+'+pts+(comboMult>1?' x'+comboMult:''),'#ffaa00'));
  const col=e.t==='g'?'#ff5533':e.t==='f'?'#cc55ff':'#4488ff';
  for(let i=0;i<6;i++)parts.push(new Pop(e.x+e.w/2,e.y+e.h/2,(Math.random()-.5)*5,-Math.random()*4-1,col,20));
  if(comboMult>1)SFX.combo(Math.min(5,comboMult));
  if(comboMult<8)comboMult*=2;
  if(Math.random()<.3)coinList.push({x:e.x+e.w/2-7,y:e.y-4,w:14,h:18,col:false,fr:0,ft:0});
}
function togglePause(){if(gst==='playing'){gst='paused';ov.classList.remove('off');ovT.textContent='PAUSA';ovT.style.color='#00ccff';ovHi.textContent='';ovM.textContent='';ovB.textContent='';ovBtn.textContent='CONTINUAR';ovBtn.style.display='';ovDiff.style.display='none';}else if(gst==='paused'){gst='playing';ov.classList.add('off');}}
function pWin(){
  if(player.goal)return;player.goal=true;wTimer=180;SFX.win();shake(3);hap(60);
  const wCols=['#ffcc00','#ff4488','#00ff88','#00ccff','#ff8800','#ffffff'];
  for(let i=0;i<32;i++){const a=Math.random()*Math.PI*2,sp=3+Math.random()*10;parts.push(new Pop(player.x+10,player.y+17,Math.cos(a)*sp,Math.sin(a)*sp-5,wCols[i%6],45+Math.random()*45|0));}
  levelEndTime=tLeft;
  const el=LEVEL_TIME[levelNum]-tLeft;
  if(bestTimes[difficulty]===0||el<bestTimes[difficulty]){bestTimes[difficulty]=el;localStorage.setItem('cosmoBT'+difficulty,bestTimes[difficulty]);}
  addScore(Math.ceil(tLeft)*5);tLeft=0;setHUD();
}
function showEnd(title,col,msg,badge,btnTxt){gst='stop';ov.classList.remove('off');ovT.textContent=title;ovT.style.color=col;ovHi.textContent='';ovM.innerHTML=msg;ovB.textContent=badge;ovBtn.textContent=btnTxt;ovBtn.style.display='';ovDiff.style.display='none';}
function initGame(){
  if(isTouchDevice&&!isFS())requestFS(document.documentElement);
  score=0;coins=0;lives=df().lives;levelNum=0;nextLvlReady=false;cpX=-1;comboMult=1;comboTimer=0;levelEndTime=0;
  hdiffEl.textContent=df().nm;hdiffEl.style.color=df().col;
  lvData=LV_BUILDERS[0]();lw=lvData.lw;
  resetRound();gst='playing';ov.classList.add('off');setHUD();updatePwrHUD();
  startMusic();
}
function resetRound(){
  camX=0;tAccum=0;dTimer=0;wTimer=0;tLeft=Math.round(LEVEL_TIME[levelNum]*df().tsc);comboMult=1;comboTimer=0;
  player=mkPlayer();
  if(cpX>=0){player.x=cpX;camX=Math.max(0,Math.min(lw-CW,cpX-CW*.38));}
  enemies=mkEnemies(lvData.ens);
  coinList=lvData.cns.map(c=>({...c,col:false,fr:0,ft:0}));
  blkList=lvData.blks.map(b=>({...b,hit:false,bh:0}));
  powerUps=[];lasers=[];parts=[];bossProjs=[];tProjs=[];dmgFlash=0;
  boss=lvData.bossX?mkBoss(lvData.bossX,lvData.bossHp):null;
  updatePwrHUD();
}

// ── UPDATE LOOP ─────────────────────────────────────────────
function update(){
  if(gst!=='playing')return;
  if(++tAccum>=60){
    tAccum=0;tLeft=Math.max(0,tLeft-1);htEl.textContent=Math.ceil(tLeft);
    if(tLeft===30)SFX.warn();
    if(tLeft>0&&tLeft<=10)SFX.warn();
    htEl.style.color=tLeft<=10&&tLeft>0?'#ff3333':tLeft<=30&&tLeft>0?'#ff8833':'';
    htEl.classList.toggle('warn',tLeft<=10&&tLeft>0);
    if(tLeft<=0&&!player.dead&&!player.goal)pDie();
  }
  if(comboTimer>0){comboTimer--;}else{comboMult=1;}
  // Move platforms and carry player
  if(lvData.movPlats&&!player.dead&&!player.goal){
    for(const mp of lvData.movPlats){
      const px=mp.x,py=mp.y;
      if(mp.axis==='x'){mp.x+=mp.spd*mp.dir;if(mp.x>=mp.x1){mp.x=mp.x1;mp.dir=-1;}if(mp.x<=mp.x0){mp.x=mp.x0;mp.dir=1;}}
      else{mp.y+=mp.spd*mp.dir;if(mp.y>=mp.y1){mp.y=mp.y1;mp.dir=-1;}if(mp.y<=mp.y0){mp.y=mp.y0;mp.dir=1;}}
      if(player.onG&&player.y+player.h>=py-1&&player.y+player.h<=py+5&&player.x+player.w>px+4&&player.x<px+mp.w-4){
        player.x+=mp.x-px;player.y+=mp.y-py;
      }
    }
  }
  const sl=getSolids(lvData);
  if(player.dead){
    updPlayer(player,[]);
    if(--dTimer<=0){
      if(lives<=0){SFX.over();stopMusic();showEnd('MISION FALLIDA','#ff4466','Puntuacion: '+String(score).padStart(6,'0'),'Record: '+String(hiScores[difficulty]).padStart(6,'0'),'INTENTAR DE NUEVO');}
      else resetRound();
    }
    return;
  }
  if(player.goal){
    if(--wTimer<=0){
      const st=levelEndTime/LEVEL_TIME[levelNum];
      const nSt=st>.5?3:st>.25?2:1;
      const stStr='<span style="color:#ffcc00;font-size:1.3rem">'+'★'.repeat(nSt)+'☆'.repeat(3-nSt)+'</span>';
      if(levelNum<MAX_LV-1){
        nextLvlReady=true;
        showEnd(LEVEL_NAMES[levelNum]+' OK','#00ff88',
          stStr+'<br>Puntos: '+String(score).padStart(6,'0')+'&nbsp;&nbsp;Cristales: x'+String(coins).padStart(2,'0'),
          'Record: '+String(hiScores[difficulty]).padStart(6,'0')+(bestTimes[difficulty]>0?' | Mejor: '+fmtTime(bestTimes[difficulty]):''),
          'MISION '+(levelNum+2));
      }else{
        nextLvlReady=false;stopMusic();
        showEnd('JUEGO COMPLETO!','#ffdd00',
          stStr+'<br>Puntos: '+String(score).padStart(6,'0')+'<br>Cristales: x'+String(coins).padStart(2,'0'),
          'Record: '+String(hiScores[difficulty]).padStart(6,'0')+(bestTimes[difficulty]>0?' | Mejor: '+fmtTime(bestTimes[difficulty]):''),
          'JUGAR DE NUEVO');
      }
    }
    updPlayer(player,[]);return;
  }
  updPlayer(player,sl);
  const tc=player.x-CW*.38;camX+=(tc-camX)*.14;camX=Math.max(0,Math.min(lw-CW,camX));
  enemies.forEach(e=>updEnemy(e,sl));
  for(const e of enemies){if(!e.alive||e.stomp||!hit(player,e))continue;const pb=player.y+player.h-player.vy;if(player.vy>0&&pb<=e.y+8){stompE(e);player.vy=-9;}else if(player.star>0){stompE(e);player.vy=-6;addScore(100);}else if(player.inv<=0&&!chts.ghost){pHurt();break;}}
  for(const c of coinList){
    if(c.col)continue;
    // Magnet pull during star mode
    if(player.star>0){const dx=player.x+10-(c.x+7),dy=player.y+player.h/2-(c.y+9),d2=dx*dx+dy*dy;if(d2<9000&&d2>1){const d=Math.sqrt(d2),f=Math.min(5,260/d);c.x+=dx/d*f;c.y+=dy/d*f;}}
    if(hit(player,c)){c.col=true;gainCoin(c.x+7,c.y);parts.push(new TextPop(c.x+7,c.y,'+200','#ffcc00'));for(let i=0;i<5;i++)parts.push(new Pop(c.x+7,c.y+9,(Math.random()-.5)*5,-1.5-Math.random()*3.5,i%2?'#ffee44':'#ffffff',10+Math.random()*8|0));}
    if(++c.ft>=6){c.fr=(c.fr+1)%4;c.ft=0;}
  }
  for(const b of blkList){
    if(b.hit){if(b.bh>0)b.bh--;continue;}
    if(player.x+player.w>b.x+2&&player.x<b.x+b.w-2&&player.y<=b.y+b.h&&player.y>=b.y+b.h-12&&player.vy<0){
      b.hit=true;b.bh=8;
      if(b.t==='q'){
        SFX.blk();
        if(b.rw==='coin'){gainCoin(b.x+14,b.y);parts.push(new Pop(b.x+14,b.y,0,-6,'#ffcc00',30));}
        else{let ty=b.rw;if(ty==='mushroom'&&player.pwr)ty='flower';spawnPU(ty,b.x+6,b.y);}
      }else{
        if(player.pwr||player.star>0){
          b.alive=false;SFX.brk();shake(2);
          for(let i=0;i<6;i++)parts.push(new Pop(b.x+Math.random()*32,b.y,(Math.random()-.5)*6,-4-Math.random()*3,'#c07030',28));
          addScore(50);
        }else{SFX.blk();b.hit=false;}
      }
    }
  }
  blkList=blkList.filter(b=>b.alive!==false);
  powerUps.forEach(pu=>updPU(pu,sl));powerUps=powerUps.filter(pu=>pu.active);
  lasers.forEach(lb=>updLaser(lb,sl));lasers=lasers.filter(lb=>lb.active);
  // Checkpoints
  if(lvData.checkpts){
    for(const cp of lvData.checkpts){
      if(!cp.active&&hit(player,{x:cp.x,y:GY-54,w:32,h:54})){
        cp.active=true;cpX=cp.x+8;SFX.cp();shake(2);hap(35);
        parts.push(new TextPop(cp.x+16,GY-60,'CHECKPOINT!','#ffee22'));
        for(let i=0;i<14;i++){const a=Math.PI*2*i/14;parts.push(new Pop(cp.x+16,GY-30,Math.cos(a)*5,Math.sin(a)*5-4,i%3===0?'#ffee22':i%3===1?'#00ff88':'#00ccff',32));}
      }
    }
  }
  // Springs
  if(lvData.springs&&!player.dead&&!player.goal){
    for(const sp of lvData.springs){
      if(player.vy>=0&&player.x+player.w>sp.x&&player.x<sp.x+20&&player.y+player.h>=sp.y&&player.y+player.h<=sp.y+20){
        player.vy=-22;player.y=sp.y-player.h;player.onG=false;
        SFX.spring();shake(3);hap(18);
        parts.push(new TextPop(sp.x+10,sp.y-12,'BOING!','#00ff88'));
        for(let i=0;i<5;i++)parts.push(new Pop(sp.x+10,sp.y,(Math.random()-.5)*4,-Math.random()*4,'#66ff88',16));
      }
    }
  }
  // Spikes = instant death
  if(lvData.spikes&&player.inv<=0&&player.star<=0&&!chts.nospk){
    for(const spk of lvData.spikes){if(hit(player,spk)){pDie();break;}}
  }
  // Boss
  if(boss)updBoss(sl);
  // Boss projectiles
  if(boss&&boss.alive){
    for(const bp of bossProjs){
      if(!bp.active)continue;
      bp.x+=bp.vx;bp.y+=bp.vy;bp.life--;
      if(bp.life<=0||bp.y>CH+40){bp.active=false;continue;}
      if(!player.dead&&!player.goal&&!chts.ghost&&hit(player,{x:bp.x-6,y:bp.y-6,w:12,h:12})){bp.active=false;pHurt();continue;}
      for(const lb of lasers){if(lb.active&&hit(lb,{x:bp.x-6,y:bp.y-6,w:12,h:12})){bp.active=false;lb.active=false;for(let i=0;i<4;i++)parts.push(new Pop(bp.x,bp.y,(Math.random()-.5)*5,-Math.random()*4,'#ff8800',16));break;}}
    }
    bossProjs=bossProjs.filter(bp=>bp.active);
  }else if(!boss||!boss.alive){bossProjs=[];}
  // Turret projectiles
  for(const tp of tProjs){
    if(!tp.active)continue;
    tp.x+=tp.vx;tp.life--;
    if(tp.life<=0||tp.x<camX-60||tp.x>camX+CW+60){tp.active=false;continue;}
    if(!player.dead&&!player.goal&&!chts.ghost&&hit(player,{x:tp.x-5,y:tp.y-5,w:10,h:10})){tp.active=false;pHurt();continue;}
    for(const lb of lasers){if(lb.active&&hit(lb,{x:tp.x-5,y:tp.y-5,w:10,h:10})){tp.active=false;lb.active=false;for(let i=0;i<3;i++)parts.push(new Pop(tp.x,tp.y,(Math.random()-.5)*4,-Math.random()*3,'#ff8800',12));break;}}
  }
  tProjs=tProjs.filter(tp=>tp.active);
  if((!boss||!boss.alive)&&hit(player,{x:lvData.flagX+14,y:60,w:6,h:GY-60}))pWin();
  parts=parts.filter(p=>p.tick());
}

function lg(x1,y1,x2,y2,c1,c2){const g=ct.createLinearGradient(x1,y1,x2,y2);g.addColorStop(0,c1);g.addColorStop(1,c2);return g;}
function rr(x,y,w,h,r){ct.beginPath();ct.moveTo(x+r,y);ct.lineTo(x+w-r,y);ct.arcTo(x+w,y,x+w,y+r,r);ct.lineTo(x+w,y+h-r);ct.arcTo(x+w,y+h,x+w-r,y+h,r);ct.lineTo(x+r,y+h);ct.arcTo(x,y+h,x,y+h-r,r);ct.lineTo(x,y+r);ct.arcTo(x,y,x+r,y,r);ct.closePath();}
function box3d(x,y,w,h,d,cT,cF,cS){
  ct.fillStyle=cT;ct.beginPath();ct.moveTo(x,y);ct.lineTo(x+w,y);ct.lineTo(x+w+d,y-d);ct.lineTo(x+d,y-d);ct.closePath();ct.fill();
  ct.fillStyle=cF;ct.fillRect(x,y,w,h);
  ct.fillStyle=cS;ct.beginPath();ct.moveTo(x+w,y);ct.lineTo(x+w+d,y-d);ct.lineTo(x+w+d,y+h-d);ct.lineTo(x+w,y+h);ct.closePath();ct.fill();
}
function sphere(cx,cy,r,col,dark,spec){
  ct.fillStyle=col;ct.beginPath();ct.arc(cx,cy,r,0,Math.PI*2);ct.fill();
  ct.fillStyle=dark;ct.beginPath();ct.arc(cx+r*.15,cy+r*.3,r*.7,0,Math.PI*2);ct.fill();
  ct.fillStyle=spec;ct.beginPath();ct.arc(cx-r*.28,cy-r*.28,r*.3,0,Math.PI*2);ct.fill();
  ct.globalAlpha=.35;ct.fillStyle='#fff';ct.beginPath();ct.arc(cx-r*.18,cy-r*.18,r*.15,0,Math.PI*2);ct.fill();ct.globalAlpha=1;
}

// ── BACKGROUND ──────────────────────────────────────────────
const BG_TYPE=[0,0,0,1,2,1,2,1];

    const planMX=(camX*.007)%600;

  }
}

// ── PLATFORMS ───────────────────────────────────────────────
const PLAT_COLS=[['#f0d060','#d4aa30','#a07820'],['#e07840','#c05820','#903810'],['#9070e0','#7050c0','#503098'],['#e030d0','#b010b0','#7a0090'],['#e04010','#c02000','#801000'],['#30c0e0','#1090b0','#006880'],['#8030e0','#6010c0','#400890'],['#e0c010','#c09000','#806000']];
function drawPlat(p,ox){
  const x=Math.round(p.x-ox);
  ct.globalAlpha=.2;ct.fillStyle='#000';ct.fillRect(x+3,p.y+18,p.w,5);ct.globalAlpha=1;
  const [cT,cF,cS]=PLAT_COLS[Math.min(levelNum,7)]||PLAT_COLS[0];
  ct.fillStyle=lg(x,p.y-4,x,p.y,cT,cF);
  ct.beginPath();ct.moveTo(x,p.y);ct.lineTo(x+p.w,p.y);ct.lineTo(x+p.w+4,p.y-4);ct.lineTo(x+4,p.y-4);ct.closePath();ct.fill();
  ct.fillStyle=cS;ct.beginPath();ct.moveTo(x+p.w,p.y);ct.lineTo(x+p.w+4,p.y-4);ct.lineTo(x+p.w+4,p.y+12);ct.lineTo(x+p.w,p.y+16);ct.closePath();ct.fill();
  ct.fillStyle=lg(x,p.y,x,p.y+16,cF,cS);ct.fillRect(x,p.y,p.w,16);
  ct.strokeStyle='rgba(255,255,255,.45)';ct.lineWidth=1;ct.beginPath();ct.moveTo(x,p.y+.5);ct.lineTo(x+p.w,p.y+.5);ct.stroke();
  // Level-specific surface detail
  const bgt2=BG_TYPE[Math.min(levelNum,7)]||0;
  if(bgt2===0){
    ct.fillStyle=HILL_COLS[Math.min(levelNum,7)];
    for(let i=4;i<p.w-4;i+=8){ct.beginPath();ct.moveTo(x+i,p.y-1);ct.lineTo(x+i+2,p.y-3);ct.lineTo(x+i+4,p.y-1);ct.fill();}
  }else if(bgt2===1){
    ct.strokeStyle='rgba(0,220,255,.18)';ct.lineWidth=1;
    ct.beginPath();ct.moveTo(x+4,p.y+8);ct.lineTo(x+p.w-4,p.y+8);ct.stroke();
    if(p.w>48){ct.beginPath();ct.moveTo(x+p.w/2,p.y+4);ct.lineTo(x+p.w/2,p.y+12);ct.stroke();}
  }else{
    ct.shadowColor='#ff5500';ct.shadowBlur=4;
    ct.strokeStyle='rgba(255,80,0,.35)';ct.lineWidth=1;
    ct.beginPath();ct.moveTo(x+3,p.y+6);ct.lineTo(x+p.w*.45,p.y+11);ct.lineTo(x+p.w-3,p.y+6);ct.stroke();
    ct.shadowBlur=0;
  }
}

// ── MOVING PLATFORMS ────────────────────────────────────────
function drawMovPlat(mp,ox){
  const x=Math.round(mp.x-ox),pulse=.5+.5*Math.sin(NOW*.006);
  ct.globalAlpha=.2;ct.fillStyle='#000';ct.fillRect(x+3,mp.y+18,mp.w,5);ct.globalAlpha=1;
  // Teal/cyan gradient top face
  ct.fillStyle=lg(x,mp.y-4,x,mp.y,'#60e8f8','#28b8d0');
  ct.beginPath();ct.moveTo(x,mp.y);ct.lineTo(x+mp.w,mp.y);ct.lineTo(x+mp.w+4,mp.y-4);ct.lineTo(x+4,mp.y-4);ct.closePath();ct.fill();
  ct.fillStyle='#186880';ct.beginPath();ct.moveTo(x+mp.w,mp.y);ct.lineTo(x+mp.w+4,mp.y-4);ct.lineTo(x+mp.w+4,mp.y+12);ct.lineTo(x+mp.w,mp.y+16);ct.closePath();ct.fill();
  ct.fillStyle=lg(x,mp.y,x,mp.y+16,'#28b8d0','#186880');ct.fillRect(x,mp.y,mp.w,16);
  // Pulsing top edge glow
  ct.shadowColor='#00eeff';ct.shadowBlur=4+3*pulse;
  ct.strokeStyle='rgba(0,230,255,.8)';ct.lineWidth=1.5;ct.beginPath();ct.moveTo(x,mp.y+.5);ct.lineTo(x+mp.w,mp.y+.5);ct.stroke();
  ct.shadowBlur=0;
  // Direction arrow
  const mid=x+(mp.w>>1);
  ct.fillStyle=`rgba(0,230,255,${.5+.3*pulse})`;ct.font='9px monospace';ct.textAlign='center';ct.textBaseline='middle';
  ct.fillText(mp.axis==='y'?'↕':'↔',mid,mp.y+8);
}

// ── BLOCKS ──────────────────────────────────────────────────
function drawBlock(b,ox){
  const x=Math.round(b.x-ox),y=b.bh>0?b.y-Math.sin(b.bh/8*Math.PI)*5:b.y,d=5;
  if(b.t==='q'){
    if(b.hit){
      box3d(x,y,32,32,d,'#888870','#7a7a60','#606050');
      ct.strokeStyle='#aaa890';ct.lineWidth=1;ct.strokeRect(x+.5,y+.5,31,31);
    }else{
      box3d(x,y,32,32,d,'#ffee22','#ffcc00','#cc9900');
      ct.shadowColor='#ffaa00';ct.shadowBlur=8;ct.strokeStyle='#ff8800';ct.lineWidth=2;ct.strokeRect(x+.5,y+.5,31,31);ct.shadowBlur=0;
      ct.strokeStyle='#ffe060';ct.lineWidth=1;ct.strokeRect(x+3.5,y+3.5,25,25);
      ct.fillStyle='#883300';ct.font='bold 20px monospace';ct.textAlign='center';ct.textBaseline='middle';ct.fillText('?',x+16,y+18);
      ct.globalAlpha=.25;ct.fillStyle='#fff';ct.beginPath();ct.moveTo(x+d,y-d);ct.lineTo(x+32+d,y-d);ct.lineTo(x+32,y);ct.lineTo(x,y);ct.closePath();ct.fill();ct.globalAlpha=1;
    }
  }else{
    box3d(x,y,32,32,d,'#d09050','#c07030','#8b4e18');
    ct.strokeStyle='#a06028';ct.lineWidth=1;
    [[x,y+15,x+32,y+15],[x+16,y,x+16,y+15],[x+8,y+15,x+8,y+32],[x+24,y+15,x+24,y+32]].forEach(([x1,y1,x2,y2])=>{ct.beginPath();ct.moveTo(x1,y1);ct.lineTo(x2,y2);ct.stroke();});
    ct.globalAlpha=.1;ct.fillStyle='#fff';ct.beginPath();ct.moveTo(x+d,y-d);ct.lineTo(x+32+d,y-d);ct.lineTo(x+32,y);ct.lineTo(x,y);ct.closePath();ct.fill();ct.globalAlpha=1;
  }
}

// ── TUBES ───────────────────────────────────────────────────
function drawTube(p,ox){
  const x=Math.round(p.x-ox),tw=p.w;
  ct.globalAlpha=.18;ct.fillStyle='#000';ct.fillRect(x+4,p.y+p.h,tw-4,6);ct.globalAlpha=1;
  ct.fillStyle=lg(x,p.y,x+tw,p.y,'#227a22','#44cc44');ct.fillRect(x+4,p.y+16,tw-8,p.h-16);
  ct.fillStyle=lg(x+5,p.y+16,x+5,p.y+p.h,'rgba(255,255,255,.16)','rgba(255,255,255,0)');ct.fillRect(x+6,p.y+18,6,p.h-20);
  ct.fillStyle=lg(x,p.y,x+tw,p.y,'#166616','#33aa33');ct.fillRect(x,p.y,tw,16);
  ct.fillStyle=lg(x+2,p.y+2,x+2,p.y+12,'rgba(255,255,255,.16)','rgba(255,255,255,.03)');ct.fillRect(x+2,p.y+2,tw-4,12);
  ct.fillStyle='#145514';ct.beginPath();ct.ellipse(x+tw/2,p.y+2,tw/2-1,5,0,0,Math.PI*2);ct.fill();
  ct.fillStyle='#28aa28';ct.beginPath();ct.ellipse(x+tw/2,p.y+2,tw/2-3,3,0,0,Math.PI*2);ct.fill();
}

// ── CRYSTALS ────────────────────────────────────────────────
function drawCrystal(c,ox){
  if(c.col)return;
  const x=Math.round(c.x-ox),y=c.y,spin=[0,1,2,1][c.fr];
  const widths=[10,7,4,7],offs=[2,3.5,5,3.5];
  const w=widths[spin],o=offs[spin];
  const pulse=.6+.4*Math.sin(NOW*.007+c.x*.03);
  ct.shadowColor='#ffcc00';ct.shadowBlur=6*pulse;
  ct.fillStyle=lg(x+o,y,x+o+w,y,'#ffee22','#ffaa00');ct.fillRect(x+o,y+3,w,12);
  ct.fillStyle='#fff5a0';ct.fillRect(x+o+1,y+4,Math.max(1,w-3),5);
  ct.fillStyle='#ffee44';ct.beginPath();ct.moveTo(x+7,y);ct.lineTo(x+o+w,y+4);ct.lineTo(x+o,y+4);ct.closePath();ct.fill();
  ct.fillStyle='#cc6600';ct.beginPath();ct.moveTo(x+o,y+15);ct.lineTo(x+7,y+18);ct.lineTo(x+o+w,y+15);ct.closePath();ct.fill();
  ct.shadowBlur=0;
  ct.fillStyle='#fff';ct.fillRect(x+6,y,2,2);
}

// ── CHECKPOINT ──────────────────────────────────────────────
function drawCheckpoint(cp,ox){
  const x=Math.round(cp.x-ox),active=cp.active;
  ct.fillStyle=active?'#c0a020':'#888';ct.fillRect(x+7,GY-52,3,52);
  const fy=GY-52+Math.sin(NOW*.004)*(active?5:2);
  ct.fillStyle=active?'#ffee22':'#bbb';
  ct.beginPath();ct.moveTo(x+10,fy);ct.lineTo(x+30,fy+8);ct.lineTo(x+10,fy+16);ct.closePath();ct.fill();
  ct.fillStyle=active?'#884400':'#666';ct.font='bold 7px monospace';ct.textAlign='center';ct.textBaseline='middle';ct.fillText(active?'OK':'CP',x+20,fy+8);
  if(active){
    const pulse=.5+.5*Math.sin(NOW*.006);
    ct.shadowColor='#ffee22';ct.shadowBlur=8+5*pulse;
    ct.strokeStyle='#ffee22';ct.lineWidth=1.5;ct.beginPath();ct.arc(x+8,GY-52,5,0,Math.PI*2);ct.stroke();
    ct.shadowBlur=0;
  }
}

// ── SPRINGS ─────────────────────────────────────────────────
function drawSpring(sp,ox){
  const x=Math.round(sp.x-ox),y=sp.y,b=(NOW/90|0)%4<2?0:1;
  ct.globalAlpha=.18;ct.fillStyle='#000';ct.fillRect(x+1,y+14,18,4);ct.globalAlpha=1;
  ct.fillStyle='#1a7a3a';ct.fillRect(x+1,y+12,18,4);
  ct.strokeStyle='#33cc66';ct.lineWidth=2;
  for(let i=0;i<3;i++){ct.beginPath();ct.ellipse(x+10,y+11-i*4+b,6-i,1.5,0,0,Math.PI*2);ct.stroke();}
  ct.shadowColor='#00ff66';ct.shadowBlur=6+3*Math.sin(NOW*.006);
  ct.fillStyle='#66ff88';ct.fillRect(x+3,y-1+b,14,3);
  ct.strokeStyle='rgba(0,255,100,.6)';ct.lineWidth=1;ct.beginPath();ct.ellipse(x+10,y+b,7,1.5,0,0,Math.PI*2);ct.stroke();
  ct.shadowBlur=0;
}

// ── BEACON / GOAL ────────────────────────────────────────────
function drawBeacon(fx,ox){
  const x=Math.round(fx-ox);
  box3d(x+4,GY-14,22,14,4,'#f0e870','#c8c040','#a09820');
  ct.fillStyle=lg(x+14,70,x+18,70,'#c0a030','#806820');ct.fillRect(x+14,70,4,GY-84);
  const pulse=.5+.5*Math.sin(NOW*.005);
  ct.shadowColor='#ffcc00';ct.shadowBlur=16+10*pulse;
  sphere(x+16,78,7+pulse*2,'#ffcc00','#cc8800','#ffff88');
  ct.shadowBlur=0;
  ct.globalAlpha=.2+.15*pulse;ct.strokeStyle='#ffcc00';ct.lineWidth=2;
  ct.beginPath();ct.arc(x+16,78,12+pulse*3,0,Math.PI*2);ct.stroke();ct.globalAlpha=1;
  const fy=72+Math.sin(NOW*.003)*4;
  ct.fillStyle='#ff4422';ct.beginPath();ct.moveTo(x+18,fy);ct.lineTo(x+40,fy+7);ct.lineTo(x+18,fy+14);ct.closePath();ct.fill();
  ct.fillStyle='#fff';ct.font='bold 7px monospace';ct.textAlign='center';ct.textBaseline='middle';ct.fillText('OK',x+31,fy+7);
}

// ── POWER-UPS ───────────────────────────────────────────────
function drawPU(pu,ox){
  if(pu.emer>0)return;
  const x=Math.round(pu.x-ox),y=Math.round(pu.y);
  ct.globalAlpha=.18;ct.fillStyle='#000';ct.beginPath();ct.ellipse(x+10,y+21,8,2,0,0,Math.PI*2);ct.fill();ct.globalAlpha=1;
  if(pu.type==='mushroom'){
    ct.fillStyle=lg(x+4,y,x+16,y,'#e8e8f8','#aaaacc');ct.fillRect(x+5,y+4,10,14);
    ct.fillStyle='#eeeeff';ct.fillRect(x+7,y+5,6,12);
    ct.fillStyle='#aaaacc';ct.beginPath();ct.ellipse(x+10,y+4,6,2.5,0,0,Math.PI*2);ct.fill();ct.beginPath();ct.ellipse(x+10,y+18,6,2.5,0,0,Math.PI*2);ct.fill();
    ct.fillStyle='#0088bb';ct.fillRect(x+5,y+9,10,3);
    ct.fillStyle='#888899';ct.fillRect(x+8,y+1,4,3);
  }else if(pu.type==='flower'){
    box3d(x+1,y+4,16,13,3,'#dd4400','#bb2200','#882200');
    ct.fillStyle='#ff8800';ct.fillRect(x+3,y+7,4,3);ct.fillRect(x+9,y+7,4,3);
    ct.fillStyle=lg(x+17,y+8,x+25,y+8,'#ff6600','#aa3300');ct.fillRect(x+17,y+9,8,4);
    ct.fillStyle='#333';ct.beginPath();ct.ellipse(x+25,y+11,2.5,2,0,0,Math.PI*2);ct.fill();
    const fc=(NOW/140|0)%2===0?'#ff8800':'#ffcc00';
    ct.shadowColor=fc;ct.shadowBlur=6;ct.fillStyle=fc;ct.beginPath();ct.arc(x+25,y+11,2,0,Math.PI*2);ct.fill();ct.shadowBlur=0;
  }else if(pu.type==='star'){
    const sc=(NOW/80|0)%2===0?'#ffee00':'#ffe060';
    ct.shadowColor='#ffcc00';ct.shadowBlur=12+5*Math.sin(NOW*.006);
    ct.fillStyle=sc;ct.beginPath();
    for(let i=0;i<10;i++){const r=i%2===0?10:4,a=i/10*Math.PI*2-Math.PI/2;i===0?ct.moveTo(x+10+r*Math.cos(a),y+10+r*Math.sin(a)):ct.lineTo(x+10+r*Math.cos(a),y+10+r*Math.sin(a));}
    ct.closePath();ct.fill();ct.shadowBlur=0;
    sphere(x+10,y+10,4,'#ffee66','#ffff00','#fff');
  }else if(pu.type==='1up'){
    box3d(x+1,y+5,16,12,3,'#1f7a25','#166018','#0e4410');
    ct.fillStyle=lg(x+1,y+5,x+1,y+11,'#2a9a30','#166018');rr(x+2,y+5,14,6,3);ct.fill();
    ct.fillStyle='#1a3a1a';ct.beginPath();ct.ellipse(x+9,y+9,4,3,0,0,Math.PI*2);ct.fill();
    ct.fillStyle='rgba(100,255,120,.25)';ct.beginPath();ct.ellipse(x+9,y+9,4,3,0,0,Math.PI*2);ct.fill();
    ct.fillStyle='#ccffcc';ct.font='bold 5px monospace';ct.textAlign='center';ct.textBaseline='middle';ct.fillText('1UP',x+9,y+16);
  }else if(pu.type==='shield'){
    const pulse=.5+.5*Math.sin(NOW*.009);
    ct.shadowColor='#00eeff';ct.shadowBlur=10+6*pulse;
    ct.fillStyle=`rgba(0,180,230,${.25+.1*pulse})`;ct.beginPath();ct.arc(x+10,y+10,10,0,Math.PI*2);ct.fill();
    ct.strokeStyle='#00eeff';ct.lineWidth=2;ct.beginPath();ct.arc(x+10,y+10,9,0,Math.PI*2);ct.stroke();
    ct.strokeStyle=`rgba(0,230,255,${.6+.3*pulse})`;ct.lineWidth=1;ct.beginPath();ct.arc(x+10,y+10,5.5,0,Math.PI*2);ct.stroke();
    ct.fillStyle='#00eeff';ct.font='bold 10px monospace';ct.textAlign='center';ct.textBaseline='middle';ct.fillText('E',x+10,y+11);
    ct.shadowBlur=0;
  }
}

// ── ASTRONAUT ───────────────────────────────────────────────
function drawAstronaut(bx,sy,pwr,fire,star,crouch,fr,dir){
  const d=dir||1,hw=20;
  ct.save();ct.translate(bx+hw/2,0);if(d===-1)ct.scale(-1,1);ct.translate(-hw/2,0);
  const x=0,y=sy,ph=NOW/70&3;
  const starCols=['#ff4455','#ffee00','#44ff66','#00ccff'];
  const helmetBase=star>0?starCols[ph]:'#d0d0e0';
  const helmetDark=star>0?starCols[(ph+2)%4]:'#707090';
  const helmetSpec=star>0?'#fff':'#eeeeff';
  const visorC=star>0?starCols[(ph+1)%4]:'#0088cc';
  const bodyC=fire?'#ffe066':'#ddddf0';
  const suitC=fire?'#aa2200':'#1a306a';
  if(star>0){ct.shadowColor=starCols[ph];ct.shadowBlur=10;}
  if(crouch){
    sphere(x+10,y+8,8,helmetBase,helmetDark,helmetSpec);
    ct.fillStyle=visorC;ct.beginPath();ct.ellipse(x+14,y+9,5,3,-.2,0,Math.PI*2);ct.fill();
    ct.globalAlpha=.5;ct.fillStyle='#fff';ct.beginPath();ct.ellipse(x+15,y+8,2,1,-.3,0,Math.PI*2);ct.fill();ct.globalAlpha=1;
    ct.fillStyle=lg(x,y+16,x,y+(pwr?30:20),bodyC,suitC);rr(x+1,y+16,18,pwr?10:8,3);ct.fill();
    ct.fillStyle=suitC;ct.fillRect(x+2,y+(pwr?23:21),7,3);ct.fillRect(x+11,y+(pwr?23:21),7,3);
  }else if(pwr){
    const lo=fr===4?-3:fr===5?4:[0,2,0,-2][fr%4];
    sphere(x+10,y+10,10,helmetBase,helmetDark,helmetSpec);
    ct.fillStyle=visorC;ct.beginPath();ct.ellipse(x+14,y+11,6,4,-.15,0,Math.PI*2);ct.fill();
    ct.globalAlpha=.5;ct.fillStyle='#fff';ct.beginPath();ct.ellipse(x+15,y+10,2.5,1.5,-.2,0,Math.PI*2);ct.fill();ct.globalAlpha=1;
    if(fire){ct.fillStyle=lg(x-4,y+14,x,y+14,'#882200','#cc3300');ct.fillRect(x-4,y+14,5,10);ct.fillStyle='#ff6600';ct.fillRect(x-4,y+15,4,2);}
    ct.fillStyle=lg(x+1,y+20,x+1,y+38,bodyC,suitC);rr(x+1,y+20,18,17,4);ct.fill();
    ct.fillStyle=suitC;ct.fillRect(x-1,y+29,22,5);ct.fillStyle='#2255aa';ct.fillRect(x+7,y+30,6,3);
    ct.fillStyle=suitC;ct.fillRect(x+2,y+22,4,8);ct.fillRect(x+14,y+22,4,8);
    ct.fillStyle=lg(x,y+34,x,y+44,suitC,'#111128');rr(x+1,y+34,7,8,3);ct.fill();rr(x+12,y+34,7,8,3);ct.fill();
    const lo2=fr===4?-3:fr===5?4:[0,2,0,-2][fr%4];
    ct.fillStyle='#111128';rr(x-1,y+38+lo2,10,4,2);ct.fill();rr(x+11,y+38-lo2,10,4,2);ct.fill();
    ct.fillStyle='rgba(255,255,255,.1)';ct.fillRect(x,y+38+lo2,4,2);ct.fillRect(x+12,y+38-lo2,4,2);
  }else{
    const lo=fr===4?-3:fr===5?4:[0,2,0,-2][fr%4];
    sphere(x+10,y+8,9,helmetBase,helmetDark,helmetSpec);
    ct.fillStyle=visorC;ct.beginPath();ct.ellipse(x+14,y+9,5,3.5,-.15,0,Math.PI*2);ct.fill();
    ct.globalAlpha=.5;ct.fillStyle='#fff';ct.beginPath();ct.ellipse(x+15,y+8,2,1.5,-.2,0,Math.PI*2);ct.fill();ct.globalAlpha=1;
    ct.fillStyle=lg(x+1,y+17,x+1,y+31,bodyC,suitC);rr(x+1,y+17,18,13,3);ct.fill();
    ct.fillStyle=suitC;ct.fillRect(x-1,y+22,22,4);ct.fillRect(x+2,y+19,3,6);ct.fillRect(x+15,y+19,3,6);
    ct.fillStyle=lg(x,y+27,x,y+34,suitC,'#111128');rr(x+1,y+27,7,6,2);ct.fill();rr(x+12,y+27,7,6,2);ct.fill();
    ct.fillStyle='#111128';rr(x-1,y+30+lo,10,3,2);ct.fill();rr(x+11,y+30-lo,10,3,2);ct.fill();
    ct.fillStyle='rgba(255,255,255,.1)';ct.fillRect(x,y+30+lo,4,1);ct.fillRect(x+12,y+30-lo,4,1);
  }
  ct.shadowBlur=0;ct.restore();
}
function drawPlayer(p,ox){
  if(!p)return;
  if(p.inv>0&&p.star===0&&(p.inv/4|0)%2===0)return;
  if(!p.dead){ct.globalAlpha=.18;ct.fillStyle='#000';ct.beginPath();ct.ellipse(Math.round(p.x-ox)+10,GY+2,10,3,0,0,Math.PI*2);ct.fill();ct.globalAlpha=1;}
  drawAstronaut(Math.round(p.x-ox),Math.round(p.y),p.pwr,p.fire,p.star,p.crouch,p.fr,p.dir);
  if(p.shield&&!p.dead){const sp=.5+.5*Math.sin(NOW*.009),px=Math.round(p.x-ox),py=Math.round(p.y);ct.shadowColor='#00eeff';ct.shadowBlur=12+6*sp;ct.strokeStyle=`rgba(0,230,255,${.55+.3*sp})`;ct.lineWidth=2;ct.beginPath();ct.ellipse(px+p.w/2,py+p.h/2,p.w/2+8,p.h/2+9,0,0,Math.PI*2);ct.stroke();ct.shadowBlur=0;}
}

// ── BLOB ENEMY ──────────────────────────────────────────────
function drawBlob(e,ox){
  const x=Math.round(e.x-ox),y=Math.round(e.y),cx2=x+12,cy2=y+13;
  if(e.stomp){
    ct.fillStyle='#bb3311';ct.beginPath();ct.ellipse(cx2,y+e.h-3,12,3,0,0,Math.PI*2);ct.fill();
    ct.fillStyle='#dd5533';ct.beginPath();ct.ellipse(cx2,y+e.h-3,8,2,0,0,Math.PI*2);ct.fill();return;
  }
  ct.globalAlpha=.2;ct.fillStyle='#000';ct.beginPath();ct.ellipse(cx2,y+e.h+1,10,2.5,0,0,Math.PI*2);ct.fill();ct.globalAlpha=1;
  sphere(cx2,cy2,12,'#cc4422','#881100','#ff7755');
  ct.fillStyle='rgba(255,140,110,.35)';ct.beginPath();ct.ellipse(cx2,cy2+3,8,7,0,0,Math.PI*2);ct.fill();
  const exo=e.vx<0?-1:1;
  [x+4,x+18].forEach((ex,i)=>{
    ct.fillStyle='#fff';ct.beginPath();ct.ellipse(ex+exo,y+7,4.5,5,i===0?-.15:.15,0,Math.PI*2);ct.fill();
    ct.fillStyle='#220000';ct.beginPath();ct.arc(ex+exo*1.2,y+8,3,0,Math.PI*2);ct.fill();
    ct.fillStyle='#cc0000';ct.beginPath();ct.arc(ex+exo*.8,y+7.5,2,0,Math.PI*2);ct.fill();
    ct.fillStyle='rgba(255,255,255,.75)';ct.beginPath();ct.arc(ex+exo+1.2,y+6.5,1,0,Math.PI*2);ct.fill();
  });
  ct.strokeStyle='#660000';ct.lineWidth=2;ct.lineCap='round';
  ct.beginPath();ct.moveTo(x+1,y+3);ct.quadraticCurveTo(x+5,y+2,x+9,y+5);ct.stroke();
  ct.beginPath();ct.moveTo(x+23,y+3);ct.quadraticCurveTo(x+19,y+2,x+15,y+5);ct.stroke();
  const fo=e.fr===0?2:-2;
  [{cx:x+6+fo},{cx:x+18-fo}].forEach(({cx:fc})=>sphere(fc,y+e.h-1,5,'#aa3311','#771100','#cc5533'));
}

// ── DROID ENEMY ─────────────────────────────────────────────
function drawDroid(e,ox){
  const x=Math.round(e.x-ox),y=Math.round(e.y);
  if(e.shell){
    sphere(x+14,y+14,12,'#223344','#111a22','#4a6680');
    ct.shadowColor='#00aacc';ct.shadowBlur=8;ct.strokeStyle='#00aacc';ct.lineWidth=1.5;ct.beginPath();ct.arc(x+14,y+14,11,0,Math.PI*2);ct.stroke();ct.shadowBlur=0;
    ct.globalAlpha=.3;ct.strokeStyle='#00ccff';ct.lineWidth=1;
    ct.beginPath();ct.moveTo(x+14,y+3);ct.lineTo(x+14,y+25);ct.stroke();ct.beginPath();ct.moveTo(x+3,y+14);ct.lineTo(x+25,y+14);ct.stroke();
    ct.globalAlpha=1;return;
  }
  ct.save();if(e.dir>0){ct.translate(x+e.w,0);ct.scale(-1,1);ct.translate(-e.w,0);}
  const bx=e.dir>0?-e.w+x:x;
  ct.globalAlpha=.18;ct.fillStyle='#000';ct.beginPath();ct.ellipse(bx+14,y+e.h+1,10,2,0,0,Math.PI*2);ct.fill();ct.globalAlpha=1;

  ct.globalAlpha=.18;ct.fillStyle='#000';ct.beginPath();ct.ellipse(x+14,y+e.h+1,11,2.5,0,0,Math.PI*2);ct.fill();ct.globalAlpha=1;
  ct.fillStyle=lg(x,y+8,x,y+e.h,'#1a3a4a','#0d2030');rr(x+2,y+8,24,20,4);ct.fill();
  ct.fillStyle='#1e4a5c';ct.fillRect(x+4,y+12,8,6);ct.fillRect(x+16,y+12,8,6);
  const bd=e.dir>0;
  ct.fillStyle='#224455';ct.fillRect(bd?x+22:x-6,y+13,10,5);ct.fillRect(bd?x+28:x-10,y+14,4,3);
  const pulse=.6+.4*Math.sin(NOW*.07);
  ct.shadowColor='#ff6600';ct.shadowBlur=7*pulse;
  ct.fillStyle=`rgba(255,${70+pulse*50|0},0,${.75+.25*pulse})`;
  ct.beginPath();ct.arc(x+14,y+5,3.5,0,Math.PI*2);ct.fill();ct.shadowBlur=0;
  ct.fillStyle='#0a1e2a';rr(x,y+24,28,8,3);ct.fill();
  ct.fillStyle='#183040';
  for(let i=0;i<3;i++){ct.beginPath();ct.arc(x+5+i*9,y+28,3,0,Math.PI*2);ct.fill();}
}
function drawTurretProj(tp,ox){

// ── FLYER ENEMY (UFO drone) ─────────────────────────────────
function drawFlyer(e,ox){
  const x=Math.round(e.x-ox),y=Math.round(e.y),cx2=x+13,cy2=y+9;
  if(e.stomp){
    ct.fillStyle='#7722aa';ct.beginPath();ct.ellipse(cx2,y+e.h-2,13,3,0,0,Math.PI*2);ct.fill();
    ct.fillStyle='#aa44dd';ct.beginPath();ct.ellipse(cx2,y+e.h-2,8,2,0,0,Math.PI*2);ct.fill();return;
  }
  const wob=Math.sin(NOW*.012)*1.2;
  ct.globalAlpha=.16;ct.fillStyle='#000';ct.beginPath();ct.ellipse(cx2,GY+2,11,2.5,0,0,Math.PI*2);ct.fill();ct.globalAlpha=1;
  // Tractor beam (always visible, animated)

  bg.addColorStop(0,'rgba(220,120,255,.9)');bg.addColorStop(1,'rgba(180,60,255,0)');
  ct.globalAlpha=beamA;ct.fillStyle=bg;
  ct.beginPath();ct.moveTo(cx2-4,cy2+5+wob);ct.lineTo(cx2+4,cy2+5+wob);ct.lineTo(cx2+13,cy2+30+wob);ct.lineTo(cx2-13,cy2+30+wob);ct.closePath();ct.fill();
  ct.globalAlpha=1;
  // Glow halo
  ct.shadowColor='#cc55ff';ct.shadowBlur=14;
  // Saucer body
  ct.fillStyle=lg(x,cy2,x+e.w,cy2,'#9933cc','#6611aa');ct.beginPath();ct.ellipse(cx2,cy2+wob,13,5,0,0,Math.PI*2);ct.fill();
  ct.shadowBlur=0;
  ct.fillStyle='#440a66';ct.beginPath();ct.ellipse(cx2,cy2+2+wob,11,2.5,0,0,Math.PI*2);ct.fill();
  // Dome
  ct.fillStyle=lg(cx2-6,cy2-8,cx2+6,cy2,'#cc99ff','#8855dd');ct.beginPath();ct.arc(cx2,cy2-1+wob,6,Math.PI,0);ct.fill();
  ct.fillStyle='rgba(255,255,255,.6)';ct.beginPath();ct.ellipse(cx2-2,cy2-3+wob,2,2.5,0,0,Math.PI*2);ct.fill();

    ct.fillStyle=on?lc:'#552277';ct.beginPath();ct.arc(cx2+dx,cy2+3+wob,1.6,0,Math.PI*2);ct.fill();

// ── LASER ───────────────────────────────────────────────────
function drawLaser(lb,ox){
  const x=Math.round(lb.x-ox),y=Math.round(lb.y);
  const col=lb.fr===0?'#ffcc00':'#ffe860';
  const tip=lb.vx>0?x+18:x-8;
  // Outer glow
  ct.shadowColor='#ffaa00';ct.shadowBlur=10;ct.strokeStyle='rgba(255,180,0,.4)';ct.lineWidth=6;
  ct.beginPath();if(lb.vx>0){ct.moveTo(x,y+3);ct.lineTo(tip,y+3);}else{ct.moveTo(x+lb.w,y+3);ct.lineTo(tip,y+3);}ct.stroke();
  // Core beam
  ct.strokeStyle=col;ct.lineWidth=2.5;
  ct.beginPath();if(lb.vx>0){ct.moveTo(x,y+3);ct.lineTo(tip,y+3);}else{ct.moveTo(x+lb.w,y+3);ct.lineTo(tip,y+3);}ct.stroke();ct.shadowBlur=0;
  // Bright tip
  ct.shadowColor='#fff';ct.shadowBlur=6;ct.fillStyle='#fff';ct.fillRect(lb.vx>0?tip-2:tip,y+1,3,4);ct.shadowBlur=0;
}

// ── RENDER ──────────────────────────────────────────────────
function render(){
  ct.save();
  if(shk>.4){const sx=(Math.random()-.5)*shk,sy=(Math.random()-.5)*shk;ct.translate(sx,sy);shk*=.72;}else shk=0;
  const ox=Math.round(camX);
  drawBG();
  // Level banner
  if(bannerTimer>0){
    bannerTimer--;
    const ba=Math.min(1,bannerTimer/20)*Math.min(1,(130-bannerTimer)/20+.2);
    ct.globalAlpha=ba;
    ct.fillStyle='rgba(0,0,0,.5)';ct.fillRect(CW/2-130,CH/2-24,260,48);
    ct.fillStyle='#ffee22';ct.font='bold 22px monospace';ct.textAlign='center';ct.textBaseline='middle';ct.fillText(bannerText,CW/2,CH/2);
    ct.globalAlpha=1;
  }
  if(!lvData){if(gst==='menu')drawMenuPreview();ct.restore();return;}
  coinList.forEach(c=>{const sx=c.x-ox;if(!c.col&&sx>-20&&sx<CW+20)drawCrystal(c,ox);});
  powerUps.forEach(pu=>{const sx=pu.x-ox;if(sx>-40&&sx<CW+40)drawPU(pu,ox);});
  lvData.plats.forEach(p=>{const sx=p.x-ox;if(sx>-p.w&&sx<CW+p.w)drawPlat(p,ox);});
  if(lvData.movPlats)lvData.movPlats.forEach(mp=>{const sx=mp.x-ox;if(sx>-mp.w&&sx<CW+mp.w)drawMovPlat(mp,ox);});
  blkList.forEach(b=>{const sx=b.x-ox;if(sx<-32||sx>CW)return;drawBlock(b,ox);});
  lvData.tubes.forEach(p=>{const sx=p.x-ox;if(sx>-p.w&&sx<CW+p.w)drawTube(p,ox);});
  if(lvData.checkpts)lvData.checkpts.forEach(cp=>{const sx=cp.x-ox;if(sx>-40&&sx<CW+40)drawCheckpoint(cp,ox);});
  if(lvData.springs)lvData.springs.forEach(sp=>{const sx=sp.x-ox;if(sx>-30&&sx<CW+30)drawSpring(sp,ox);});
  if(lvData.spikes)lvData.spikes.forEach(spk=>{const sx=spk.x-ox;if(sx>-80&&sx<CW+80)drawSpike(spk,ox);});
  if(!boss||!boss.alive)drawBeacon(lvData.flagX,ox);
  enemies.forEach(e=>{if(!e.alive)return;const sx=e.x-ox;if(sx<-60||sx>CW+60)return;e.t==='g'?drawBlob(e,ox):e.t==='f'?drawFlyer(e,ox):e.t==='s'?drawTurret(e,ox):drawDroid(e,ox);});
  if(boss)drawBoss(ox);
  bossProjs.forEach(bp=>{if(bp.active){const sx=bp.x-ox;if(sx>-20&&sx<CW+20)drawBossProj(bp,ox);}});
  tProjs.forEach(tp=>{if(tp.active)drawTurretProj(tp,ox);});
  lasers.forEach(lb=>{if(lb.active)drawLaser(lb,ox);});
  if(player&&(!player.dead||player.y<CH+40))drawPlayer(player,ox);
  parts.forEach(p=>p.draw(ox));
  // Combo multiplier display
  if(gst==='playing'&&player&&comboMult>1&&comboTimer>0&&!player.dead&&!player.goal){
    const cx=Math.round(player.x-ox)+player.w/2,cy=Math.round(player.y)-22;
    const a=Math.min(1,comboTimer/15);
    const sz=Math.min(26,14+comboMult*2)|0;
    const col=comboMult>=8?'#ff2200':comboMult>=4?'#ff8800':'#ffcc00';
    const shd=comboMult>=8?'#660000':comboMult>=4?'#662200':'#aa4400';
    ct.globalAlpha=a;
    ct.textAlign='center';ct.textBaseline='middle';
    if(comboMult>=4){
      ct.font='bold 9px monospace';
      ct.fillStyle=shd;ct.fillText('COMBO!',cx+1,cy-sz/2+1);
      ct.fillStyle=col;ct.fillText('COMBO!',cx,cy-sz/2);
    }
    ct.font=`bold ${sz}px monospace`;
    ct.fillStyle=shd;ct.fillText('x'+comboMult,cx+1,cy+sz/2+1);
    ct.fillStyle=col;ct.fillText('x'+comboMult,cx,cy+sz/2);
    ct.globalAlpha=1;
  }
  if(gst==='menu')drawMenuPreview();
  // Progress bar
  if(gst==='playing'&&player&&!player.dead&&!player.goal&&lvData){
    const prog=Math.min(1,Math.max(0,player.x/(lvData.flagX||lw)));
    const bw=CW-32,bx=16;
    ct.fillStyle='rgba(0,0,0,.45)';rr(bx-1,CH-10,bw+2,7,3);ct.fill();
    const barH=`hsl(${140+prog*80|0},90%,48%)`;
    const barG=ct.createLinearGradient(bx,CH-9,bx+bw*prog,CH-9);
    barG.addColorStop(0,`hsl(${140+prog*80|0},90%,38%)`);
    barG.addColorStop(1,barH);
    ct.fillStyle=barG;ct.fillRect(bx,CH-9,bw*prog|0,5);
    ct.fillStyle='rgba(255,255,255,.18)';ct.fillRect(bx,CH-9,bw*prog|0,2);
    // Player dot
    const pdx=(bx+bw*prog-2)|0;
    ct.shadowColor=barH;ct.shadowBlur=6;ct.fillStyle='#fff';ct.fillRect(pdx,CH-12,4,10);ct.shadowBlur=0;
    // Goal flag dot
    ct.shadowColor='#ffcc00';ct.shadowBlur=4;ct.fillStyle='#ffcc00';ct.fillRect(bx+bw-2,CH-12,4,10);ct.shadowBlur=0;
  }
  if(dmgFlash>0){
    dmgFlash--;
    const fa=(dmgFlash/30)*.5;
    const vg=ct.createRadialGradient(CW/2,CH/2,40,CW/2,CH/2,Math.max(CW,CH)*.72);
    vg.addColorStop(0,'rgba(180,0,0,0)');vg.addColorStop(.55,'rgba(180,0,0,0)');vg.addColorStop(1,`rgba(180,0,0,${fa})`);
    ct.fillStyle=vg;ct.fillRect(0,0,CW,CH);
  }
  drawMobileHUD();
  ct.restore();
}

let _lt=0;const _STEP=1000/60;
function loop(ts){
  requestAnimationFrame(loop);

    _lt=ts-(dt%_STEP);
    NOW=Date.now();scheduleMusicNotes();update();render();for(const k in JP)delete JP[k];
  }
}

// ── VIRTUAL JOYSTICK ────────────────────────────────────────
(function(){
  const base=document.getElementById('joy-base');
  const knob=document.getElementById('joy-knob');
  const R=54,DEAD=14;
  let tid=null,cx=0,cy=0;
  function upd(tx,ty){
    const dx=tx-cx,dy=ty-cy,d=Math.sqrt(dx*dx+dy*dy);
    const kx=d>R?dx/d*R:dx,ky=d>R?dy/d*R:dy;
    knob.style.marginLeft=(-23+kx)+'px';knob.style.marginTop=(-23+ky)+'px';
    const nL=dx<-DEAD,nR=dx>DEAD,nD=dy>DEAD*1.5&&Math.abs(dx)<R*.55,nRun=d>R*.65;
    if(K['ArrowLeft']!==nL){if(nL)JP['ArrowLeft']=true;K['ArrowLeft']=nL;}
    if(K['ArrowRight']!==nR){if(nR)JP['ArrowRight']=true;K['ArrowRight']=nR;}
    if(K['ArrowDown']!==nD){if(nD)JP['ArrowDown']=true;K['ArrowDown']=nD;}
    joyIsRunning=nRun;knob.classList.toggle('run',nRun);
  }
  function rst(){
    tid=null;knob.style.marginLeft='-23px';knob.style.marginTop='-23px';
    K['ArrowLeft']=false;K['ArrowRight']=false;K['ArrowDown']=false;joyIsRunning=false;knob.classList.remove('run');
  }
  base.addEventListener('touchstart',e=>{e.preventDefault();if(tid!==null)return;const t=e.changedTouches[0];tid=t.identifier;const r=base.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2;upd(t.clientX,t.clientY);hap(6);},{passive:false});
  window.addEventListener('touchmove',e=>{if(tid===null)return;for(let i=0;i<e.changedTouches.length;i++){const t=e.changedTouches[i];if(t.identifier===tid){upd(t.clientX,t.clientY);break;}}},{passive:true});
  window.addEventListener('touchend',e=>{if(tid===null)return;for(let i=0;i<e.changedTouches.length;i++){if(e.changedTouches[i].identifier===tid){rst();break;}}},{passive:true});
  window.addEventListener('touchcancel',e=>{if(tid!==null)rst();},{passive:true});
  // Mouse fallback for desktop testing
  let md=false;
  base.addEventListener('mousedown',e=>{md=true;const r=base.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2;upd(e.clientX,e.clientY);});
  document.addEventListener('mousemove',e=>{if(md)upd(e.clientX,e.clientY);});
  document.addEventListener('mouseup',()=>{if(md){md=false;rst();}});
})();
