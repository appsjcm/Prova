<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Cosmo Kid</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a2040;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:monospace;color:#fff;overflow:hidden}
h1{font-size:1.9rem;margin-bottom:5px;letter-spacing:4px;text-transform:uppercase;background:linear-gradient(135deg,#00ccff,#00ff88);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
#hud{display:flex;gap:14px;margin-bottom:7px;flex-wrap:wrap;justify-content:center}
.hb{text-align:center}
.hl{font-size:8px;color:#6688aa;letter-spacing:2px;text-transform:uppercase}
.hv{font-size:1.3rem;font-weight:bold;color:#00ccff}
#hl{letter-spacing:2px}
#hpwr{transition:color .3s}
#wrap{position:relative}
canvas{display:block;border:2px solid #44aadd;border-radius:8px;box-shadow:0 0 50px rgba(0,200,255,.25)}
#ov{position:absolute;inset:0;background:rgba(0,20,60,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:6px;gap:8px;padding:20px;backdrop-filter:blur(1px)}
#ov.off{display:none}
#ov-t{font-size:2.8rem;font-weight:900;color:#00ccff;letter-spacing:5px;text-align:center;text-shadow:0 0 30px #00ccff,0 0 60px rgba(0,180,255,.4);line-height:1}
#ov-sub{font-size:.65rem;color:#5588aa;letter-spacing:4px;text-transform:uppercase;margin-top:2px}
#ov-hi{font-size:.76rem;color:#99aacc;letter-spacing:1px;text-align:center;margin-top:4px}
#ov-m{color:#7799cc;font-size:.75rem;text-align:center;line-height:1.9;max-width:280px}
#ov-b{color:#99aacc;font-size:.74rem;text-align:center}
#ov-btn{padding:0;font-size:1.15rem;font-weight:bold;letter-spacing:4px;text-transform:uppercase;background:linear-gradient(160deg,#0099dd,#0055aa);color:#fff;border:2px solid rgba(0,200,255,.55);border-radius:14px;cursor:pointer;width:100%;max-width:290px;min-height:64px;box-shadow:0 0 35px rgba(0,130,220,.5),0 5px 20px rgba(0,0,0,.5);transition:transform .1s,box-shadow .1s;margin-top:8px}
#ov-btn:hover,#ov-btn:active{transform:scale(1.05);box-shadow:0 0 50px rgba(0,200,255,.8),0 5px 20px rgba(0,0,0,.5)}
#ctrl{margin-top:7px;color:#3a4a5a;font-size:.66rem;text-align:center;line-height:2}
.k{display:inline-block;background:#0d1a2a;border:1px solid #2a3a4a;border-radius:3px;padding:1px 5px;color:#5a7a9a}
#fs-btn{position:fixed;top:8px;right:8px;z-index:300;background:rgba(0,20,50,.7);border:1.5px solid rgba(0,200,255,.25);color:#888;width:36px;height:36px;font-size:.8rem;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#fs-btn:hover{background:rgba(0,200,255,.15);color:#00ccff;border-color:rgba(0,200,255,.5)}
#tc{display:none;position:fixed;bottom:0;left:0;right:0;height:112px;pointer-events:none;z-index:200}
.tcb{position:absolute;width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.25);color:rgba(255,255,255,.7);font-size:1.4rem;display:flex;align-items:center;justify-content:center;pointer-events:all;touch-action:none;user-select:none;-webkit-user-select:none;transition:background .08s,border-color .15s}
.tcb.on{background:rgba(0,200,255,.22);border-color:rgba(0,200,255,.65)}
#tc-l{left:10px;bottom:50px}#tc-r{left:80px;bottom:50px}#tc-d{left:45px;bottom:6px;width:50px;height:50px;font-size:1.2rem}
#tc-a{right:10px;bottom:50px}#tc-b{right:80px;bottom:50px}
#tc-x{right:45px;bottom:6px;width:50px;height:50px;font-size:1rem;color:rgba(0,200,255,.3);border-color:rgba(0,200,255,.15)}
#tc-x.fire-on{color:rgba(0,230,255,.95);border-color:rgba(0,210,255,.75);box-shadow:0 0 14px rgba(0,200,255,.5)}
.warn{animation:wpulse .45s infinite}
@keyframes wpulse{0%,100%{opacity:1}50%{opacity:.45}}
#tc-p{left:50%;bottom:58px;transform:translateX(-50%);width:40px;height:40px;font-size:.82rem}
@media (orientation:portrait) and (max-width:700px){
  h1{font-size:1.3rem;margin-bottom:2px;letter-spacing:2px}
  .hv{font-size:.95rem}.hl{font-size:6px}
  #hud{gap:9px;margin-bottom:4px}
  #ov-t{font-size:2rem;letter-spacing:3px}
  #ov-btn{min-height:68px;font-size:1.05rem}
  #ov-m{font-size:.72rem}
}
:fullscreen h1,:fullscreen #ctrl,:-webkit-full-screen h1,:-webkit-full-screen #ctrl{display:none!important}
:fullscreen #hud,:-webkit-full-screen #hud{margin-bottom:3px}
:fullscreen #ov-t,:-webkit-full-screen #ov-t{font-size:3.5rem}
:fullscreen #ov-btn,:-webkit-full-screen #ov-btn{max-width:340px;min-height:74px;font-size:1.25rem}
</style>
</head>
<body>
<h1>Cosmo Kid</h1>
<div id="hud">
  <div class="hb"><div class="hl">Puntos</div><div class="hv" id="hs">000000</div></div>
  <div class="hb"><div class="hl">Cristales</div><div class="hv" id="hc">x00</div></div>
  <div class="hb"><div class="hl">Vidas</div><div class="hv" id="hl">&#9829;&#9829;&#9829;</div></div>
  <div class="hb"><div class="hl">Tiempo</div><div class="hv" id="ht">300</div></div>
  <div class="hb"><div class="hl">Mision</div><div class="hv" id="hn">1/3</div></div>
  <div class="hb"><div class="hl">Estado</div><div class="hv" id="hpwr">-</div></div>
  <div class="hb"><div class="hl">Musica</div><div class="hv" id="hmu" style="cursor:pointer;font-size:.95rem" title="M = silenciar">&#9835;</div></div>
</div>
<div id="wrap">
  <canvas id="c" width="600" height="380"></canvas>
  <div id="ov">
    <div id="ov-t">COSMO KID</div>
    <div id="ov-sub">Aventura Espacial · 3 Misiones</div>
    <div id="ov-hi"></div>
    <div id="ov-m"></div>
    <div id="ov-b"></div>
    <button id="ov-btn">JUGAR</button>
  </div>
</div>
<div id="ctrl">
  <span class="k">&#8592;&#8594;</span> mover &nbsp;
  <span class="k">&#8593;</span><span class="k">Z</span> saltar &nbsp;
  <span class="k">&#8595;</span> agachar &nbsp;
  <span class="k">X</span> laser &nbsp;
  <span class="k">Shift</span> correr &nbsp;
  <span class="k">P</span> pausa
</div>
<button id="fs-btn">[ ]</button>
<div id="tc">
  <div class="tcb" id="tc-l">&#9664;</div>
  <div class="tcb" id="tc-r">&#9654;</div>
  <div class="tcb" id="tc-d">&#9660;</div>
  <div class="tcb" id="tc-p">II</div>
  <div class="tcb" id="tc-b">B</div>
  <div class="tcb" id="tc-a">&#9650;</div>
  <div class="tcb" id="tc-x">X</div>
</div>
<script>
'use strict';
const cv=document.getElementById('c'),ct=cv.getContext('2d');
const CW=600,CH=380,GY=320;
const GRAV=0.52,JV=-12,WS=2.6,RS=4.8;
const MAX_LV=3;
const wrap=document.getElementById('wrap');
let NOW=0;

// ── AUDIO ───────────────────────────────────────────────────
let AC=null;
function initAC(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();}
['click','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,initAC,{once:true}));
function beep(freq,type,vol,dur,freq2,delay){
  if(!AC||AC.state!=='running')return;
  try{
    const o=AC.createOscillator(),g=AC.createGain();
    o.connect(g);g.connect(AC.destination);
    o.type=type||'sine';
    const t=AC.currentTime+(delay||0);
    o.frequency.setValueAtTime(freq,t);
    if(freq2)o.frequency.exponentialRampToValueAtTime(freq2,t+dur*.8);
    g.gain.setValueAtTime(Math.min(vol||.1,.35),t);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.start(t);o.stop(t+dur+.05);
  }catch(e){}
}
const SFX={
  jump:()=>beep(300,'square',.08,.13,580),
  land:()=>beep(85,'triangle',.14,.07,45),
  coin:()=>{beep(900,'sine',.09,.07);beep(1350,'sine',.09,.1,null,.06);},
  stomp:()=>beep(130,'square',.2,.1,30),
  laser:()=>beep(720,'sawtooth',.05,.07,160),
  hurt:()=>beep(160,'sawtooth',.2,.22,65),
  die:()=>[320,250,190,130,75].forEach((f,i)=>beep(f,'square',.1,.12,null,i*.09)),
  pu:()=>[420,580,740,940].forEach((f,i)=>beep(f,'sine',.1,.14,null,i*.08)),
  blk:()=>beep(170,'sawtooth',.13,.1,55),
  brk:()=>{beep(200,'sawtooth',.2,.14,40);beep(120,'sawtooth',.15,.14,50,.05);},
  cp:()=>{beep(660,'sine',.1,.1);beep(880,'sine',.1,.12,null,.1);beep(1100,'sine',.1,.16,null,.22);},
  win:()=>[[523,0],[659,.15],[784,.3],[1047,.45]].forEach(([f,d])=>beep(f,'sine',.13,.35,null,d)),
  over:()=>[[360,0],[290,.2],[220,.4],[150,.65]].forEach(([f,d])=>beep(f,'square',.11,.28,null,d)),
  combo:n=>beep(400+n*80,'sine',.12,.1,null),
  star:()=>[500,700,900,1200].forEach((f,i)=>beep(f,'sine',.07,.08,null,i*.04)),
  spring:()=>{beep(200,'square',.18,.06,700);beep(700,'sine',.1,.18,null,.05);},
  warn:()=>beep(880,'square',.07,.07,660),
};

// ── MUSIC ─────────────────────────────────────────────────────
let musicActive=false,musicBeat=0,musicNextT=0,musicMuted=false;
const MELODIES=[
  [523,659,784,659,523,392,440,523,587,659,698,659,587,523,494,523],
  [349,440,523,440,349,262,294,349,392,440,466,440,392,349,330,349],
  [220,262,330,294,220,196,220,247,262,247,220,196,175,196,220,247],
];
const BEAT_DUR=0.22;
function scheduleMusicNotes(){
  if(musicMuted||!musicActive||!AC||AC.state!=='running')return;
  const now=AC.currentTime;if(musicNextT<now)musicNextT=now;
  while(musicNextT<now+0.5){
    const mel=MELODIES[Math.min(levelNum,2)],freq=mel[musicBeat%mel.length];
    const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);
    o.type='triangle';o.frequency.value=freq;const t=musicNextT;
    g.gain.setValueAtTime(0.048,t);g.gain.exponentialRampToValueAtTime(0.001,t+BEAT_DUR*.9);
    o.start(t);o.stop(t+BEAT_DUR);musicNextT+=BEAT_DUR;musicBeat++;
  }
}
function startMusic(){musicActive=true;musicBeat=0;if(AC)musicNextT=AC.currentTime;}
function stopMusic(){musicActive=false;}
const hmuEl=document.getElementById('hmu');
function setMusicIcon(){hmuEl.textContent=musicMuted?'🔇':'♩';hmuEl.style.color=musicMuted?'#555':'#00ccff';}
setMusicIcon();

// ── SCREEN SHAKE ─────────────────────────────────────────────
let shk=0;
function shake(n){shk=Math.max(shk,n);}

// ── FULLSCREEN ──────────────────────────────────────────────
let fsWanted=false;
function isFS(){return!!(document.fullscreenElement||document.webkitFullscreenElement);}
function requestFS(el){try{const f=el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen;if(f){f.call(el);fsWanted=true;}}catch(e){}}
function exitFS(){try{const f=document.exitFullscreen||document.webkitExitFullscreen;if(f){f.call(document);fsWanted=false;}}catch(e){}}
const fsBtn=document.getElementById('fs-btn');
fsBtn.addEventListener('click',()=>isFS()?exitFS():requestFS(document.documentElement));
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{if(!isFS()&&fsWanted)fsWanted=false;fsBtn.textContent=isFS()?'X':'[ ]';resize();}));

// ── RESIZE ──────────────────────────────────────────────────
let tcH=0,isTouchDevice=false;
function resize(){const fs=isFS(),topH=fs?36:118,maxS=fs?3:1.5;const s=Math.min((innerWidth-8)/CW,(innerHeight-topH-tcH)/CH,maxS);cv.style.width=CW*s+'px';cv.style.height=CH*s+'px';wrap.style.width=CW*s+'px';}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(()=>{resize();if(fsWanted&&!isFS())requestFS(document.documentElement);},350));
resize();

// ── INPUT ───────────────────────────────────────────────────
const K={},JP={};
window.addEventListener('keydown',e=>{if(!K[e.code])JP[e.code]=true;K[e.code]=true;if(['Space','ArrowUp','ArrowLeft','ArrowRight','ArrowDown'].includes(e.code))e.preventDefault();if(e.code==='KeyP')togglePause();if(e.code==='KeyM'){musicMuted=!musicMuted;if(!musicMuted&&musicActive&&AC)musicNextT=AC.currentTime;setMusicIcon();}});
window.addEventListener('keyup',e=>K[e.code]=false);
const isL=()=>K.ArrowLeft||K.KeyA,isR=()=>K.ArrowRight||K.KeyD;
const isJ=()=>K.ArrowUp||K.KeyZ||K.Space,isD=()=>K.ArrowDown||K.KeyS;
const isRn=()=>K.ShiftLeft||K.ShiftRight;
const jpJ=()=>JP.ArrowUp||JP.KeyZ||JP.Space,jpX=()=>JP.KeyX||JP.KeyF;

// ── DOM ─────────────────────────────────────────────────────
const ov=document.getElementById('ov'),ovT=document.getElementById('ov-t');
const ovHi=document.getElementById('ov-hi'),ovM=document.getElementById('ov-m');
const ovB=document.getElementById('ov-b'),ovBtn=document.getElementById('ov-btn');
const hsEl=document.getElementById('hs'),hcEl=document.getElementById('hc');
const hlEl=document.getElementById('hl'),htEl=document.getElementById('ht');
const hnEl=document.getElementById('hn'),hpwrEl=document.getElementById('hpwr');
const tcXBtn=document.getElementById('tc-x');

// ── STATE ───────────────────────────────────────────────────
let gst='menu',score=0,coins=0,lives=3,tLeft=300,levelEndTime=0;
let camX=0,tAccum=0,dTimer=0,wTimer=0;
let player,enemies,coinList,blkList,powerUps,lasers,parts,lvData;
let levelNum=0,lw=3600,nextLvlReady=false;
let cpX=-1; // checkpoint respawn X (-1 = none)
let comboMult=1,comboTimer=0;
let hiScore=+localStorage.getItem('cosmoHi')||0;
let bestTime=+localStorage.getItem('cosmoBT')||0;

const LEVEL_TIME=[300,240,200];
const LEVEL_NAMES=['PLANETA COSMO','ESTACION ORBITAL','NUCLEO ALIEN'];

function fmtTime(s){return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');}
function livesStr(n){return n<=0?'':n<=5?'♥'.repeat(n):'♥x'+n;}
function setHUD(){
  hsEl.textContent=String(score).padStart(6,'0');
  hcEl.textContent='x'+String(coins).padStart(2,'0');
  hlEl.innerHTML='<span style="color:#ff6688">'+livesStr(lives)+'</span>';
  htEl.textContent=Math.ceil(tLeft);
  htEl.style.color=tLeft<=10&&tLeft>0?'#ff3333':tLeft<=30&&tLeft>0?'#ff8833':'';
  htEl.classList.toggle('warn',tLeft<=10&&tLeft>0);
  hnEl.textContent=(levelNum+1)+'/'+MAX_LV;
}
function addScore(n){score+=n;if(score>hiScore){hiScore=score;localStorage.setItem('cosmoHi',hiScore);}hsEl.textContent=String(score).padStart(6,'0');}
function gainCoin(x,y){
  coins++;addScore(200);SFX.coin();
  if(coins>0&&coins%100===0){lives++;SFX.pu();parts.push(new TextPop(x,y-14,'1UP! +♥','#ff88aa'));shake(2);}
  setHUD();
}
function updatePwrHUD(){
  if(!player){hpwrEl.textContent='-';hpwrEl.style.color='#aaa';return;}
  if(player.star>0){hpwrEl.textContent='NUCLEO';hpwrEl.style.color='#ffdd00';}
  else if(player.fire){hpwrEl.textContent='LASER';hpwrEl.style.color='#00ccff';}
  else if(player.pwr){hpwrEl.textContent='TANQUE';hpwrEl.style.color='#4caf50';}
  else{hpwrEl.textContent='-';hpwrEl.style.color='#aaa';}
  tcXBtn.classList.toggle('fire-on',!!(player.fire||player.star>0));
}

// ── MENU ────────────────────────────────────────────────────
function showMenu(){
  gst='menu';stopMusic();ov.classList.remove('off');
  ovT.textContent='COSMO KID';ovT.style.color='#00ccff';
  const hi=hiScore>0?'Record: '+String(hiScore).padStart(6,'0'):'';
  const bt=bestTime>0?' · Mejor: '+fmtTime(bestTime):'';
  ovHi.innerHTML=hi+bt;
  ovM.innerHTML=isTouchDevice?'&#9664; &#9654; mover &nbsp;&#183;&nbsp; &#9650; saltar &nbsp;&#183;&nbsp; &#9660; agachar<br>B correr &nbsp;&#183;&nbsp; X laser &nbsp;&#183;&nbsp; II pausa':'&#8592;&#8594; mover &nbsp;&#183;&nbsp; &#8593;/Z saltar &nbsp;&#183;&nbsp; &#8595; agachar<br>Shift correr &nbsp;&#183;&nbsp; X laser &nbsp;&#183;&nbsp; P pausa';
  ovB.innerHTML='3 Misiones &nbsp;&#9670;&nbsp; Resortes &nbsp;&#9670;&nbsp; Ovnis &nbsp;&#9670;&nbsp; 100 cristales = &#9829;';
  ovBtn.textContent='JUGAR';ovBtn.style.display='';
}

// ── LEVEL 1: PLANETA COSMO ───────────────────────────────────
function buildLevel1(){
  const plats=[[200,264,96],[370,228,64],[520,272,128],[700,288,32],[732,256,32],[764,224,32],[880,248,160],[1070,216,96],[1240,272,64],[1390,240,192],[1610,200,128],[1790,264,96],[1960,228,160],[2190,272,128],[2390,240,96],[2560,200,64],[2730,256,128],[2950,220,96],[3090,264,128],[3250,224,64],[3370,248,128]].map(([x,y,w])=>({x,y,w,h:16}));
  const qbs=[[270,208,'coin'],[350,208,'mushroom'],[350,176,'coin'],[912,208,'coin'],[1110,176,'flower'],[1448,192,'star'],[1670,160,'coin'],[2068,184,'mushroom'],[2448,192,'1up'],[2788,208,'flower'],[3108,208,'coin'],[3268,176,'mushroom']].map(([x,y,rw])=>({x,y,w:32,h:32,t:'q',hit:false,bh:0,rw}));
  const bbs=[[392,208],[424,208],[456,208],[948,208],[980,208],[1928,208],[1960,208],[1992,208],[3148,208],[3180,208]].map(([x,y])=>({x,y,w:32,h:32,t:'b',hit:false,bh:0}));
  const cns=[[100,300],[124,300],[148,300],[216,244],[244,244],[272,244],[564,252],[596,252],[882,228],[916,228],[1404,216],[1436,216],[1468,216],[1628,176],[1660,176],[1980,188],[2012,188],[2580,288],[2608,288],[3096,244],[3124,244]].map(([x,y])=>({x,y,w:14,h:18,col:false,fr:0,ft:0}));
  const tubes=[[460,278,48,62],[836,262,48,78],[1328,278,48,62],[1968,278,48,62],[2408,262,48,78],[2688,278,48,62],[3028,278,48,62]].map(([x,y,w,h])=>({x,y,w,h}));
  const ens=[{t:'g',x:340,sp:1.2},{t:'g',x:540,sp:1.2},{t:'g',x:576,sp:1.2},{t:'g',x:760,sp:1.2},{t:'k',x:940,sp:1.2},{t:'g',x:1140,sp:1.2},{t:'g',x:1186,sp:1.2},{t:'k',x:1468,sp:1.2},{t:'g',x:1588,sp:1.2},{t:'g',x:1748,sp:1.2},{t:'k',x:1868,sp:1.2},{t:'g',x:2096,sp:1.2},{t:'g',x:2144,sp:1.2},{t:'k',x:2292,sp:1.2},{t:'g',x:2540,sp:1.2},{t:'g',x:2656,sp:1.2},{t:'k',x:2852,sp:1.2},{t:'g',x:2972,sp:1.2},{t:'g',x:3072,sp:1.2},{t:'k',x:3212,sp:1.2},{t:'f',x:1300,sp:1.1,y:GY-130,amp:22},{t:'f',x:2400,sp:1.3,y:GY-150,amp:30}];
  const checkpts=[{x:1800,active:false}];
  const movPlats=[];
  const springs=[{x:780,y:GY-16},{x:2100,y:GY-16},{x:3080,y:GY-16}];
  return{plats,blks:[...qbs,...bbs],cns,tubes,ens,checkpts,movPlats,springs,flagX:3300,lw:3600};
}

// ── LEVEL 2: ESTACION ORBITAL ────────────────────────────────
function buildLevel2(){
  const plats=[[180,264,80],[320,236,64],[460,268,48],[560,228,64],[680,260,80],[830,232,64],[960,192,48],[1060,240,80],[1210,204,64],[1360,264,48],[1460,228,96],[1600,192,64],[1740,248,48],[1860,216,80],[2000,176,64],[2140,232,80],[2290,192,48],[2410,248,64],[2560,216,80],[2720,176,48],[2860,240,64],[3020,200,80],[3160,256,48],[3300,224,64],[3440,192,80],[3600,240,48],[3760,208,64],[3920,248,80],[4060,216,48]].map(([x,y,w])=>({x,y,w,h:16}));

// ── AABB ────────────────────────────────────────────────────
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function resH(e,sl){for(const s of sl){if(!hit(e,s))continue;e.vx>0?e.x=s.x-e.w:e.x=s.x+s.w;e.vx=0;break;}}
function resV(e,sl){e.onG=false;for(const s of sl){if(!hit(e,s))continue;if(e.vy>=0){e.y=s.y-e.h;e.vy=0;e.onG=true;}else{e.y=s.y+s.h;e.vy=1;}break;}}

// ── POWER-UP SYSTEM ─────────────────────────────────────────
function standH(p){return p.pwr?44:34;}
function crouchH(p){return p.pwr?30:20;}
function growPlayer(){if(player.pwr)return;const oh=player.h,nh=player.crouch?30:44;player.pwr=true;player.h=nh;player.y-=(nh-oh);updatePwrHUD();}
function shrinkPlayer(){if(player.pwr){const oh=player.h,nh=player.crouch?20:34;player.pwr=false;player.fire=false;player.h=nh;player.y+=(oh-nh);player.inv=120;updatePwrHUD();return;}pDie();}
function collectPU(type){
  SFX.pu();
  if(type==='mushroom'){if(!player.pwr){growPlayer();parts.push(new TextPop(player.x+10,player.y-8,'+TANQUE','#4caf50'));}addScore(1000);}
  else if(type==='flower'){if(!player.pwr)growPlayer();player.fire=true;parts.push(new TextPop(player.x+10,player.y-8,'+LASER','#00ccff'));addScore(1000);updatePwrHUD();}
  else if(type==='star'){player.star=600;player.inv=600;SFX.star();parts.push(new TextPop(player.x+10,player.y-8,'NUCLEO!','#ffdd00'));addScore(1000);updatePwrHUD();}
  else if(type==='1up'){lives++;setHUD();parts.push(new TextPop(player.x+10,player.y-8,'1UP! +♥','#ff88aa'));}
  setHUD();
}

// ── UPDATE PLAYER ───────────────────────────────────────────
function updPlayer(p,sl){
  if(p.dead){p.y+=p.dvy;p.dvy+=GRAV;return;}
  if(p.goal){p.x+=1.5;p.ft++;if(p.ft>7){p.fr=(p.fr+1)%4;p.ft=0;}return;}
  if(p.star>0){p.star--;if(p.star===0){p.inv=0;updatePwrHUD();}}
  if(p.fireCool>0)p.fireCool--;
  const wantDuck=isD()&&p.onG,ch=crouchH(p),sh=standH(p);
  if(wantDuck&&!p.crouch){p.crouch=true;p.h=ch;p.y+=(sh-ch);}
  else if(!wantDuck&&p.crouch){const test={x:p.x,y:p.y-(sh-ch),w:p.w,h:sh};if(!sl.some(s=>hit(test,s))){p.crouch=false;p.h=sh;p.y-=(sh-ch);}}
  const spd=isRn()||(p.star>0&&!p.crouch)?RS+(p.star>0?.6:0):WS;
  if(!p.crouch){if(isL()){p.vx=-spd;p.dir=-1;}else if(isR()){p.vx=spd;p.dir=1;}else{p.vx*=.72;if(Math.abs(p.vx)<.1)p.vx=0;}}else{p.vx*=.6;if(Math.abs(p.vx)<.1)p.vx=0;}
  if(jpJ())p.jBuf=8;else if(p.jBuf>0)p.jBuf--;
  if(p.onG)p.coy=6;else if(p.coy>0)p.coy--;
  if(p.jBuf>0&&(p.onG||p.coy>0)&&!p.crouch){p.vy=JV;p.jHeld=true;p.jBuf=0;p.coy=0;SFX.jump();}
  const hj=isJ();if(!hj){p.jHeld=false;if(p.vy<-4)p.vy=-4;}
  if(hj&&p.jHeld&&p.vy<0){p.vy-=.28;if(p.vy<-14)p.vy=-14;}
  p.vy+=GRAV;if(p.vy>16)p.vy=16;
  const prevOnG=p.onG,prevVY=p.vy;
  p.x+=p.vx;p.x=Math.max(camX,Math.min(lw-p.w,p.x));resH(p,sl);
  p.y+=p.vy;resV(p,sl);
  // Landing feedback
  if(!prevOnG&&p.onG&&prevVY>2){
    SFX.land();
    const n=Math.min(6,Math.ceil(prevVY/3));
    for(let i=0;i<n;i++)parts.push(new Dust(p.x+p.w/2,p.y+p.h));
    if(prevVY>8)shake(4);else if(prevVY>5)shake(2);
  }
  // Running dust in star mode
  if(p.onG&&p.star>0&&Math.abs(p.vx)>RS&&(NOW%80|0)<30)parts.push(new Dust(p.x+(p.dir>0?-2:p.w+2),p.y+p.h));
  if(p.y>CH+60){pDie();return;}
  if(p.inv>0)p.inv--;
  if((p.fire||p.star>0)&&jpX()&&p.fireCool<=0){
    lasers.push({x:p.x+(p.dir>0?p.w+2:-14),y:p.y+(p.pwr?18:12),w:12,h:6,vx:9*p.dir,vy:0,life:200,active:true,fr:0,ft:0});
    p.fireCool=18;SFX.laser();
    parts.push(new Pop(p.x+(p.dir>0?p.w:0),p.y+(p.pwr?20:14),p.dir*3,-1,'#ffcc00',10));
  }
  if(p.onG&&Math.abs(p.vx)>.2){p.ft++;if(p.ft>=(isRn()?4:7)){p.fr=(p.fr+1)%4;p.ft=0;}}else if(!p.onG)p.fr=2;else p.fr=0;
}

// ── UPDATE ENEMY ────────────────────────────────────────────
function updEnemy(e,sl){
  if(!e.alive)return;if(e.stomp){if(--e.sTimer<=0)e.alive=false;return;}
  if(e.x>camX+CW+120||e.x<camX-120)return;
  if(e.t==='f'){
    e.x+=e.vx;e.ph+=.05;e.y=e.baseY+Math.sin(e.ph)*e.amp;
    if(e.x<0){e.x=0;e.vx=Math.abs(e.vx);}
    e.dir=e.vx>0?1:-1;if(++e.ft>=10){e.fr=(e.fr+1)%2;e.ft=0;}
    return;
  }
  e.vy+=GRAV;if(e.vy>14)e.vy=14;
  e.x+=e.vx;for(const s of sl){if(!hit(e,s))continue;e.vx>0?(e.x=s.x-e.w,e.vx=-Math.abs(e.vx)):(e.x=s.x+s.w,e.vx=Math.abs(e.vx));break;}
  e.onG=false;e.y+=e.vy;for(const s of sl){if(!hit(e,s))continue;if(e.vy>=0){e.y=s.y-e.h;e.vy=0;e.onG=true;}else{e.y=s.y+s.h;e.vy=1;}break;}
  if(e.onG){const ex=e.vx>0?e.x+e.w+2:e.x-2;if(!sl.some(s=>ex>=s.x&&ex<=s.x+s.w&&s.y>=e.y+e.h-2&&s.y<=e.y+e.h+14))e.vx=-e.vx;}
  if(e.x<0){e.x=0;e.vx=Math.abs(e.vx);}
  if(e.y>CH+80){e.alive=false;return;}
  e.dir=e.vx>0?1:-1;if(++e.ft>=14){e.fr=(e.fr+1)%2;e.ft=0;}
}

// ── UPDATE POWER-UP ─────────────────────────────────────────
function updPU(pu,sl){
  if(!pu.active)return;if(pu.emer>0){pu.emer--;pu.y-=1;return;}
  if(pu.type!=='flower'){
    pu.vy+=GRAV*.6;if(pu.vy>12)pu.vy=12;
    pu.x+=pu.vx;for(const s of sl){if(!hit(pu,s))continue;pu.vx>0?(pu.x=s.x-pu.w,pu.vx=-pu.vx):(pu.x=s.x+s.w,pu.vx=-pu.vx);break;}
    pu.y+=pu.vy;for(const s of sl){if(!hit(pu,s))continue;if(pu.vy>=0){pu.y=s.y-pu.h;pu.vy=pu.type==='star'?-7:0;}else{pu.y=s.y+s.h;pu.vy=1;}break;}
    if(pu.y>CH+80){pu.active=false;return;}
  }
  if(hit(player,pu)){collectPU(pu.type);pu.active=false;}
}

// ── UPDATE LASER ─────────────────────────────────────────────
function updLaser(lb,sl){
  if(!lb.active)return;lb.x+=lb.vx;
  for(const s of sl){if(!hit(lb,s))continue;lb.active=false;for(let i=0;i<5;i++)parts.push(new Pop(lb.x,lb.y,(Math.random()-.5)*4,-Math.random()*3,'#ffaa00',12));break;}
  if(lb.active){for(const e of enemies){if(!e.alive||e.stomp||!hit(lb,e))continue;stompE(e);lb.active=false;parts.push(new Pop(e.x+12,e.y+8,0,-4,'#ffaa00',18));break;}}
  if(lb.x<camX-100||lb.x>camX+CW+100||--lb.life<=0)lb.active=false;
  if(++lb.ft>=4){lb.fr=(lb.fr+1)%2;lb.ft=0;}
}

// ── PARTICLES ───────────────────────────────────────────────
class Pop{constructor(x,y,vx,vy,col,life){Object.assign(this,{x,y,vx,vy,col,life,ml:life});}tick(){this.x+=this.vx;this.y+=this.vy;this.vy+=.35;this.life--;return this.life>0;}draw(ox){ct.globalAlpha=this.life/this.ml;ct.fillStyle=this.col;ct.fillRect(Math.round(this.x-ox),Math.round(this.y),4,4);ct.globalAlpha=1;}}
class TextPop{constructor(x,y,txt,col){Object.assign(this,{x,y,txt,col,life:52});}tick(){this.y-=.6;this.life--;return this.life>0;}draw(ox){ct.globalAlpha=this.life/52;ct.fillStyle=this.col;ct.font='bold 11px monospace';ct.textAlign='center';ct.fillText(this.txt,this.x-ox,this.y);ct.globalAlpha=1;}}
class Dust{
  constructor(x,y){this.x=x+(Math.random()-.5)*14;this.y=y;this.vx=(Math.random()-.5)*1.6;this.vy=-1.2-Math.random()*1.4;this.life=10+Math.random()*8|0;this.ml=this.life;this.sz=2+Math.random()*2.5;}
  tick(){this.x+=this.vx;this.y+=this.vy;this.vy+=.14;this.life--;return this.life>0;}
  draw(ox){const a=this.life/this.ml,s=this.sz*a;ct.globalAlpha=a*.55;ct.fillStyle='#fff';ct.fillRect(Math.round(this.x-ox)-s/2|0,Math.round(this.y)-s/2|0,s|0,s|0);ct.globalAlpha=1;}
}

// ── GAME ACTIONS ────────────────────────────────────────────
function pDie(){if(player.dead||player.goal)return;player.dead=true;player.dvy=-11;SFX.die();shake(6);lives--;setHUD();dTimer=90;}
function pHurt(){if(player.dead||player.goal||player.inv>0||player.star>0)return;SFX.hurt();shake(5);shrinkPlayer();}
function stompE(e){
  SFX.stomp();shake(2);
  comboTimer=65;
  if(e.t==='k'&&!e.shell){
    e.shell=true;e.vx=0;e.h=20;e.y+=16;
    addScore(100*comboMult);
    parts.push(new TextPop(e.x+14,e.y,'+'+100*comboMult,'#ffaa00'));
    for(let i=0;i<4;i++)parts.push(new Pop(e.x+12,e.y+8,(Math.random()-.5)*4,-Math.random()*3,'#4488ff',16));
    if(comboMult<8)comboMult*=2;return;
  }
  e.stomp=true;e.sTimer=22;
  const base=e.t==='g'?100:200;
  const pts=base*comboMult;
  addScore(pts);
  parts.push(new TextPop(e.x+12,e.y,'+'+pts+(comboMult>1?' x'+comboMult:''),'#ffaa00'));
  const col=e.t==='g'?'#ff5533':e.t==='f'?'#cc55ff':'#4488ff';
  for(let i=0;i<6;i++)parts.push(new Pop(e.x+e.w/2,e.y+e.h/2,(Math.random()-.5)*5,-Math.random()*4-1,col,20));
  if(comboMult>1)SFX.combo(Math.min(5,comboMult));
  if(comboMult<8)comboMult*=2;
}
function togglePause(){if(gst==='playing'){gst='paused';ov.classList.remove('off');ovT.textContent='PAUSA';ovT.style.color='#00ccff';ovHi.textContent='';ovM.textContent='';ovB.textContent='';ovBtn.textContent='CONTINUAR';ovBtn.style.display='';}else if(gst==='paused'){gst='playing';ov.classList.add('off');}}
function pWin(){
  if(player.goal)return;player.goal=true;wTimer=180;SFX.win();shake(3);
  levelEndTime=tLeft;
  const el=LEVEL_TIME[levelNum]-tLeft;
  if(bestTime===0||el<bestTime){bestTime=el;localStorage.setItem('cosmoBT',bestTime);}
  addScore(Math.ceil(tLeft)*5);tLeft=0;setHUD();
}
function showEnd(title,col,msg,badge,btnTxt){gst='stop';ov.classList.remove('off');ovT.textContent=title;ovT.style.color=col;ovHi.textContent='';ovM.innerHTML=msg;ovB.textContent=badge;ovBtn.textContent=btnTxt;ovBtn.style.display='';}
function initGame(){
  if(isTouchDevice&&!isFS())requestFS(document.documentElement);
  score=0;coins=0;lives=3;levelNum=0;nextLvlReady=false;cpX=-1;comboMult=1;comboTimer=0;levelEndTime=0;
  lvData=LV_BUILDERS[0]();lw=lvData.lw;
  resetRound();gst='playing';ov.classList.add('off');setHUD();updatePwrHUD();
  startMusic();
}
function resetRound(){
  camX=0;tAccum=0;dTimer=0;wTimer=0;tLeft=LEVEL_TIME[levelNum];comboMult=1;comboTimer=0;
  player=mkPlayer();
  if(cpX>=0){player.x=cpX;camX=Math.max(0,Math.min(lw-CW,cpX-CW*.38));}
  enemies=mkEnemies(lvData.ens);
  coinList=lvData.cns.map(c=>({...c,col:false,fr:0,ft:0}));
  blkList=lvData.blks.map(b=>({...b,hit:false,bh:0}));
  powerUps=[];lasers=[];parts=[];updatePwrHUD();
}

// ── UPDATE LOOP ─────────────────────────────────────────────
function update(){
  if(gst!=='playing')return;
  if(++tAccum>=60){
    tAccum=0;tLeft=Math.max(0,tLeft-1);htEl.textContent=Math.ceil(tLeft);
    if(tLeft===30)SFX.warn();
    if(tLeft>0&&tLeft<=10)SFX.warn();
    htEl.style.color=tLeft<=10&&tLeft>0?'#ff3333':tLeft<=30&&tLeft>0?'#ff8833':'';
    htEl.classList.toggle('warn',tLeft<=10&&tLeft>0);
    if(tLeft<=0&&!player.dead&&!player.goal)pDie();
  }
  if(comboTimer>0){comboTimer--;}else{comboMult=1;}
  // Move platforms and carry player
  if(lvData.movPlats&&!player.dead&&!player.goal){
    for(const mp of lvData.movPlats){
      const px=mp.x,py=mp.y;
      if(mp.axis==='x'){mp.x+=mp.spd*mp.dir;if(mp.x>=mp.x1){mp.x=mp.x1;mp.dir=-1;}if(mp.x<=mp.x0){mp.x=mp.x0;mp.dir=1;}}
      else{mp.y+=mp.spd*mp.dir;if(mp.y>=mp.y1){mp.y=mp.y1;mp.dir=-1;}if(mp.y<=mp.y0){mp.y=mp.y0;mp.dir=1;}}
      if(player.onG&&player.y+player.h>=py-1&&player.y+player.h<=py+5&&player.x+player.w>px+4&&player.x<px+mp.w-4){
        player.x+=mp.x-px;player.y+=mp.y-py;
      }
    }
  }
  const sl=getSolids(lvData);
  if(player.dead){
    updPlayer(player,[]);
    if(--dTimer<=0){
      if(lives<=0){SFX.over();stopMusic();showEnd('MISION FALLIDA','#ff4466','Puntuacion: '+String(score).padStart(6,'0'),'Record: '+String(hiScore).padStart(6,'0'),'INTENTAR DE NUEVO');}
      else resetRound();
    }
    return;
  }
  if(player.goal){
    if(--wTimer<=0){
      const st=levelEndTime/LEVEL_TIME[levelNum];
      const nSt=st>.5?3:st>.25?2:1;
      const stStr='<span style="color:#ffcc00;font-size:1.3rem">'+'★'.repeat(nSt)+'☆'.repeat(3-nSt)+'</span>';
      if(levelNum<MAX_LV-1){
        nextLvlReady=true;
        showEnd(LEVEL_NAMES[levelNum]+' OK','#00ff88',
          stStr+'<br>Puntos: '+String(score).padStart(6,'0')+'&nbsp;&nbsp;Cristales: x'+String(coins).padStart(2,'0'),
          'Record: '+String(hiScore).padStart(6,'0')+' | Mejor: '+fmtTime(bestTime),
          'MISION '+(levelNum+2));
      }else{
        nextLvlReady=false;stopMusic();
        showEnd('JUEGO COMPLETO!','#ffdd00',
          stStr+'<br>Puntos: '+String(score).padStart(6,'0')+'<br>Cristales: x'+String(coins).padStart(2,'0'),
          'Record: '+String(hiScore).padStart(6,'0')+' | Mejor: '+fmtTime(bestTime),
          'JUGAR DE NUEVO');
      }
    }
    updPlayer(player,[]);return;
  }
  updPlayer(player,sl);
  const tc=player.x-CW*.38;camX+=(tc-camX)*.14;camX=Math.max(0,Math.min(lw-CW,camX));
  enemies.forEach(e=>updEnemy(e,sl));
  for(const e of enemies){if(!e.alive||e.stomp||!hit(player,e))continue;const pb=player.y+player.h-player.vy;if(player.vy>0&&pb<=e.y+8){stompE(e);player.vy=-9;}else if(player.star>0){stompE(e);player.vy=-6;addScore(100);}else if(player.inv<=0){pHurt();break;}}
  for(const c of coinList){
    if(c.col)continue;
    // Magnet pull during star mode
    if(player.star>0){const dx=player.x+10-(c.x+7),dy=player.y+player.h/2-(c.y+9),d2=dx*dx+dy*dy;if(d2<9000&&d2>1){const d=Math.sqrt(d2),f=Math.min(5,260/d);c.x+=dx/d*f;c.y+=dy/d*f;}}
    if(hit(player,c)){c.col=true;gainCoin(c.x+7,c.y);parts.push(new TextPop(c.x+7,c.y,'+200','#ffcc00'));}
    if(++c.ft>=6){c.fr=(c.fr+1)%4;c.ft=0;}
  }
  for(const b of blkList){
    if(b.hit){if(b.bh>0)b.bh--;continue;}
    if(player.x+player.w>b.x+2&&player.x<b.x+b.w-2&&player.y<=b.y+b.h&&player.y>=b.y+b.h-12&&player.vy<0){
      b.hit=true;b.bh=8;
      if(b.t==='q'){
        SFX.blk();
        if(b.rw==='coin'){gainCoin(b.x+14,b.y);parts.push(new Pop(b.x+14,b.y,0,-6,'#ffcc00',30));}
        else{let ty=b.rw;if(ty==='mushroom'&&player.pwr)ty='flower';spawnPU(ty,b.x+6,b.y);}
      }else{
        if(player.pwr||player.star>0){
          b.alive=false;SFX.brk();shake(2);
          for(let i=0;i<6;i++)parts.push(new Pop(b.x+Math.random()*32,b.y,(Math.random()-.5)*6,-4-Math.random()*3,'#c07030',28));
          addScore(50);
        }else{SFX.blk();b.hit=false;}
      }
    }
  }
  blkList=blkList.filter(b=>b.alive!==false);
  powerUps.forEach(pu=>updPU(pu,sl));powerUps=powerUps.filter(pu=>pu.active);
  lasers.forEach(lb=>updLaser(lb,sl));lasers=lasers.filter(lb=>lb.active);
  // Checkpoints
  if(lvData.checkpts){
    for(const cp of lvData.checkpts){
      if(!cp.active&&hit(player,{x:cp.x,y:GY-54,w:32,h:54})){
        cp.active=true;cpX=cp.x+8;SFX.cp();shake(2);
        parts.push(new TextPop(cp.x+16,GY-60,'CHECKPOINT!','#ffee22'));
      }
    }
  }
  // Springs
  if(lvData.springs&&!player.dead&&!player.goal){
    for(const sp of lvData.springs){
      if(player.vy>=0&&player.x+player.w>sp.x&&player.x<sp.x+20&&player.y+player.h>=sp.y&&player.y+player.h<=sp.y+20){
        player.vy=-22;player.y=sp.y-player.h;player.onG=false;
        SFX.spring();shake(3);
        parts.push(new TextPop(sp.x+10,sp.y-12,'BOING!','#00ff88'));
        for(let i=0;i<5;i++)parts.push(new Pop(sp.x+10,sp.y,(Math.random()-.5)*4,-Math.random()*4,'#66ff88',16));
      }
    }
  }
  if(hit(player,{x:lvData.flagX+14,y:60,w:6,h:GY-60}))pWin();
  parts=parts.filter(p=>p.tick());
}

// ── DRAWING ENGINE ──────────────────────
// ════════════════════════════════════════
function lg(x1,y1,x2,y2,c1,c2){const g=ct.createLinearGradient(x1,y1,x2,y2);g.addColorStop(0,c1);g.addColorStop(1,c2);return g;}
function rr(x,y,w,h,r){ct.beginPath();ct.moveTo(x+r,y);ct.lineTo(x+w-r,y);ct.arcTo(x+w,y,x+w,y+r,r);ct.lineTo(x+w,y+h-r);ct.arcTo(x+w,y+h,x+w-r,y+h,r);ct.lineTo(x+r,y+h);ct.arcTo(x,y+h,x,y+h-r,r);ct.lineTo(x,y+r);ct.arcTo(x,y,x+r,y,r);ct.closePath();}
function box3d(x,y,w,h,d,cT,cF,cS){
  ct.fillStyle=cT;ct.beginPath();ct.moveTo(x,y);ct.lineTo(x+w,y);ct.lineTo(x+w+d,y-d);ct.lineTo(x+d,y-d);ct.closePath();ct.fill();
  ct.fillStyle=cF;ct.fillRect(x,y,w,h);
  ct.fillStyle=cS;ct.beginPath();ct.moveTo(x+w,y);ct.lineTo(x+w+d,y-d);ct.lineTo(x+w+d,y+h-d);ct.lineTo(x+w,y+h);ct.closePath();ct.fill();
}
function sphere(cx,cy,r,col,dark,spec){
  ct.fillStyle=col;ct.beginPath();ct.arc(cx,cy,r,0,Math.PI*2);ct.fill();
  ct.fillStyle=dark;ct.beginPath();ct.arc(cx+r*.15,cy+r*.3,r*.7,0,Math.PI*2);ct.fill();
  ct.fillStyle=spec;ct.beginPath();ct.arc(cx-r*.28,cy-r*.28,r*.3,0,Math.PI*2);ct.fill();
  ct.globalAlpha=.35;ct.fillStyle='#fff';ct.beginPath();ct.arc(cx-r*.18,cy-r*.18,r*.15,0,Math.PI*2);ct.fill();ct.globalAlpha=1;
}

// ── BACKGROUND ──────────────────────────────────────────────
const SKY_COLS=[['#5bbce4','#a8e4f8'],['#e89040','#f8d080'],['#9060cc','#c090f0']];
const HILL_COLS=['#6ad08a','#d4a060','#9060cc'];
const GROUND_COLS=[
  [['#5dcc68','#3aaa45'],['#c47830','#8b5420']],
  [['#d4a060','#b07840'],['#8b5420','#6b3e18']],
  [['#8850cc','#6030aa'],['#4a2880','#2a1050']]
];
function drawBG(){
  const [sc1,sc2]=SKY_COLS[levelNum]||SKY_COLS[0];
  ct.fillStyle=lg(0,0,0,CH,sc1,sc2);ct.fillRect(0,0,CW,CH);
  // Sun
  ct.shadowColor='#ffe080';ct.shadowBlur=24;
  sphere(CW*.84,CH*.12,16,'#ffe840','#ffcc00','#ffffff');
  ct.shadowBlur=0;
  // Clouds
  const cx=(camX*.06)%CW;
  const cc=levelNum===2?'rgba(220,180,255,.75)':'rgba(255,255,255,.8)';
  [[140,54,68],[365,40,88],[85,78,54],[510,62,62]].forEach(([bx,by,bw])=>{
    const rx=(bx-cx%CW+CW*2)%CW;
    ct.globalAlpha=.75;ct.fillStyle=cc;
    ct.beginPath();ct.ellipse(rx,by,bw*.58,bw*.23,0,0,Math.PI*2);ct.fill();
    ct.beginPath();ct.ellipse(rx+bw*.26,by+5,bw*.36,bw*.17,0,0,Math.PI*2);ct.fill();
    ct.beginPath();ct.ellipse(rx-bw*.22,by+5,bw*.3,bw*.15,0,0,Math.PI*2);ct.fill();
    ct.globalAlpha=1;
  });
  // Background hills
  const mx=(camX*.3)%CW;
  ct.fillStyle=HILL_COLS[levelNum]||HILL_COLS[0];
  [[65,GY,80],[225,GY,110],[390,GY,88],[555,GY,115]].forEach(([bx,by,bw])=>{
    [[bx-mx%CW,by],[bx-mx%CW+CW,by]].forEach(([rx])=>{
      ct.beginPath();ct.moveTo(rx-bw*.5,by);ct.bezierCurveTo(rx-bw*.3,by-bw*.7,rx+bw*.1,by-bw*.5,rx+bw*.2,by-bw*.3);ct.bezierCurveTo(rx+bw*.35,by-bw*.1,rx+bw*.5,by,rx+bw*.5,by);ct.closePath();ct.fill();
    });
  });
  // Ground
  const [[gt1,gt2],[gd1,gd2]]=GROUND_COLS[levelNum]||GROUND_COLS[0];
  const gx0=Math.floor(camX/32)*32-Math.round(camX);
  for(let gx=gx0;gx<CW+32;gx+=32){
    ct.fillStyle=lg(gx,GY,gx,GY+10,gt1,gt2);ct.fillRect(gx,GY,32,10);
    ct.fillStyle=lg(gx,GY+10,gx,CH,gd1,gd2);ct.fillRect(gx,GY+10,32,CH-GY-10);
    ct.strokeStyle='rgba(0,0,0,.12)';ct.lineWidth=1;ct.strokeRect(gx+.5,GY+.5,31,CH-GY-1);
    if(levelNum===0){ct.fillStyle='#44bb55';ct.fillRect(gx+4,GY-2,2,3);ct.fillRect(gx+14,GY-3,2,4);ct.fillRect(gx+24,GY-2,2,3);}
    else if(levelNum===1){ct.fillStyle='#e8c060';ct.fillRect(gx+6,GY-2,2,3);ct.fillRect(gx+18,GY-3,2,4);}
    else{ct.fillStyle='#dd88ff';ct.fillRect(gx+4,GY-3,2,4);ct.fillRect(gx+14,GY-5,2,6);ct.fillRect(gx+24,GY-3,2,4);}
    const edgeCol=levelNum===0?'#88ee88':levelNum===1?'#f0d080':'#dd88ff';
    ct.strokeStyle=edgeCol;ct.lineWidth=1;ct.beginPath();ct.moveTo(gx,GY-.5);ct.lineTo(gx+32,GY-.5);ct.stroke();
  }
}

// ── PLATFORMS ───────────────────────────────────────────────
const PLAT_COLS=[['#f0d060','#d4aa30','#a07820'],['#e07840','#c05820','#903810'],['#9070e0','#7050c0','#503098']];
function drawPlat(p,ox){
  const x=Math.round(p.x-ox);
  ct.globalAlpha=.2;ct.fillStyle='#000';ct.fillRect(x+3,p.y+18,p.w,5);ct.globalAlpha=1;
  const [cT,cF,cS]=PLAT_COLS[levelNum]||PLAT_COLS[0];
  ct.fillStyle=lg(x,p.y-4,x,p.y,cT,cF);
  ct.beginPath();ct.moveTo(x,p.y);ct.lineTo(x+p.w,p.y);ct.lineTo(x+p.w+4,p.y-4);ct.lineTo(x+4,p.y-4);ct.closePath();ct.fill();
  ct.fillStyle=cS;ct.beginPath();ct.moveTo(x+p.w,p.y);ct.lineTo(x+p.w+4,p.y-4);ct.lineTo(x+p.w+4,p.y+12);ct.lineTo(x+p.w,p.y+16);ct.closePath();ct.fill();
  ct.fillStyle=lg(x,p.y,x,p.y+16,cF,cS);ct.fillRect(x,p.y,p.w,16);
  ct.strokeStyle='rgba(255,255,255,.45)';ct.lineWidth=1;ct.beginPath();ct.moveTo(x,p.y+.5);ct.lineTo(x+p.w,p.y+.5);ct.stroke();
}

// ── MOVING PLATFORMS ────────────────────────────────────────
function drawMovPlat(mp,ox){
  const x=Math.round(mp.x-ox),pulse=.5+.5*Math.sin(NOW*.006);
  ct.globalAlpha=.2;ct.fillStyle='#000';ct.fillRect(x+3,mp.y+18,mp.w,5);ct.globalAlpha=1;
  // Teal/cyan gradient top face
  ct.fillStyle=lg(x,mp.y-4,x,mp.y,'#60e8f8','#28b8d0');
  ct.beginPath();ct.moveTo(x,mp.y);ct.lineTo(x+mp.w,mp.y);ct.lineTo(x+mp.w+4,mp.y-4);ct.lineTo(x+4,mp.y-4);ct.closePath();ct.fill();
  ct.fillStyle='#186880';ct.beginPath();ct.moveTo(x+mp.w,mp.y);ct.lineTo(x+mp.w+4,mp.y-4);ct.lineTo(x+mp.w+4,mp.y+12);ct.lineTo(x+mp.w,mp.y+16);ct.closePath();ct.fill();
  ct.fillStyle=lg(x,mp.y,x,mp.y+16,'#28b8d0','#186880');ct.fillRect(x,mp.y,mp.w,16);
  // Pulsing top edge glow
  ct.shadowColor='#00eeff';ct.shadowBlur=4+3*pulse;
  ct.strokeStyle='rgba(0,230,255,.8)';ct.lineWidth=1.5;ct.beginPath();ct.moveTo(x,mp.y+.5);ct.lineTo(x+mp.w,mp.y+.5);ct.stroke();
  ct.shadowBlur=0;
  // Direction arrow
  const mid=x+(mp.w>>1);
  ct.fillStyle=`rgba(0,230,255,${.5+.3*pulse})`;ct.font='9px monospace';ct.textAlign='center';ct.textBaseline='middle';
  ct.fillText(mp.axis==='y'?'↕':'↔',mid,mp.y+8);
}

// ── BLOCKS ──────────────────────────────────────────────────
function drawBlock(b,ox){
  const x=Math.round(b.x-ox),y=b.bh>0?b.y-Math.sin(b.bh/8*Math.PI)*5:b.y,d=5;

    }else{
      box3d(x,y,32,32,d,'#ffee22','#ffcc00','#cc9900');

      ct.strokeStyle='#ffe060';ct.lineWidth=1;ct.strokeRect(x+3.5,y+3.5,25,25);
      ct.fillStyle='#883300';ct.font='bold 20px monospace';ct.textAlign='center';ct.textBaseline='middle';ct.fillText('?',x+16,y+18);
      ct.globalAlpha=.25;ct.fillStyle='#fff';ct.beginPath();ct.moveTo(x+d,y-d);ct.lineTo(x+32+d,y-d);ct.lineTo(x+32,y);ct.lineTo(x,y);ct.closePath();ct.fill();ct.globalAlpha=1;

    ct.globalAlpha=.1;ct.fillStyle='#fff';ct.beginPath();ct.moveTo(x+d,y-d);ct.lineTo(x+32+d,y-d);ct.lineTo(x+32,y);ct.lineTo(x,y);ct.closePath();ct.fill();ct.globalAlpha=1;
  }
}

// ── SPRINGS ─────────────────────────────────────────────────
function drawSpring(sp,ox){
  const x=Math.round(sp.x-ox),y=sp.y,b=(NOW/90|0)%4<2?0:1;
  ct.globalAlpha=.18;ct.fillStyle='#000';ct.fillRect(x+1,y+14,18,4);ct.globalAlpha=1;

  ct.strokeStyle='#33cc66';ct.lineWidth=2;

// ── POWER-UPS ───────────────────────────────────────────────

// ── ASTRONAUT ───────────────────────────────────────────────
function drawAstronaut(bx,sy,pwr,fire,star,crouch,fr,dir){

  ct.save();ct.translate(bx+hw/2,0);if(d===-1)ct.scale(-1,1);ct.translate(-hw/2,0);
  const x=0,y=sy,ph=NOW/70&3;
  const starCols=['#ff4455','#ffee00','#44ff66','#00ccff'];
  const helmetBase=star>0?starCols[ph]:'#d0d0e0';
  const helmetDark=star>0?starCols[(ph+2)%4]:'#707090';
  const helmetSpec=star>0?'#fff':'#eeeeff';
  const visorC=star>0?starCols[(ph+1)%4]:'#0088cc';
  const bodyC=fire?'#ffe066':'#ddddf0';
  const suitC=fire?'#aa2200':'#1a306a';
  if(star>0){ct.shadowColor=starCols[ph];ct.shadowBlur=10;}
  if(crouch){
    sphere(x+10,y+8,8,helmetBase,helmetDark,helmetSpec);
    ct.fillStyle=visorC;ct.beginPath();ct.ellipse(x+14,y+9,5,3,-.2,0,Math.PI*2);ct.fill();
    ct.globalAlpha=.5;ct.fillStyle='#fff';ct.beginPath();ct.ellipse(x+15,y+8,2,1,-.3,0,Math.PI*2);ct.fill();ct.globalAlpha=1;
    ct.fillStyle=lg(x,y+16,x,y+(pwr?30:20),bodyC,suitC);rr(x+1,y+16,18,pwr?10:8,3);ct.fill();
    ct.fillStyle=suitC;ct.fillRect(x+2,y+(pwr?23:21),7,3);ct.fillRect(x+11,y+(pwr?23:21),7,3);
  }else if(pwr){
    const lo=[0,2,0,-2][fr%4];
    sphere(x+10,y+10,10,helmetBase,helmetDark,helmetSpec);
    ct.fillStyle=visorC;ct.beginPath();ct.ellipse(x+14,y+11,6,4,-.15,0,Math.PI*2);ct.fill();
    ct.globalAlpha=.5;ct.fillStyle='#fff';ct.beginPath();ct.ellipse(x+15,y+10,2.5,1.5,-.2,0,Math.PI*2);ct.fill();ct.globalAlpha=1;
    if(fire){ct.fillStyle=lg(x-4,y+14,x,y+14,'#882200','#cc3300');ct.fillRect(x-4,y+14,5,10);ct.fillStyle='#ff6600';ct.fillRect(x-4,y+15,4,2);}
    ct.fillStyle=lg(x+1,y+20,x+1,y+38,bodyC,suitC);rr(x+1,y+20,18,17,4);ct.fill();
    ct.fillStyle=suitC;ct.fillRect(x-1,y+29,22,5);ct.fillStyle='#2255aa';ct.fillRect(x+7,y+30,6,3);
    ct.fillStyle=suitC;ct.fillRect(x+2,y+22,4,8);ct.fillRect(x+14,y+22,4,8);
    ct.fillStyle=lg(x,y+34,x,y+44,suitC,'#111128');rr(x+1,y+34,7,8,3);ct.fill();rr(x+12,y+34,7,8,3);ct.fill();
    const lo2=[0,2,0,-2][fr%4];
    ct.fillStyle='#111128';rr(x-1,y+38+lo2,10,4,2);ct.fill();rr(x+11,y+38-lo2,10,4,2);ct.fill();
    ct.fillStyle='rgba(255,255,255,.1)';ct.fillRect(x,y+38+lo2,4,2);ct.fillRect(x+12,y+38-lo2,4,2);
  }else{
    const lo=[0,2,0,-2][fr%4];
    sphere(x+10,y+8,9,helmetBase,helmetDark,helmetSpec);
    ct.fillStyle=visorC;ct.beginPath();ct.ellipse(x+14,y+9,5,3.5,-.15,0,Math.PI*2);ct.fill();
    ct.globalAlpha=.5;ct.fillStyle='#fff';ct.beginPath();ct.ellipse(x+15,y+8,2,1.5,-.2,0,Math.PI*2);ct.fill();ct.globalAlpha=1;
    ct.fillStyle=lg(x+1,y+17,x+1,y+31,bodyC,suitC);rr(x+1,y+17,18,13,3);ct.fill();
    ct.fillStyle=suitC;ct.fillRect(x-1,y+22,22,4);ct.fillRect(x+2,y+19,3,6);ct.fillRect(x+15,y+19,3,6);
    ct.fillStyle=lg(x,y+27,x,y+34,suitC,'#111128');rr(x+1,y+27,7,6,2);ct.fill();rr(x+12,y+27,7,6,2);ct.fill();
    ct.fillStyle='#111128';rr(x-1,y+30+lo,10,3,2);ct.fill();rr(x+11,y+30-lo,10,3,2);ct.fill();
    ct.fillStyle='rgba(255,255,255,.1)';ct.fillRect(x,y+30+lo,4,1);ct.fillRect(x+12,y+30-lo,4,1);
  }
  ct.shadowBlur=0;ct.restore();
}
function drawPlayer(p,ox){
  if(!p)return;
  if(p.inv>0&&p.star===0&&(p.inv/4|0)%2===0)return;
  if(!p.dead){ct.globalAlpha=.18;ct.fillStyle='#000';ct.beginPath();ct.ellipse(Math.round(p.x-ox)+10,GY+2,10,3,0,0,Math.PI*2);ct.fill();ct.globalAlpha=1;}
  drawAstronaut(Math.round(p.x-ox),Math.round(p.y),p.pwr,p.fire,p.star,p.crouch,p.fr,p.dir);
}

// ── BLOB ENEMY ──────────────────────────────────────────────
function drawBlob(e,ox){
  const x=Math.round(e.x-ox),y=Math.round(e.y),cx2=x+12,cy2=y+13;
  if(e.stomp){
    ct.fillStyle='#bb3311';ct.beginPath();ct.ellipse(cx2,y+e.h-3,12,3,0,0,Math.PI*2);ct.fill();
    ct.fillStyle='#dd5533';ct.beginPath();ct.ellipse(cx2,y+e.h-3,8,2,0,0,Math.PI*2);ct.fill();return;
  }
  ct.globalAlpha=.2;ct.fillStyle='#000';ct.beginPath();ct.ellipse(cx2,y+e.h+1,10,2.5,0,0,Math.PI*2);ct.fill();ct.globalAlpha=1;
  sphere(cx2,cy2,12,'#cc4422','#881100','#ff7755');
  ct.fillStyle='rgba(255,140,110,.35)';ct.beginPath();ct.ellipse(cx2,cy2+3,8,7,0,0,Math.PI*2);ct.fill();
  const exo=e.vx<0?-1:1;
  [x+4,x+18].forEach((ex,i)=>{
    ct.fillStyle='#fff';ct.beginPath();ct.ellipse(ex+exo,y+7,4.5,5,i===0?-.15:.15,0,Math.PI*2);ct.fill();
    ct.fillStyle='#220000';ct.beginPath();ct.arc(ex+exo*1.2,y+8,3,0,Math.PI*2);ct.fill();
    ct.fillStyle='#cc0000';ct.beginPath();ct.arc(ex+exo*.8,y+7.5,2,0,Math.PI*2);ct.fill();
    ct.fillStyle='rgba(255,255,255,.75)';ct.beginPath();ct.arc(ex+exo+1.2,y+6.5,1,0,Math.PI*2);ct.fill();
  });
  ct.strokeStyle='#660000';ct.lineWidth=2;ct.lineCap='round';
  ct.beginPath();ct.moveTo(x+1,y+3);ct.quadraticCurveTo(x+5,y+2,x+9,y+5);ct.stroke();
  ct.beginPath();ct.moveTo(x+23,y+3);ct.quadraticCurveTo(x+19,y+2,x+15,y+5);ct.stroke();
  const fo=e.fr===0?2:-2;
  [{cx:x+6+fo},{cx:x+18-fo}].forEach(({cx:fc})=>sphere(fc,y+e.h-1,5,'#aa3311','#771100','#cc5533'));
}

// ── DROID ENEMY ─────────────────────────────────────────────
function drawDroid(e,ox){

    sphere(x+14,y+14,12,'#223344','#111a22','#4a6680');

    ct.globalAlpha=.3;ct.strokeStyle='#00ccff';ct.lineWidth=1;
    ct.beginPath();ct.moveTo(x+14,y+3);ct.lineTo(x+14,y+25);ct.stroke();ct.beginPath();ct.moveTo(x+3,y+14);ct.lineTo(x+25,y+14);ct.stroke();
    ct.globalAlpha=1;return;
  }
  ct.save();if(e.dir>0){ct.translate(x+e.w,0);ct.scale(-1,1);ct.translate(-e.w,0);}

  ct.globalAlpha=.18;ct.fillStyle='#000';ct.beginPath();ct.ellipse(bx+14,y+e.h+1,10,2,0,0,Math.PI*2);ct.fill();ct.globalAlpha=1;
  box3d(bx+4,y+10,20,18,3,lg(bx+4,y+10,bx+24,y+10,'#2a3a4a','#1a2836'),lg(bx+4,y+10,bx+4,y+28,'#1e2e3e','#131e2a'),'#0e1820');
  ct.fillStyle='#223344';ct.fillRect(bx+7,y+13,6,5);ct.fillRect(bx+15,y+13,6,5);
  ct.fillStyle='#44aaff';ct.fillRect(bx+8,y+14,4,3);ct.fillStyle='#ff4444';ct.fillRect(bx+16,y+14,4,3);
  box3d(bx+5,y+2,16,9,3,lg(bx+5,y+2,bx+21,y+2,'#2e3e50','#1a2a38'),lg(bx+5,y+2,bx+5,y+11,'#22323e','#141e28'),'#0e1820');
  ct.shadowColor='#ff2222';ct.shadowBlur=6;
  ct.fillStyle=lg(bx+18,y+4,bx+26,y+4,'#ff5555','#cc1111');ct.fillRect(bx+18,y+4,9,4);
  ct.fillStyle='#ff9999';ct.fillRect(bx+19,y+4,3,2);ct.shadowBlur=0;
  ct.fillStyle='#445566';ct.fillRect(bx+20,y-2,2,4);
  ct.shadowColor='#ff2222';ct.shadowBlur=4;ct.fillStyle='#ff2222';ct.beginPath();ct.arc(bx+21,y-2,2,0,Math.PI*2);ct.fill();ct.shadowBlur=0;
  const fo=e.fr===0?2:-2;
  box3d(bx+4+fo,y+e.h-10,8,10,2,'#1a2836','#121e2a','#0e1820');
  box3d(bx+e.w-12-fo,y+e.h-10,8,10,2,'#1a2836','#121e2a','#0e1820');
  ct.restore();
}

// ── FLYER ENEMY (UFO drone) ─────────────────────────────────
function drawFlyer(e,ox){
  const x=Math.round(e.x-ox),y=Math.round(e.y),cx2=x+13,cy2=y+9;
  if(e.stomp){
    ct.fillStyle='#7722aa';ct.beginPath();ct.ellipse(cx2,y+e.h-2,13,3,0,0,Math.PI*2);ct.fill();
    ct.fillStyle='#aa44dd';ct.beginPath();ct.ellipse(cx2,y+e.h-2,8,2,0,0,Math.PI*2);ct.fill();return;
  }
  const wob=Math.sin(NOW*.012)*1.2;
  ct.globalAlpha=.16;ct.fillStyle='#000';ct.beginPath();ct.ellipse(cx2,GY+2,11,2.5,0,0,Math.PI*2);ct.fill();ct.globalAlpha=1;
  // Glow halo
  ct.shadowColor='#cc55ff';ct.shadowBlur=10;
  // Saucer body
  ct.fillStyle=lg(x,cy2,x+e.w,cy2,'#9933cc','#6611aa');ct.beginPath();ct.ellipse(cx2,cy2+wob,13,5,0,0,Math.PI*2);ct.fill();
  ct.shadowBlur=0;
  ct.fillStyle='#440a66';ct.beginPath();ct.ellipse(cx2,cy2+2+wob,11,2.5,0,0,Math.PI*2);ct.fill();
  // Dome
  ct.fillStyle=lg(cx2-6,cy2-8,cx2+6,cy2,'#bb88ff','#7744cc');ct.beginPath();ct.arc(cx2,cy2-1+wob,6,Math.PI,0);ct.fill();
  ct.fillStyle='rgba(255,255,255,.5)';ct.beginPath();ct.ellipse(cx2-2,cy2-3+wob,2,2.5,0,0,Math.PI*2);ct.fill();
  // Blinking lights
  const lc=(NOW/120|0)%2===0?'#ffee44':'#ff4488';
  [-9,-3,3,9].forEach((dx,i)=>{ct.fillStyle=(NOW/120+i|0)%2===0?lc:'#552277';ct.beginPath();ct.arc(cx2+dx,cy2+3+wob,1.4,0,Math.PI*2);ct.fill();});
  // Beam flicker
  if((NOW/200|0)%3===0){ct.globalAlpha=.18;ct.fillStyle='#dd88ff';ct.beginPath();ct.moveTo(cx2-5,cy2+4+wob);ct.lineTo(cx2+5,cy2+4+wob);ct.lineTo(cx2+9,cy2+18+wob);ct.lineTo(cx2-9,cy2+18+wob);ct.closePath();ct.fill();ct.globalAlpha=1;}
}

// ── LASER ───────────────────────────────────────────────────
function drawLaser(lb,ox){
  const x=Math.round(lb.x-ox),y=Math.round(lb.y);
  const col=lb.fr===0?'#ffcc00':'#ffe860';
  ct.shadowColor='#ffaa00';ct.shadowBlur=7;ct.strokeStyle=col;ct.lineWidth=3;
  ct.beginPath();if(lb.vx>0){ct.moveTo(x,y+3);ct.lineTo(x+16,y+3);}else{ct.moveTo(x+lb.w,y+3);ct.lineTo(x-6,y+3);}ct.stroke();ct.shadowBlur=0;
  ct.fillStyle='#fff';ct.fillRect(lb.vx>0?x+13:x-4,y+1,3,4);
}

// ── MENU PREVIEW ─────────────────────────────────────────────
function drawMenuPreview(){

// ── LEVEL BANNER ─────────────────────────────────────────────
let bannerTimer=0,bannerText='';
function showBanner(txt){bannerText=txt;bannerTimer=130;}

// ── RENDER ──────────────────────────────────────────────────
function render(){
  ct.save();
  if(shk>.4){const sx=(Math.random()-.5)*shk,sy=(Math.random()-.5)*shk;ct.translate(sx,sy);shk*=.72;}else shk=0;
  const ox=Math.round(camX);
  drawBG();
  // Level banner
  if(bannerTimer>0){
    bannerTimer--;
    const ba=Math.min(1,bannerTimer/20)*Math.min(1,(130-bannerTimer)/20+.2);
    ct.globalAlpha=ba;
    ct.fillStyle='rgba(0,0,0,.5)';ct.fillRect(CW/2-130,CH/2-24,260,48);
    ct.fillStyle='#ffee22';ct.font='bold 22px monospace';ct.textAlign='center';ct.textBaseline='middle';ct.fillText(bannerText,CW/2,CH/2);
    ct.globalAlpha=1;
  }
  if(!lvData){if(gst==='menu')drawMenuPreview();ct.restore();return;}
  coinList.forEach(c=>{const sx=c.x-ox;if(!c.col&&sx>-20&&sx<CW+20)drawCrystal(c,ox);});
  powerUps.forEach(pu=>{const sx=pu.x-ox;if(sx>-40&&sx<CW+40)drawPU(pu,ox);});
  lvData.plats.forEach(p=>{const sx=p.x-ox;if(sx>-p.w&&sx<CW+p.w)drawPlat(p,ox);});
  if(lvData.movPlats)lvData.movPlats.forEach(mp=>{const sx=mp.x-ox;if(sx>-mp.w&&sx<CW+mp.w)drawMovPlat(mp,ox);});
  blkList.forEach(b=>{const sx=b.x-ox;if(sx<-32||sx>CW)return;drawBlock(b,ox);});
  lvData.tubes.forEach(p=>{const sx=p.x-ox;if(sx>-p.w&&sx<CW+p.w)drawTube(p,ox);});
  if(lvData.checkpts)lvData.checkpts.forEach(cp=>{const sx=cp.x-ox;if(sx>-40&&sx<CW+40)drawCheckpoint(cp,ox);});
  if(lvData.springs)lvData.springs.forEach(sp=>{const sx=sp.x-ox;if(sx>-30&&sx<CW+30)drawSpring(sp,ox);});
  drawBeacon(lvData.flagX,ox);
  enemies.forEach(e=>{if(!e.alive)return;const sx=e.x-ox;if(sx<-60||sx>CW+60)return;e.t==='g'?drawBlob(e,ox):e.t==='f'?drawFlyer(e,ox):drawDroid(e,ox);});
  lasers.forEach(lb=>{if(lb.active)drawLaser(lb,ox);});
  if(player&&(!player.dead||player.y<CH+40))drawPlayer(player,ox);
  parts.forEach(p=>p.draw(ox));
  if(gst==='menu')drawMenuPreview();
  // Progress bar
  if(gst==='playing'&&player&&!player.dead&&!player.goal&&lvData){
    const prog=Math.min(1,Math.max(0,player.x/(lvData.flagX||lw)));
    const bw=CW-32,bx=16;
    ct.fillStyle='rgba(0,0,0,.35)';ct.fillRect(bx,CH-9,bw,5);
    const barH=`hsl(${140+prog*60|0},80%,50%)`;ct.fillStyle=barH;ct.fillRect(bx,CH-9,bw*prog|0,5);
    ct.fillStyle='rgba(255,255,255,.25)';ct.fillRect(bx,CH-9,bw,1);
    ct.fillStyle='#fff';ct.fillRect((bx+bw*prog-1)|0,CH-11,3,8);
    ct.fillStyle='#ffcc00';ct.fillRect(bx+bw-1,CH-11,3,8);
  }
  ct.restore();
}

// ── MAIN LOOP ────────────────────────────────────────────────
function loop(){NOW=Date.now();scheduleMusicNotes();update();render();for(const k in JP)delete JP[k];requestAnimationFrame(loop);}

// ── BUTTON HANDLERS ─────────────────────────────────────────
ovBtn.addEventListener('click',()=>{
  initAC();
  if(gst==='paused'){togglePause();return;}
  if(gst==='stop'&&nextLvlReady){
    nextLvlReady=false;levelNum++;cpX=-1;levelEndTime=0;
    lvData=LV_BUILDERS[levelNum]();lw=lvData.lw;
    resetRound();gst='playing';ov.classList.add('off');
    setHUD();updatePwrHUD();showBanner(LEVEL_NAMES[levelNum]);
    musicBeat=0;if(AC)musicNextT=AC.currentTime;if(!musicActive)startMusic();
    if(isTouchDevice&&!isFS())requestFS(document.documentElement);
    return;
  }
  nextLvlReady=false;ovT.style.color='#00ccff';initGame();
});
cv.addEventListener('click',()=>{initAC();if(gst==='paused'){togglePause();return;}if(gst==='menu')initGame();});

ct.fillStyle='#5bbce4';ct.fillRect(0,0,CW,CH);
hmuEl.addEventListener('click',()=>{musicMuted=!musicMuted;if(!musicMuted&&musicActive&&AC)musicNextT=AC.currentTime;setMusicIcon();});
loop();showMenu();

// ── TOUCH CONTROLS ──────────────────────────────────────────
isTouchDevice=('ontouchstart' in window||navigator.maxTouchPoints>0);
if(isTouchDevice){document.getElementById('tc').style.display='block';document.getElementById('ctrl').style.display='none';tcH=112;resize();showMenu();}
function tcBind(id,key){
  const el=document.getElementById(id);
  const press=e=>{e.preventDefault();el.classList.add('on');if(!K[key])JP[key]=true;K[key]=true;};
  const release=e=>{e.preventDefault();el.classList.remove('on');K[key]=false;};
  el.addEventListener('touchstart',press,{passive:false});el.addEventListener('touchend',release,{passive:false});el.addEventListener('touchcancel',release,{passive:false});
  el.addEventListener('mousedown',press);el.addEventListener('mouseup',release);el.addEventListener('mouseleave',release);
}
tcBind('tc-l','ArrowLeft');tcBind('tc-r','ArrowRight');tcBind('tc-d','ArrowDown');tcBind('tc-a','ArrowUp');tcBind('tc-b','ShiftLeft');tcBind('tc-x','KeyX');
const tcpEl=document.getElementById('tc-p');
const ppP=e=>{e.preventDefault();tcpEl.classList.add('on');togglePause();};
const ppR=e=>{e.preventDefault();tcpEl.classList.remove('on');};
tcpEl.addEventListener('touchstart',ppP,{passive:false});tcpEl.addEventListener('touchend',ppR,{passive:false});
tcpEl.addEventListener('mousedown',ppP);tcpEl.addEventListener('mouseup',ppR);
</script>
