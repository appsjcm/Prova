<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Super Arcade Bros</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f1a;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:monospace;color:#fff;overflow:hidden}
h1{font-size:2rem;margin-bottom:8px;letter-spacing:4px;text-transform:uppercase;background:linear-gradient(135deg,#ffdd00,#ff8800);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
#hud{display:flex;gap:36px;margin-bottom:10px}
.hb{text-align:center}
.hl{font-size:9px;color:#666;letter-spacing:2px;text-transform:uppercase}
.hv{font-size:1.5rem;font-weight:bold;color:#ffdd00}
#wrap{position:relative}
canvas{display:block;border:3px solid #e63946;border-radius:6px;box-shadow:0 0 40px rgba(230,57,70,.3)}
#ov{position:absolute;inset:0;background:rgba(8,5,20,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:4px;gap:14px}
#ov.off{display:none}
#ov-t{font-size:1.8rem;color:#ffdd00;letter-spacing:4px}
#ov-m{color:#888;font-size:.85rem}
#ov-b{color:#aaa;font-size:.8rem;letter-spacing:1px}
#ov-btn{padding:11px 36px;font-size:.9rem;font-weight:bold;letter-spacing:3px;text-transform:uppercase;background:linear-gradient(135deg,#e63946,#c1121f);color:#fff;border:none;border-radius:6px;cursor:pointer;box-shadow:0 0 20px rgba(230,57,70,.4);transition:transform .1s}
#ov-btn:hover{transform:scale(1.05)}
#ctrl{margin-top:10px;color:#333;font-size:.72rem;text-align:center;line-height:2}
.k{display:inline-block;background:#111;border:1px solid #333;border-radius:3px;padding:1px 6px;color:#666}
</style>
</head>
<body>
<h1>Super Arcade Bros</h1>
<div id="hud">
  <div class="hb"><div class="hl">Puntos</div><div class="hv" id="hs">000000</div></div>
  <div class="hb"><div class="hl">Monedas</div><div class="hv" id="hc">×00</div></div>
  <div class="hb"><div class="hl">Vidas</div><div class="hv" id="hl">3</div></div>
  <div class="hb"><div class="hl">Tiempo</div><div class="hv" id="ht">300</div></div>
</div>
<div id="wrap">
  <canvas id="c" width="600" height="380"></canvas>
  <div id="ov">
    <div id="ov-t">SUPER ARCADE BROS</div>
    <div id="ov-m">Usa las flechas o WASD · Salta con ↑ Z o Espacio</div>
    <div id="ov-b"></div>
    <button id="ov-btn">JUGAR</button>
  </div>
</div>
<div id="ctrl">
  <span class="k">← →</span> mover &nbsp; <span class="k">↑</span><span class="k">Z</span><span class="k">Esp</span> saltar &nbsp; <span class="k">Shift</span> correr &nbsp; <span class="k">P</span> pausa
</div>

<script>
'use strict';
// ── SETUP ───────────────────────────────────────────────────
const cv = document.getElementById('c');
const ct = cv.getContext('2d');
const CW = 600, CH = 380, GY = 320, LW = 3600;
const GRAV = 0.52, JV = -12, WS = 2.6, RS = 4.8;

// Scale canvas to window
const wrap = document.getElementById('wrap');
function resize() {
  const s = Math.min((innerWidth - 32) / CW, (innerHeight - 120) / CH, 1.5);
  cv.style.width  = CW * s + 'px';
  cv.style.height = CH * s + 'px';
  wrap.style.width  = CW * s + 'px';
}
window.addEventListener('resize', resize); resize();

// ── INPUT ───────────────────────────────────────────────────
const K = {}, JP = {};
window.addEventListener('keydown', e => {
  if (!K[e.code]) JP[e.code] = true;
  K[e.code] = true;
  if (['Space','ArrowUp','ArrowLeft','ArrowRight','ArrowDown'].includes(e.code)) e.preventDefault();
  if (e.code === 'KeyP') togglePause();
});
window.addEventListener('keyup', e => K[e.code] = false);
const isL  = () => K.ArrowLeft  || K.KeyA;
const isR  = () => K.ArrowRight || K.KeyD;
const isJ  = () => K.ArrowUp || K.KeyZ || K.Space;
const isRn = () => K.ShiftLeft || K.ShiftRight;
const jpJ  = () => JP.ArrowUp || JP.KeyZ || JP.Space;

// ── DOM ─────────────────────────────────────────────────────
const ov    = document.getElementById('ov');
const ovT   = document.getElementById('ov-t');
const ovM   = document.getElementById('ov-m');
const ovB   = document.getElementById('ov-b');
const ovBtn = document.getElementById('ov-btn');
const hsEl  = document.getElementById('hs');
const hcEl  = document.getElementById('hc');
const hlEl  = document.getElementById('hl');
const htEl  = document.getElementById('ht');

// ── STATE ───────────────────────────────────────────────────
let gst = 'menu', score = 0, coins = 0, lives = 3, tLeft = 300;
let camX = 0, tAccum = 0, dTimer = 0, wTimer = 0;
let player, enemies, coinList, blkList, parts, lvData;
let hiScore = +localStorage.getItem('sabHi') || 0;

function setHUD() {
  hsEl.textContent = String(score).padStart(6,'0');
  hcEl.textContent = '×' + String(coins).padStart(2,'0');
  hlEl.textContent = lives;
  htEl.textContent = Math.ceil(tLeft);
}
function addScore(n) {
  score += n;
  if (score > hiScore) { hiScore = score; localStorage.setItem('sabHi', hiScore); }
  hsEl.textContent = String(score).padStart(6,'0');
}

// ── LEVEL DATA ──────────────────────────────────────────────
function buildLevel() {
  const plats = [
    [200,264,96],[370,228,64],[520,272,128],
    [700,288,32],[732,256,32],[764,224,32],
    [880,248,160],[1070,216,96],[1240,272,64],
    [1390,240,192],[1610,200,128],[1790,264,96],
    [1960,228,160],[2190,272,128],[2390,240,96],
    [2560,200,64],[2730,256,128],[2950,220,96],
    [3090,264,128],[3250,224,64],[3370,248,128]
  ].map(([x,y,w]) => ({x,y,w,h:16}));

  const qbs = [
    [270,208],[350,208],[350,176],
    [912,208],[1110,176],[1448,192],
    [1670,160],[2068,184],[2448,192],
    [2788,208],[3108,208],[3268,176]
  ].map(([x,y]) => ({x,y,w:32,h:32,t:'q',hit:false,bh:0}));

  const bbs = [
    [392,208],[424,208],[456,208],
    [948,208],[980,208],
    [1928,208],[1960,208],[1992,208],
    [3148,208],[3180,208]
  ].map(([x,y]) => ({x,y,w:32,h:32,t:'b',hit:false,bh:0}));

  const blks = [...qbs, ...bbs];

  const cns = [
    [100,300],[124,300],[148,300],
    [216,244],[244,244],[272,244],
    [564,252],[596,252],
    [882,228],[916,228],
    [1404,216],[1436,216],[1468,216],
    [1628,176],[1660,176],
    [1980,188],[2012,188],
    [2580,288],[2608,288],
    [3096,244],[3124,244]
  ].map(([x,y]) => ({x,y,w:14,h:18,col:false,fr:0,ft:0}));

  const pipes = [
    [460,278,48,62],[836,262,48,78],[1328,278,48,62],
    [1968,278,48,62],[2408,262,48,78],[2688,278,48,62],
    [3028,278,48,62]
  ].map(([x,y,w,h]) => ({x,y,w,h}));

  const ens = [
    {t:'g',x:340},{t:'g',x:540},{t:'g',x:576},
    {t:'g',x:760},{t:'k',x:940},
    {t:'g',x:1140},{t:'g',x:1186},
    {t:'k',x:1468},{t:'g',x:1588},{t:'g',x:1748},
    {t:'k',x:1868},{t:'g',x:2096},{t:'g',x:2144},
    {t:'k',x:2292},{t:'g',x:2540},{t:'g',x:2656},
    {t:'k',x:2852},{t:'g',x:2972},{t:'g',x:3072},{t:'k',x:3212}
  ];

  return {plats, blks, cns, pipes, ens, flagX: LW-300};
}

// ── FACTORY FUNCTIONS ───────────────────────────────────────
function mkPlayer() {
  return {x:60,y:GY-34,w:20,h:34, vx:0,vy:0, dir:1,
    onG:false, coy:0, jBuf:0, jHeld:false,
    fr:0, ft:0, inv:0, dead:false, dvy:-11, goal:false};
}

function mkEnemies(defs) {
  return defs.map(d => ({
    t:d.t, x:d.x, y:GY-(d.t==='k'?36:26),
    w:d.t==='k'?28:24, h:d.t==='k'?36:26,
    vx:-1.2, vy:0, alive:true, stomp:false, sTimer:0,
    shell:false, dir:-1, fr:0, ft:0
  }));
}

function getSolids(lv) {
  const s = [{x:0,y:GY,w:LW,h:200}];
  lv.plats.forEach(p=>s.push(p));
  lv.blks.forEach(b=>s.push(b));
  lv.pipes.forEach(p=>s.push(p));
  return s;
}

// ── AABB ────────────────────────────────────────────────────
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}

function resH(e,sl) {
  for(const s of sl){if(!hit(e,s))continue;e.vx>0?e.x=s.x-e.w:e.x=s.x+s.w;e.vx=0;break;}
}
function resV(e,sl) {
  e.onG=false;
  for(const s of sl){
    if(!hit(e,s))continue;
    if(e.vy>=0){e.y=s.y-e.h;e.vy=0;e.onG=true;}
    else{e.y=s.y+s.h;e.vy=1;}
    break;
  }
}

// ── UPDATE PLAYER ───────────────────────────────────────────
function updPlayer(p,sl) {
  if(p.dead){p.y+=p.dvy;p.dvy+=GRAV;return;}
  if(p.goal){p.x+=1.5;p.ft++;if(p.ft>7){p.fr=(p.fr+1)%4;p.ft=0;}return;}

  const run=isRn(), spd=run?RS:WS;
  if(isL()){p.vx=-spd;p.dir=-1;}
  else if(isR()){p.vx=spd;p.dir=1;}
  else{p.vx*=.72;if(Math.abs(p.vx)<.1)p.vx=0;}

  if(jpJ())p.jBuf=8; else if(p.jBuf>0)p.jBuf--;
  if(p.onG)p.coy=6; else if(p.coy>0)p.coy--;

  if(p.jBuf>0&&(p.onG||p.coy>0)){
    p.vy=JV; p.jHeld=true; p.jBuf=0; p.coy=0;
  }
  const hj=isJ();
  if(!hj){p.jHeld=false;if(p.vy<-4)p.vy=-4;}
  if(hj&&p.jHeld&&p.vy<0){p.vy-=.28;if(p.vy<-14)p.vy=-14;}

  p.vy+=GRAV; if(p.vy>16)p.vy=16;
  p.x+=p.vx; p.x=Math.max(camX,Math.min(LW-p.w,p.x)); resH(p,sl);
  p.y+=p.vy; resV(p,sl);

  if(p.y>CH+60){pDie();return;}
  if(p.inv>0)p.inv--;

  if(p.onG&&Math.abs(p.vx)>.2){p.ft++;if(p.ft>=(run?4:7)){p.fr=(p.fr+1)%4;p.ft=0;}}
  else if(!p.onG)p.fr=2; else p.fr=0;
}

// ── UPDATE ENEMY ────────────────────────────────────────────
function updEnemy(e,sl) {
  if(!e.alive)return;
  if(e.stomp){if(--e.sTimer<=0)e.alive=false;return;}
  if(e.x>camX+CW+120||e.x<camX-120)return;
  e.vy+=GRAV; if(e.vy>14)e.vy=14;
  e.x+=e.vx;
  for(const s of sl){if(!hit(e,s))continue;e.vx>0?(e.x=s.x-e.w,e.vx=-Math.abs(e.vx)):(e.x=s.x+s.w,e.vx=Math.abs(e.vx));break;}
  e.y+=e.vy;
  for(const s of sl){if(!hit(e,s))continue;if(e.vy>=0){e.y=s.y-e.h;e.vy=0;}else{e.y=s.y+s.h;e.vy=1;}break;}
  if(e.x<0){e.x=0;e.vx=Math.abs(e.vx);}
  if(e.y>CH+80){e.alive=false;return;}
  if(++e.ft>=14){e.fr=(e.fr+1)%2;e.ft=0;}
}

// ── PARTICLES ───────────────────────────────────────────────
class Pop {
  constructor(x,y,vx,vy,col,life){Object.assign(this,{x,y,vx,vy,col,life,ml:life});}
  tick(){this.x+=this.vx;this.y+=this.vy;this.vy+=.35;this.life--;return this.life>0;}
  draw(ox){ct.globalAlpha=this.life/this.ml;ct.fillStyle=this.col;ct.fillRect(Math.round(this.x-ox),Math.round(this.y),5,5);ct.globalAlpha=1;}
}
class TextPop {
  constructor(x,y,txt,col){Object.assign(this,{x,y,txt,col,life:50});}
  tick(){this.y-=.6;this.life--;return this.life>0;}
  draw(ox){ct.globalAlpha=this.life/50;ct.fillStyle=this.col;ct.font='bold 12px monospace';ct.textAlign='center';ct.fillText(this.txt,this.x-ox,this.y);ct.globalAlpha=1;}
}

// ── GAME ACTIONS ────────────────────────────────────────────
function pDie(){
  if(player.dead||player.goal)return;
  player.dead=true;player.dvy=-11;
  lives--;hlEl.textContent=lives;dTimer=90;
}
function pWin(){
  if(player.goal)return;player.goal=true;wTimer=180;
  addScore(Math.ceil(tLeft)*5);tLeft=0;setHUD();
}
function stompE(e){
  if(e.t==='k'&&!e.shell){e.shell=true;e.vx=0;e.h=20;e.y+=16;addScore(100);parts.push(new TextPop(e.x+14,e.y,'+100','#ffdd00'));return;}
  e.stomp=true;e.sTimer=22;
  const pts=e.t==='g'?100:200;
  addScore(pts);parts.push(new TextPop(e.x+12,e.y,'+'+pts,'#ffdd00'));
}

function togglePause(){
  if(gst==='playing'){
    gst='paused';ov.classList.remove('off');
    ovT.textContent='PAUSA';ovT.style.color='#00ccff';
    ovM.textContent='Pulsa P para continuar';ovB.textContent='';
    ovBtn.style.display='none';
  }else if(gst==='paused'){
    gst='playing';ov.classList.add('off');ovBtn.style.display='';
  }
}

// ── INIT / RESET ────────────────────────────────────────────
function initGame(){
  score=0;coins=0;lives=3;tLeft=300;
  lvData=buildLevel();
  resetRound();
  gst='playing';ov.classList.add('off');setHUD();
}
function resetRound(){
  camX=0;tAccum=0;dTimer=0;wTimer=0;tLeft=300;
  player=mkPlayer();
  enemies=mkEnemies(lvData.ens);
  coinList=lvData.cns.map(c=>({...c,col:false,fr:0,ft:0}));
  blkList=lvData.blks.map(b=>({...b,hit:false,bh:0}));
  parts=[];
}
function showEnd(title,msg,badge,btnTxt){
  gst='stop';ov.classList.remove('off');
  ovT.textContent=title;ovT.style.color='#ff4466';
  ovM.textContent=msg;ovB.textContent=badge;
  ovBtn.textContent=btnTxt;ovBtn.style.display='';
}

// ── UPDATE ──────────────────────────────────────────────────
function update(){
  if(gst!=='playing')return;

  if(++tAccum>=60){tAccum=0;tLeft=Math.max(0,tLeft-1);htEl.textContent=Math.ceil(tLeft);
    if(tLeft<=0&&!player.dead&&!player.goal)pDie();}

  const sl=getSolids(lvData);

  if(player.dead){
    updPlayer(player,[]);
    if(--dTimer<=0){
      if(lives<=0)showEnd('GAME OVER','Puntuación: '+score,'Récord: '+hiScore,'Intentar de nuevo');
      else resetRound();
    }
    return;
  }
  if(player.goal){
    if(--wTimer<=0)showEnd('¡NIVEL COMPLETADO!','Puntuación: '+score,'Monedas: '+coins+'  |  Récord: '+hiScore,'Jugar de nuevo');
    updPlayer(player,[]);return;
  }

  updPlayer(player,sl);

  // Camera
  const tc=player.x-CW*.38;
  camX+=(tc-camX)*.14;
  camX=Math.max(0,Math.min(LW-CW,camX));

  // Enemies
  enemies.forEach(e=>updEnemy(e,sl));

  // Player vs enemies
  for(const e of enemies){
    if(!e.alive||e.stomp||!hit(player,e))continue;
    const pb=player.y+player.h-player.vy;
    if(player.vy>0&&pb<=e.y+8){stompE(e);player.vy=-9;}
    else if(player.inv<=0){pDie();break;}
  }

  // Coins
  for(const c of coinList){
    if(c.col)continue;
    if(hit(player,c)){
      c.col=true;coins++;addScore(200);setHUD();
      parts.push(new TextPop(c.x+7,c.y,'+200','#ffdd00'));
    }
    if(++c.ft>=6){c.fr=(c.fr+1)%4;c.ft=0;}
  }

  // Blocks
  for(const b of blkList){
    if(b.hit){if(b.bh>0)b.bh--;continue;}
    if(player.x+player.w>b.x+2&&player.x<b.x+b.w-2&&
       player.y<=b.y+b.h&&player.y>=b.y+b.h-12&&player.vy<0){
      b.hit=true;b.bh=8;
      if(b.t==='q'){
        coins++;addScore(200);setHUD();
        parts.push(new Pop(b.x+14,b.y,-0,-6,'#ffdd00',30));
      } else {
        for(let i=0;i<4;i++)parts.push(new Pop(b.x+Math.random()*32,b.y,(Math.random()-.5)*5,-4-Math.random()*3,'#c05020',24));
      }
    }
  }

  // Flag
  if(hit(player,{x:lvData.flagX+14,y:60,w:6,h:GY-60}))pWin();

  // Particles
  parts=parts.filter(p=>p.tick());
}

// ── DRAW ────────────────────────────────────────────────────
function fr(x,y,w,h,c){ct.fillStyle=c;ct.fillRect(x,y,w,h);}

function drawBG(){
  const g=ct.createLinearGradient(0,0,0,CH);
  g.addColorStop(0,'#5badf0');g.addColorStop(1,'#87ceeb');
  ct.fillStyle=g;ct.fillRect(0,0,CW,CH);

  const hx=(camX*.28)%CW;
  [[80,GY,120],[310,GY,100],[520,GY,140]].forEach(([bx,by,bw])=>{
    ct.fillStyle='#4caf50';
    ct.beginPath();ct.arc(bx-hx,by,bw/2,Math.PI,0);ct.closePath();ct.fill();
    ct.fillStyle='#388e3c';
    ct.beginPath();ct.arc(bx-hx,by-bw*.25,bw*.25,Math.PI,0);ct.closePath();ct.fill();
    ct.fillStyle='#4caf50';
    ct.beginPath();ct.arc(bx-hx+CW,by,bw/2,Math.PI,0);ct.closePath();ct.fill();
    ct.fillStyle='#388e3c';
    ct.beginPath();ct.arc(bx-hx+CW,by-bw*.25,bw*.25,Math.PI,0);ct.closePath();ct.fill();
  });

  const cx=(camX*.14)%(CW*2);
  ct.fillStyle='rgba(255,255,255,.85)';
  [[60,78,80],[240,52,65],[440,86,90]].forEach(([bx,by,bw])=>{
    [[bx-cx,by,bw],[bx-cx+CW*2,by,bw]].forEach(([x,y,w])=>{
      ct.beginPath();ct.arc(x,y,w*.28,0,Math.PI*2);ct.arc(x+w*.25,y-w*.15,w*.34,0,Math.PI*2);ct.arc(x+w*.55,y,w*.26,0,Math.PI*2);ct.fill();
    });
  });

  const ox=Math.round(camX);
  const gx0=Math.floor(ox/32)*32-ox;
  for(let gx=gx0;gx<CW+32;gx+=32){
    fr(gx,GY,32,CH-GY,'#8B4513');fr(gx,GY,32,10,'#4caf50');fr(gx,GY+10,32,4,'#388e3c');
    ct.strokeStyle='#6d3510';ct.lineWidth=1;ct.strokeRect(gx+.5,GY+.5,31,CH-GY-1);
  }
}

function drawPlat(p,ox){
  const x=Math.round(p.x-ox);
  fr(x,p.y,p.w,16,'#8B4513');fr(x,p.y,p.w,6,'#a0522d');
  fr(x,p.y+6,p.w,4,'#4caf50');fr(x,p.y+10,p.w,2,'#388e3c');
  for(let tx=x;tx<x+p.w;tx+=32){ct.strokeStyle='#6d3510';ct.lineWidth=1;ct.strokeRect(tx+.5,p.y+.5,Math.min(32,x+p.w-tx)-1,14);}
}
function drawBlock(b,ox){
  const x=Math.round(b.x-ox);
  const y=b.bh>0?b.y-Math.sin(b.bh/8*Math.PI)*5:b.y;
  if(b.t==='q'){
    fr(x,y,32,32,b.hit?'#888':'#e8a020');fr(x+2,y+2,28,28,b.hit?'#aaa':'#f0c040');
    ct.strokeStyle='#5c3317';ct.lineWidth=2;ct.strokeRect(x+.5,y+.5,31,31);
    if(!b.hit){ct.fillStyle='#fff';ct.font='bold 17px monospace';ct.textAlign='center';ct.textBaseline='middle';ct.fillText('?',x+16,y+18);}
  }else{
    fr(x,y,32,32,'#c05020');fr(x+1,y+1,30,14,'#d86030');fr(x+1,y+17,30,14,'#d86030');
    fr(x+16,y+1,1,14,'#c05020');fr(x+1,y+16,30,1,'#c05020');
  }
}
function drawPipe(p,ox){
  const x=Math.round(p.x-ox);
  fr(x+4,p.y+16,p.w-8,p.h-16,'#1a7a1a');fr(x+6,p.y+18,p.w-12,p.h-20,'#2a9a2a');
  fr(x,p.y,p.w,18,'#1a7a1a');fr(x+2,p.y+2,p.w-4,14,'#2a9a2a');
}
function drawCoin(c,ox){
  const ws=[14,10,6,10],os=[0,2,4,2];
  fr(Math.round(c.x-ox)+os[c.fr],c.y,ws[c.fr],18,'#ffdd00');
  fr(Math.round(c.x-ox)+os[c.fr]+2,c.y+2,ws[c.fr]-4,3,'#ffee88');
}
function drawFlag(fx,ox){
  const x=Math.round(fx-ox);
  ct.strokeStyle='#999';ct.lineWidth=4;
  ct.beginPath();ct.moveTo(x+16,70);ct.lineTo(x+16,GY);ct.stroke();
  ct.fillStyle='#e63946';ct.beginPath();ct.moveTo(x+18,80);ct.lineTo(x+50,100);ct.lineTo(x+18,120);ct.closePath();ct.fill();
  fr(x+6,GY-12,22,14,'#777');
}
function drawGoomba(e,ox){
  const x=Math.round(e.x-ox),y=Math.round(e.y);
  if(e.stomp){fr(x+1,y+16,e.w-2,8,'#8B4513');return;}
  fr(x+2,y,e.w-4,10,'#8B4513');fr(x,y+6,e.w,8,'#a0522d');fr(x+2,y+10,e.w-4,6,'#f4a261');
  fr(x+3,y+11,5,5,'#fff');fr(x+e.w-8,y+11,5,5,'#fff');
  fr(x+4,y+12,3,3,'#111');fr(x+e.w-7,y+12,3,3,'#111');
  fr(x+3,y+10,5,2,'#5c3317');fr(x+e.w-8,y+10,5,2,'#5c3317');
  fr(x+5,y+17,e.w-10,2,'#5c3317');
  const fo=e.fr===0?2:-2;
  fr(x+fo,y+e.h-4,10,4,'#4a2810');fr(x+e.w-10-fo,y+e.h-4,10,4,'#4a2810');
}
function drawKoopa(e,ox){
  const x=Math.round(e.x-ox),y=Math.round(e.y);
  if(e.shell){
    fr(x+3,y+6,e.w-6,e.h-6,'#3a9a3a');fr(x+6,y+10,e.w-12,e.h-14,'#4ab04a');
    fr(x+e.w/2-1,y+6,2,e.h-6,'#2a6a2a');fr(x+3,y+e.h/2,e.w-6,2,'#2a6a2a');return;
  }
  ct.save();
  if(e.dir>0){ct.translate(x+e.w,0);ct.scale(-1,1);ct.translate(-e.w,0);}
  const bx=e.dir>0?-e.w+x:x;
  fr(bx+4,y+8,20,20,'#3a9a3a');fr(bx+14,y+2,14,12,'#a0c040');
  fr(bx+22,y+4,4,4,'#fff');fr(bx+23,y+5,2,2,'#111');
  const fo=e.fr===0?2:-2;
  fr(bx+fo,y+e.h-8,12,4,'#80a030');fr(bx+14-fo,y+e.h-8,12,4,'#80a030');
  ct.restore();
}
function drawPlayer(p,ox){
  if(!p)return;
  const sx=Math.round(p.x-ox),sy=Math.round(p.y);
  if(p.inv>0&&Math.floor(p.inv/4)%2===0)return;
  ct.save();
  ct.translate(sx+p.w/2,0);if(p.dir===-1)ct.scale(-1,1);ct.translate(-p.w/2,0);
  const x=0,y=sy;
  const lo=[0,3,0,-3][p.fr%4];
  // Cap
  fr(x+2,y,16,6,'#e63946');fr(x-1,y+4,22,5,'#e63946');
  // Face
  fr(x+2,y+9,16,10,'#f4a261');
  // Mustache/eyes
  fr(x+12,y+10,5,3,'#111');fr(x+2,y+14,8,3,'#111');fr(x+10,y+14,5,3,'#111');
  // Body
  fr(x+1,y+19,18,9,'#e63946');
  // Overalls
  fr(x-1,y+22,22,6,'#1d3557');fr(x+2,y+20,5,7,'#1d3557');fr(x+13,y+20,5,7,'#1d3557');
  // Legs
  fr(x+1,y+28,8,5,'#1d3557');fr(x+11,y+28,8,5,'#1d3557');
  // Shoes
  fr(x+0,y+33+lo,9,3,'#5c3317');fr(x+11,y+33-lo,9,3,'#5c3317');
  ct.restore();
}

function render(){
  if(!lvData){fr(0,0,CW,CH,'#0f0f1a');return;}
  const ox=Math.round(camX);
  drawBG();
  coinList.forEach(c=>{if(!c.col)drawCoin(c,ox);});
  lvData.plats.forEach(p=>{const sx=p.x-ox;if(sx>-p.w&&sx<CW+p.w)drawPlat(p,ox);});
  blkList.forEach(b=>{const sx=b.x-ox;if(sx<-32||sx>CW)return;drawBlock(b,ox);});
  lvData.pipes.forEach(p=>{const sx=p.x-ox;if(sx>-p.w&&sx<CW+p.w)drawPipe(p,ox);});
  drawFlag(lvData.flagX,ox);
  enemies.forEach(e=>{
    if(!e.alive)return;
    const sx=e.x-ox;if(sx<-60||sx>CW+60)return;
    e.t==='g'?drawGoomba(e,ox):drawKoopa(e,ox);
  });
  if(player&&(!player.dead||player.y<CH+40))drawPlayer(player,ox);
  parts.forEach(p=>p.draw(ox));
}

// ── LOOP ────────────────────────────────────────────────────
function loop(){
  update();render();
  for(const k in JP)delete JP[k];
  requestAnimationFrame(loop);
}

ovBtn.addEventListener('click',()=>{
  ovT.style.color='#ffdd00';
  initGame();
});
cv.addEventListener('click',()=>{
  if(gst==='paused'){togglePause();return;}
  if(gst!=='playing')initGame();
});

// Initial render
fr(0,0,CW,CH,'#0f0f1a');
loop();
</script>
