<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Super Arcade 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#000;font-family:monospace}
#hud{
  position:fixed;top:0;left:0;right:0;z-index:10;
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 20px;pointer-events:none;
  background:linear-gradient(to bottom,rgba(0,0,0,.6),transparent);
  color:#ffdd00;font:bold 15px monospace;
  text-shadow:0 0 10px #ff880066;
}
#overlay{
  position:fixed;inset:0;z-index:20;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(5,2,20,.85);gap:18px;
}
#overlay h1{
  font-size:clamp(1.6rem,5vw,2.8rem);color:#ffdd00;
  letter-spacing:5px;text-shadow:0 0 30px #ff8800,0 0 60px #ff440066;
}
.sub{color:#888;font-size:.9rem}
.ctrl{color:#444;font-size:.78rem;line-height:2;text-align:center}
#score-final{color:#ffdd00;font-size:1.1rem;display:none}
#start-btn{
  padding:13px 52px;font-size:1rem;font-weight:bold;
  letter-spacing:3px;text-transform:uppercase;
  background:linear-gradient(135deg,#e63946,#c1121f);
  color:#fff;border:none;border-radius:8px;cursor:pointer;
  box-shadow:0 0 24px rgba(230,57,70,.6);transition:transform .1s;
}
#start-btn:hover{transform:scale(1.06)}
#pause-ov{
  position:fixed;inset:0;z-index:15;
  display:none;flex-direction:column;
  align-items:center;justify-content:center;
  background:rgba(0,0,0,.55);gap:10px;
  color:#00cfff;font:bold 3rem monospace;letter-spacing:6px;
}
#pause-ov .ps{font-size:1rem;color:#555;letter-spacing:2px}
</style>
</head>
<body>
<div id="hud">
  <span>PUNTOS <span id="hs">000000</span></span>
  <span style="color:#e63946;letter-spacing:3px;font-size:12px">SUPER ARCADE 3D</span>
  <span>VIDAS <span id="hl">❤❤❤</span></span>
</div>
<div id="overlay">
  <h1>SUPER ARCADE 3D</h1>
  <div class="sub">Esquiva obstáculos · Recoge monedas · Sobrevive</div>
  <div id="score-final"></div>
  <button id="start-btn">JUGAR</button>
  <div class="ctrl">
    ← → cambiar carril &nbsp;|&nbsp; ↑ / Espacio saltar (¡doble salto!)<br>
    P pausa &nbsp;|&nbsp; Desliza en móvil
  </div>
</div>
<div id="pause-ov">
  <span>PAUSA</span>
  <span class="ps">P para continuar</span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';

// ── SCENE ──────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x080618, 0.007);

const camera = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.1, 300);
camera.position.set(0, 7, 13);
camera.lookAt(0, 1, -15);

const renderer = new THREE.WebGLRenderer({antialias: true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.setClearColor(0x080618);
document.body.prepend(renderer.domElement);

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── LIGHTS ─────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x8888cc, 0.65));
const sun = new THREE.DirectionalLight(0xffffff, 1.0);
sun.position.set(10, 25, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, {left:-28,right:28,top:28,bottom:-28,far:130});
scene.add(sun);
const runLight = new THREE.PointLight(0x4466ff, 1.5, 35);
scene.add(runLight);

// ── MATERIALS ──────────────────────────────────────────────
const M = {
  road0:    new THREE.MeshLambertMaterial({color: 0x101840}),
  road1:    new THREE.MeshLambertMaterial({color: 0x0c1230}),
  edge:     new THREE.MeshLambertMaterial({color: 0xe63946, emissive: 0x550011}),
  dash:     new THREE.MeshLambertMaterial({color: 0xffffff, emissive: 0x777777}),
  block:    new THREE.MeshLambertMaterial({color: 0xe63946, emissive: 0x220008}),
  blockTop: new THREE.MeshLambertMaterial({color: 0xff7722, emissive: 0x442200}),
  coin:     new THREE.MeshLambertMaterial({color: 0xffdd00, emissive: 0x885500}),
  skin:     new THREE.MeshLambertMaterial({color: 0xf4a261}),
  red:      new THREE.MeshLambertMaterial({color: 0xe63946}),
  blue:     new THREE.MeshLambertMaterial({color: 0x1d3557}),
  brown:    new THREE.MeshLambertMaterial({color: 0x5c3317}),
};

// ── TRACK ──────────────────────────────────────────────────
const SEG = 30, N_SEGS = 14, LANES = [-3, 0, 3];
const segs = [];

function mkSeg(idx) {
  const g = new THREE.Group();
  const road = new THREE.Mesh(new THREE.BoxGeometry(10, 0.5, SEG), M['road' + idx % 2]);
  road.receiveShadow = true;
  g.add(road);
  for (const ex of [-5.6, 5.6]) {
    const r = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.8, SEG), M.edge);
    r.position.set(ex, 0.15, 0);
    g.add(r);
  }
  for (const lx of [-1.5, 1.5]) {
    for (let dz = -SEG/2 + 2; dz < SEG/2; dz += 5) {
      const d = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.05, 2.5), M.dash);
      d.position.set(lx, 0.27, dz);
      g.add(d);
    }
  }
  g.position.z = -idx * SEG + 8;
  scene.add(g);
  return g;
}
for (let i = 0; i < N_SEGS; i++) segs.push(mkSeg(i));

// ── STARS ──────────────────────────────────────────────────
{
  const pts = [];
  for (let i = 0; i < 700; i++)
    pts.push((Math.random()-.5)*400, Math.random()*80+10, (Math.random()-.5)*400);
  const sg = new THREE.BufferGeometry();
  sg.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  scene.add(new THREE.Points(sg, new THREE.PointsMaterial({color:0xffffff, size:0.5})));
}

// ── MOUNTAINS ──────────────────────────────────────────────
for (let i = 0; i < 10; i++) {
  const h = 18 + Math.random() * 22;
  const m = new THREE.Mesh(
    new THREE.ConeGeometry(10 + Math.random()*10, h, 5),
    new THREE.MeshLambertMaterial({color: 0x150a30})
  );
  const a = i / 10 * Math.PI * 2;
  m.position.set(Math.cos(a)*90, h/2 - 5, Math.sin(a)*70 - 20);
  scene.add(m);
}

// ── PLAYER ─────────────────────────────────────────────────
const player = new THREE.Group();

function box(w, h, d, mat, x, y, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  player.add(m);
  return m;
}

// Cap
box(1.05, 0.35, 0.95, M.red,   0,    3.55, 0);
box(1.2,  0.12, 0.55, M.red,   0,    3.38, 0.4);
// Head
box(0.88, 0.88, 0.82, M.skin,  0,    3.1,  0);
// Eyes
box(0.18, 0.18, 0.1,  new THREE.MeshBasicMaterial({color:0x111111}), -0.22, 3.15, 0.41);
box(0.18, 0.18, 0.1,  new THREE.MeshBasicMaterial({color:0x111111}),  0.22, 3.15, 0.41);
// Body
const bodyM = box(1.0, 1.15, 0.7, M.red,  0, 2.1, 0);
// Overalls
box(1.05, 0.75, 0.72, M.blue,  0,    1.48, 0);
// Legs
const legL  = box(0.42, 0.88, 0.55, M.blue,  -0.27, 0.68, 0);
const legR  = box(0.42, 0.88, 0.55, M.blue,   0.27, 0.68, 0);
// Shoes
const shoeL = box(0.5,  0.3,  0.72, M.brown, -0.27, 0.20, 0.06);
const shoeR = box(0.5,  0.3,  0.72, M.brown,  0.27, 0.20, 0.06);

player.position.set(0, 0, 2);
scene.add(player);

// ── GAME STATE ─────────────────────────────────────────────
let gst = 'menu', score = 0, lives = 3, spd = 0.28;
let lane = 1, tgtX = 0, jY = 0, jV = 0, onGnd = true, jumps = 0;
let obstacles = [], coins = [], frameN = 0, spawnCD = 80;
let legPh = 0, camOffX = 0;
const GRAV = 0.017, JV = 0.30, MAXJ = 2;

// ── HUD ELEMENTS ───────────────────────────────────────────
const hsEl    = document.getElementById('hs');
const hlEl    = document.getElementById('hl');
const overlay = document.getElementById('overlay');
const pauseOv = document.getElementById('pause-ov');
const scoreFin = document.getElementById('score-final');
const startBtn = document.getElementById('start-btn');

function setHUD() {
  hsEl.textContent = String(Math.floor(score)).padStart(6, '0');
  hlEl.textContent = '❤'.repeat(Math.max(0, lives));
}

// ── INPUT ──────────────────────────────────────────────────
const K = {}, JP = {};
window.addEventListener('keydown', e => {
  if (!K[e.code]) JP[e.code] = true;
  K[e.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))
    e.preventDefault();
  if ((e.code==='KeyP'||e.code==='Escape') && gst==='playing') {
    gst='paused'; pauseOv.style.display='flex';
  } else if ((e.code==='KeyP'||e.code==='Escape') && gst==='paused') {
    gst='playing'; pauseOv.style.display='none';
  }
  if ((e.code==='Space'||e.code==='Enter') && (gst==='menu'||gst==='gameover'))
    startGame();
});
window.addEventListener('keyup', e => K[e.code] = false);

// Touch swipe
let tx0 = 0, ty0 = 0;
renderer.domElement.addEventListener('touchstart', e => {
  tx0 = e.touches[0].clientX; ty0 = e.touches[0].clientY;
  if (gst !== 'playing' && gst !== 'paused') startGame();
}, {passive:true});
renderer.domElement.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx0;
  const dy = e.changedTouches[0].clientY - ty0;
  if (Math.abs(dx) > Math.abs(dy)) {
    if (dx < -30 && lane > 0) { lane--; tgtX = LANES[lane]; }
    else if (dx > 30 && lane < 2) { lane++; tgtX = LANES[lane]; }
  } else if (dy < -30) doJump();
}, {passive:true});

function doJump() {
  if (jumps < MAXJ) { jV = JV; jumps++; onGnd = false; }
}

// ── SPAWNERS ───────────────────────────────────────────────
function mkObstacle() {
  const n = Math.random() < 0.22 && score > 400 ? 2 : 1;
  const sl = Math.floor(Math.random() * (3 - n + 1));
  for (let i = 0; i < n; i++) {
    const l = sl + i;
    const h = 0.9 + Math.random() * 0.9;
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(2.3, h, 2.3), M.block);
    mesh.castShadow = true;
    mesh.position.set(LANES[l], h/2, -78);
    const top = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.28, 2.5), M.blockTop);
    top.position.y = h/2 + 0.14;
    mesh.add(top);
    scene.add(mesh);
    obstacles.push({mesh, h, passed: false});
  }
}

function mkCoins() {
  const l = Math.floor(Math.random() * 3);
  const count = 2 + Math.floor(Math.random() * 3);
  for (let i = 0; i < count; i++) {
    const mesh = new THREE.Mesh(new THREE.TorusGeometry(0.38, 0.12, 8, 16), M.coin);
    mesh.rotation.x = Math.PI / 2;
    mesh.position.set(LANES[l], 2.2, -78 - i * 3);
    scene.add(mesh);
    coins.push({mesh});
  }
}

// ── GAME CONTROL ───────────────────────────────────────────
function clearAll() {
  obstacles.forEach(o => scene.remove(o.mesh));
  coins.forEach(c => scene.remove(c.mesh));
  obstacles = []; coins = [];
}

function startGame() {
  clearAll();
  score = 0; lives = 3; spd = 0.28;
  lane = 1; tgtX = 0; jY = 0; jV = 0; onGnd = true; jumps = 0;
  player.position.set(0, 0, 2);
  spawnCD = 80; frameN = 0; camOffX = 0;
  gst = 'playing';
  overlay.style.display = 'none';
  pauseOv.style.display = 'none';
  setHUD();
}

function hit() {
  lives--;
  setHUD();
  if (lives <= 0) {
    gst = 'gameover';
    scoreFin.textContent = 'Puntos: ' + String(Math.floor(score)).padStart(6, '0');
    scoreFin.style.display = 'block';
    startBtn.textContent = 'INTENTAR DE NUEVO';
    overlay.style.display = 'flex';
  } else {
    clearAll();
    spawnCD = 100;
    jY = 0; jV = 0; onGnd = true; jumps = 0;
    lane = 1; tgtX = 0;
  }
}

// ── UPDATE ─────────────────────────────────────────────────
function update() {
  if (gst !== 'playing') return;
  frameN++;

  spd = Math.min(0.72, 0.28 + score * 0.000036);
  score += spd * 0.55;
  if (frameN % 15 === 0) setHUD();

  // Input
  if (JP.ArrowLeft  || JP.KeyA) { if (lane > 0) { lane--; tgtX = LANES[lane]; } }
  if (JP.ArrowRight || JP.KeyD) { if (lane < 2) { lane++; tgtX = LANES[lane]; } }
  if (JP.ArrowUp || JP.KeyW || JP.Space || JP.KeyZ) doJump();

  // Lane lerp
  player.position.x += (tgtX - player.position.x) * 0.18;

  // Jump physics
  if (!onGnd) {
    jY += jV; jV -= GRAV;
    if (jY <= 0) { jY = 0; jV = 0; onGnd = true; jumps = 0; }
  }
  player.position.y = jY;

  // Leg animation
  if (onGnd) {
    legPh += spd * 0.32;
    const s = Math.sin(legPh) * 0.22;
    legL.position.y = 0.68 + s;  legR.position.y = 0.68 - s;
    shoeL.position.y = 0.20 + s; shoeR.position.y = 0.20 - s;
    bodyM.position.y = 2.1 + Math.sin(legPh * 2) * 0.035;
  } else {
    legL.position.y = legR.position.y = 0.88;
    shoeL.position.y = shoeR.position.y = 0.35;
  }

  // Track scroll + recycle
  segs.forEach(s => {
    s.position.z += spd;
    if (s.position.z > 15) s.position.z -= N_SEGS * SEG;
  });

  // Spawn
  if (--spawnCD <= 0) {
    if (Math.random() < 0.58) mkObstacle(); else mkCoins();
    if (Math.random() < 0.28) mkCoins();
    spawnCD = Math.max(25, 85 - score * 0.01) | 0;
  }

  // Update obstacles + collision
  const px = player.position.x;
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i];
    o.mesh.position.z += spd;
    o.mesh.rotation.y += 0.007;
    if (o.mesh.position.z > 14) { scene.remove(o.mesh); obstacles.splice(i, 1); continue; }
    if (!o.passed && o.mesh.position.z > 3) { o.passed = true; score += 50; }
    const dz = Math.abs(o.mesh.position.z - 2.2);
    const dx = Math.abs(o.mesh.position.x - px);
    if (dz < 1.9 && dx < 1.6 && jY < o.h) {
      scene.remove(o.mesh); obstacles.splice(i, 1); hit(); return;
    }
  }

  // Update coins + collection
  for (let i = coins.length - 1; i >= 0; i--) {
    const c = coins[i];
    c.mesh.position.z += spd;
    c.mesh.rotation.z += 0.06;
    if (c.mesh.position.z > 14) { scene.remove(c.mesh); coins.splice(i, 1); continue; }
    const dz = Math.abs(c.mesh.position.z - 2.2);
    const dx = Math.abs(c.mesh.position.x - px);
    const dy = Math.abs(c.mesh.position.y - jY - 1.5);
    if (dz < 1.8 && dx < 1.6 && dy < 2.0) {
      scene.remove(c.mesh); coins.splice(i, 1); score += 100; setHUD();
    }
  }

  // Camera x follows player gently
  camOffX += (px * 0.12 - camOffX) * 0.08;
  camera.position.x += (camOffX - camera.position.x) * 0.05;

  // Running light follows player
  runLight.position.set(px, 2, 2);
  runLight.intensity = 1.0 + Math.sin(frameN * 0.08) * 0.4;
}

// ── LOOP ───────────────────────────────────────────────────
function loop() {
  requestAnimationFrame(loop);

  // Idle camera drift in menu
  if (gst === 'menu' || gst === 'gameover') {
    const t = Date.now() * 0.0006;
    camera.position.x = Math.sin(t) * 2;
    camera.lookAt(0, 1, -15);
  }

  update();
  for (const k in JP) delete JP[k];
  renderer.render(scene, camera);
}

startBtn.addEventListener('click', startGame);
loop();
</script>
</body>
</html>
