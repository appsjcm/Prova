<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#79c0f0">
<title>Cosmo Kid 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0a1830;font-family:monospace;color:#fff;touch-action:none;overscroll-behavior:none}
#c{display:block;width:100%;height:100%}
/* HUD */
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:12px 16px;pointer-events:none;z-index:10;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.hud-l{font-size:1.1rem;font-weight:bold;letter-spacing:1px}
.hud-r{text-align:right;font-size:1.1rem;font-weight:bold}
#coins{color:#ffd23c}#lives{color:#ff6a8a}#timer{color:#bfe9ff;font-size:.95rem}
/* Overlay */
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(ellipse at 50% 35%,rgba(20,50,100,.55),rgba(5,12,28,.92));z-index:30;padding:24px;text-align:center;backdrop-filter:blur(2px)}
#ov.off{display:none}
#ov-t{font-size:3rem;font-weight:900;letter-spacing:4px;background:linear-gradient(135deg,#7fd5ff,#7cff9b,#ffe66b);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 0 40px rgba(120,210,255,.3);line-height:1}
#ov-s{font-size:.8rem;color:#9fc2e0;letter-spacing:3px;text-transform:uppercase}
#ov-m{font-size:.8rem;color:#bcd6ee;line-height:1.9;max-width:330px}
#ov-m b{color:#ffe66b}
#ov-btn{margin-top:6px;padding:16px 44px;font-size:1.25rem;font-weight:bold;letter-spacing:3px;text-transform:uppercase;background:linear-gradient(160deg,#22a7e6,#1466c4);color:#fff;border:2px solid rgba(140,225,255,.6);border-radius:16px;cursor:pointer;font-family:monospace;box-shadow:0 0 36px rgba(0,140,230,.5),0 6px 22px rgba(0,0,0,.5);transition:transform .1s}
#ov-btn:hover,#ov-btn:active{transform:scale(1.05)}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0a1830;z-index:40;font-size:1rem;color:#7fb6e0;letter-spacing:2px}
#mute{position:fixed;top:10px;right:12px;z-index:25;width:40px;height:40px;border-radius:10px;background:rgba(0,20,50,.55);border:1.5px solid rgba(120,200,255,.35);color:#cfeaff;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
#mute:hover,#mute:active{border-color:rgba(140,235,255,.85)}
/* Touch controls */
#tc{display:none;position:fixed;inset:0;z-index:20;pointer-events:none}
#joy{position:absolute;left:18px;bottom:24px;width:120px;height:120px;border-radius:50%;background:rgba(0,10,30,.4);border:2px solid rgba(255,255,255,.14);pointer-events:auto;touch-action:none}
#knob{position:absolute;top:50%;left:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:radial-gradient(circle at 36% 36%,rgba(80,190,255,.95),rgba(0,90,210,.85));border:2px solid rgba(120,225,255,.7);box-shadow:0 0 16px rgba(0,150,255,.5)}
.btn3d{position:absolute;border-radius:50%;background:rgba(0,30,80,.55);border:2px solid rgba(120,200,255,.45);color:#cfeaff;display:flex;align-items:center;justify-content:center;font-weight:bold;pointer-events:auto;touch-action:none;user-select:none;font-family:monospace}
.btn3d:active{background:rgba(0,120,230,.5);border-color:rgba(140,235,255,.95)}
#bJump{right:24px;bottom:40px;width:92px;height:92px;font-size:.95rem}
#bCam1{right:130px;bottom:96px;width:52px;height:52px;font-size:1.3rem}
#bCam2{right:130px;bottom:34px;width:52px;height:52px;font-size:1.3rem}
@media (max-width:520px){#ov-t{font-size:2.1rem}}
</style>

<body>
<canvas id="c"></canvas>
<button id="mute" title="Silenciar (M)">🔊</button>
<div id="loading">Cargando motor 3D…</div>
<div id="hud">
  <div class="hud-l"><span id="coins">★ 0</span><span style="color:#5a86ad"> / <span id="coinTot">0</span></span></div>
  <div class="hud-r"><div id="lives">♥♥♥</div><div id="timer">0s</div></div>
</div>
<div id="tc">
  <div id="joy"><div id="knob"></div></div>
  <div class="btn3d" id="bJump">SALTO</div>
  <div class="btn3d" id="bCam1">⟲</div>
  <div class="btn3d" id="bCam2">⟳</div>
</div>
<div id="ov">
  <div id="ov-t">COSMO KID 3D</div>
  <div id="ov-s">Aventura Espacial · WebGL</div>
  <div id="ov-m"></div>
  <button id="ov-btn">JUGAR</button>
</div>

<script>
// Offline fallback: if the 3D engine never boots (no internet for the CDN), tell the player.
window.__cosmo3dBoot = false;
setTimeout(function(){
  if (!window.__cosmo3dBoot){
    var l = document.getElementById('loading');
    if (l){ l.style.display='flex'; l.innerHTML='No se pudo cargar el motor 3D.<br>Necesita conexión a internet (Three.js vía CDN).'; }
  }
}, 7000);
</script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';

// ════════════════════════════════════════════════════════
//  COSMO KID 3D — real-time WebGL platformer (Three.js)
// ════════════════════════════════════════════════════════
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const SKY = new THREE.Color(0x86c5f0);
function makeSky(){
  const cv=document.createElement('canvas'); cv.width=16; cv.height=256;
  const x=cv.getContext('2d'); const g=x.createLinearGradient(0,0,0,256);
  g.addColorStop(0,'#cdeeff'); g.addColorStop(0.45,'#8ec8f2'); g.addColorStop(1,'#5fa3dd');
  x.fillStyle=g; x.fillRect(0,0,16,256);
  const tex=new THREE.CanvasTexture(cv); tex.colorSpace=THREE.SRGBColorSpace; return tex;
}
scene.background = makeSky();
scene.fog = new THREE.Fog(SKY, 50, 140);

const camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, 0.1, 400);

// ── Post-processing: bloom (optional, loaded dynamically) ──
let composer = null;
async function initBloom(){
  try{
    const [{ EffectComposer }, { RenderPass }, { UnrealBloomPass }, { OutputPass }] = await Promise.all([
      import('three/addons/postprocessing/EffectComposer.js'),
      import('three/addons/postprocessing/RenderPass.js'),
      import('three/addons/postprocessing/UnrealBloomPass.js'),
      import('three/addons/postprocessing/OutputPass.js'),
    ]);
    composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.55, 0.5, 0.82);
    composer.addPass(bloom);
    composer.addPass(new OutputPass());
    composer.setSize(innerWidth, innerHeight);
    composer.setPixelRatio(Math.min(devicePixelRatio, 2));
  }catch(e){ composer = null; /* fall back to direct render */ }
}

// ── Audio (self-contained WebAudio, no deps) ────────────
let AC=null, musicGain=null, sfxGain=null, musicMuted=false;
function initAudio(){
  try{
    if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)();
      musicGain=AC.createGain(); musicGain.gain.value=musicMuted?0:0.32; musicGain.connect(AC.destination);
      sfxGain=AC.createGain(); sfxGain.gain.value=0.9; sfxGain.connect(AC.destination);
    }
    if(AC.state==='suspended') AC.resume();
  }catch(e){}
}
function beep(freq, dur, type='square', vol=0.14, slideTo){
  if(!AC) return;
  const t=AC.currentTime, o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo), t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(sfxGain||AC.destination); o.start(t); o.stop(t+dur+0.02);
}
// Background music: procedural chiptune loop scheduled ahead of time
let musicOn=false, musicStep=0, musicNextT=0;
const M_BPM=124, M_STEP=60/M_BPM/2; // eighth notes
const M_MEL=[0,7,12,7, 9,7,4,0, 2,5,9,5, 7,4,0,-99]; // semitones from C4 (-99 = rest)
const M_BASS=[0,5,7,5];                                // roots from C3, one per beat (4 steps)
function mtone(freq, t, dur, vol, type){
  if(!AC) return;
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(musicGain||AC.destination); o.start(t); o.stop(t+dur+0.03);
}
function startMusic(){ if(!AC) return; musicOn=true; musicStep=0; musicNextT=AC.currentTime+0.1; }
function stopMusic(){ musicOn=false; }
function scheduleMusic(){
  if(!musicOn||!AC) return;
  while(musicNextT < AC.currentTime + 0.18){
    const i=musicStep%16;
    const mel=M_MEL[i];
    if(mel>-90) mtone(261.63*Math.pow(2,mel/12), musicNextT, M_STEP*0.9, 0.22, 'square');
    if(i%4===0){ const b=M_BASS[(i/4)|0]; mtone(130.81*Math.pow(2,b/12), musicNextT, M_STEP*1.8, 0.3, 'triangle'); }
    musicNextT += M_STEP; musicStep++;
  }
}
function toggleMute(){
  musicMuted=!musicMuted;
  if(musicGain) musicGain.gain.value = musicMuted?0:0.32;
  if(sfxGain) sfxGain.gain.value = musicMuted?0:0.9;
  const b=document.getElementById('mute'); if(b) b.textContent = musicMuted?'🔇':'🔊';
}
const sfx={
  jump:()=>beep(420,0.16,'square',0.12,760),
  djump:()=>beep(640,0.16,'square',0.12,1040),
  coin:()=>{ beep(900,0.07,'square',0.12); setTimeout(()=>beep(1350,0.1,'square',0.12),55); },
  stomp:()=>beep(220,0.18,'sawtooth',0.16,70),
  hurt:()=>beep(300,0.32,'sawtooth',0.18,80),
  bounce:()=>beep(520,0.2,'triangle',0.16,1100),
  win:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.2,'triangle',0.16),i*120))
};

// ── Lighting ────────────────────────────────────────────
const hemi = new THREE.HemisphereLight(0xbfe3ff, 0x4a6a3a, 0.85);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2d6, 1.55);
sun.position.set(28, 46, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1; sun.shadow.camera.far = 160;
const sc = 70; Object.assign(sun.shadow.camera, { left:-sc, right:sc, top:sc, bottom:-sc });
sun.shadow.camera.updateProjectionMatrix();
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.02;
sun.shadow.radius = 4; // softer PCF shadow edges
scene.add(sun);
scene.add(sun.target);
// Cool back/fill light for stylized rim shading
const fill = new THREE.DirectionalLight(0x9ec4ff, 0.45);
fill.position.set(-24, 16, -28);
scene.add(fill);

// ── Materials ───────────────────────────────────────────
const mat = (c, r=0.85, m=0.0, e=0x000000, ei=0) =>
  new THREE.MeshStandardMaterial({ color:c, roughness:r, metalness:m, emissive:e, emissiveIntensity:ei });

// ── World / level data ──────────────────────────────────
// Platforms are axis-aligned boxes: {x,y,z,w,h,d,color}
const colliders = []; // {min:Vec3, max:Vec3, mover?, base?, axis?, amp?, spd?}
const movers = [];
function addBox(x, y, z, w, h, d, color, opt={}) {
  const g = new THREE.BoxGeometry(w, h, d);
  const mesh = new THREE.Mesh(g, mat(color, opt.rough ?? 0.9));
  mesh.position.set(x, y, z);
  mesh.castShadow = true; mesh.receiveShadow = true;
  scene.add(mesh);
  const col = { mesh, hw:w/2, hh:h/2, hd:d/2,
                min:new THREE.Vector3(), max:new THREE.Vector3() };
  const refresh = () => {
    col.min.set(mesh.position.x-w/2, mesh.position.y-h/2, mesh.position.z-d/2);
    col.max.set(mesh.position.x+w/2, mesh.position.y+h/2, mesh.position.z+d/2);
  };
  col.refresh = refresh; refresh();
  col.bounce = !!opt.bounce;
  colliders.push(col);
  if (opt.move) {
    col.base = mesh.position.clone();
    col.axis = opt.move.axis; col.amp = opt.move.amp; col.spd = opt.move.spd; col.phase = opt.move.phase||0;
    movers.push(col);
  }
  // decorative bright top cap for a "3D World" tile look
  if (opt.cap !== false) {
    const cg = new THREE.BoxGeometry(w*1.001, 0.18, d*1.001);
    const cap = new THREE.Mesh(cg, mat(opt.capColor ?? lighten(color,0.18), 0.7));
    cap.position.set(0, h/2+0.001, 0); cap.receiveShadow = true;
    mesh.add(cap);
  }
  return col;
}
function lighten(hex, f){ const c=new THREE.Color(hex); c.lerp(new THREE.Color(0xffffff), f); return c.getHex(); }

// Coins
const coins = [];
function addCoin(x, y, z) {
  const g = new THREE.TorusGeometry(0.42, 0.16, 12, 22);
  const m = new THREE.Mesh(g, mat(0xffcc22, 0.28, 0.6, 0xffb200, 0.9));
  m.position.set(x, y, z); m.castShadow = true;
  m.rotation.x = Math.PI/2;
  scene.add(m);
  coins.push({ mesh:m, got:false, y });
}
// Power-up star (temporary invincibility + speed)
const powerups = [];
function addStar(x, y, z) {
  const m = new THREE.Mesh(new THREE.IcosahedronGeometry(0.55, 0), mat(0xffe23c, 0.25, 0.3, 0xffcc00, 0.9));
  m.position.set(x, y, z); m.castShadow = true;
  scene.add(m);
  powerups.push({ mesh:m, got:false, y });
}
// Enemies
const enemies = [];
function addEnemy(x, y, z, range, axis='x') {
  const grp = new THREE.Group();
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.7, 20, 16), mat(0xd13b22, 0.6));
  body.castShadow = true; body.position.y = 0.7; grp.add(body);
  const eyeMat = mat(0xffffff, 0.3);
  for (const sx of [-0.26, 0.26]) {
    const e = new THREE.Mesh(new THREE.SphereGeometry(0.17, 10, 8), eyeMat);
    e.position.set(sx, 0.95, 0.55); grp.add(e);
    const p = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 6), mat(0x110000, 0.4));
    p.position.set(sx, 0.95, 0.68); grp.add(p);
  }
  grp.position.set(x, y, z); scene.add(grp);
  enemies.push({ grp, alive:true, base:new THREE.Vector3(x,y,z), range, axis, dir:1, t:Math.random()*6 });
}
// Flying enemy (UFO drone) — circles in XZ and bobs in Y
function addFlyer(x, y, z, radius=3) {
  const grp = new THREE.Group();
  const saucer = new THREE.Mesh(new THREE.SphereGeometry(0.8, 18, 12), mat(0x8a3bd1, 0.5, 0.2));
  saucer.scale.y = 0.4; saucer.position.y = 0.8; saucer.castShadow = true; grp.add(saucer);
  const dome = new THREE.Mesh(new THREE.SphereGeometry(0.42, 16, 10, 0, Math.PI*2, 0, Math.PI/2), mat(0xcaa0ff, 0.25, 0.4, 0x6622aa, 0.4));
  dome.position.y = 0.95; grp.add(dome);
  for (let i=0;i<4;i++){ const a=i/4*Math.PI*2; const light=new THREE.Mesh(new THREE.SphereGeometry(0.1,8,6), mat(0xffee44,0.3,0,0xffcc00,1.0)); light.position.set(Math.cos(a)*0.7,0.78,Math.sin(a)*0.7); grp.add(light); }
  grp.position.set(x, y, z); scene.add(grp);
  enemies.push({ grp, alive:true, base:new THREE.Vector3(x,y,z), range:radius, axis:'fly', fly:true, t:Math.random()*6 });
}
// Goal
let goal;
function makeLabel(text, color){
  const cv=document.createElement('canvas'); cv.width=256; cv.height=64;
  const x=cv.getContext('2d'); x.clearRect(0,0,256,64);
  x.font='bold 40px monospace'; x.textAlign='center'; x.textBaseline='middle';
  x.shadowColor=color; x.shadowBlur=14; x.fillStyle=color;
  x.fillText(text,128,34);
  const tex=new THREE.CanvasTexture(cv); tex.colorSpace=THREE.SRGBColorSpace; return tex;
}
function setGoalLabel(text, color){
  if(!goal||!goal.sprite) return;
  const t=makeLabel(text,color); if(goal.sprite.material.map) goal.sprite.material.map.dispose();
  goal.sprite.material.map=t; goal.sprite.material.needsUpdate=true;
}
function refreshGoalLock(){
  if(!goal) return;
  const locked = player.coins < coinTotal;
  const col = locked ? 0xff5a3c : 0x00ff9a;
  goal.ring.material.color.setHex(col); goal.ring.material.emissive.setHex(col);
  goal.beam.material.color.setHex(col); goal.beam.material.emissive.setHex(col);
  setGoalLabel(locked ? '★ '+(coinTotal-player.coins) : 'META', locked ? '#ff8a5c' : '#00ff9a');
  goal.locked = locked;
}
function addGoal(x, y, z) {
  const grp = new THREE.Group();
  const ring = new THREE.Mesh(new THREE.TorusGeometry(1.4, 0.16, 16, 40), mat(0x00ff9a, 0.3, 0.2, 0x00ff88, 0.7));
  ring.position.y = 2.2; grp.add(ring);
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,4.4,10), mat(0xddddee,0.5));
  pole.position.y = 2.2; pole.castShadow = true; grp.add(pole);
  const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,40,8), mat(0x00ff9a,0.3,0,0x00ff9a,1.2));
  beam.position.y = 22; grp.add(beam);
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map:makeLabel('META','#00ff9a'), transparent:true, depthTest:false }));
  spr.scale.set(3, 0.75, 1); spr.position.y = 4.4; grp.add(spr);
  grp.position.set(x,y,z); scene.add(grp);
  goal = { grp, ring, beam, sprite:spr, locked:false, x, y, z };
}

// Clouds (decorative, drifting)
const clouds = [];
function addClouds() {
  const cmat = new THREE.MeshStandardMaterial({ color:0xffffff, roughness:1, transparent:true, opacity:0.92 });
  for (let i=0;i<16;i++){
    const grp = new THREE.Group();
    const n = 2 + (Math.random()*3|0);
    for (let j=0;j<n;j++){
      const s = new THREE.Mesh(new THREE.SphereGeometry(1+Math.random()*1.5, 8, 6), cmat);
      s.position.set((Math.random()-0.5)*3, (Math.random()-0.5)*0.6, (Math.random()-0.5)*2);
      s.scale.y = 0.6; grp.add(s);
    }
    grp.position.set((Math.random()-0.5)*180, 20+Math.random()*26, -10-Math.random()*150);
    grp.scale.setScalar(1.5+Math.random()*1.8);
    grp.userData.spd = 0.4+Math.random()*0.6;
    scene.add(grp); clouds.push(grp);
  }
}
// Subtle ground grid (depth reference) on the base island
function addGroundGrid(){
  const cv=document.createElement('canvas'); cv.width=cv.height=128;
  const x=cv.getContext('2d'); x.clearRect(0,0,128,128);
  x.strokeStyle='rgba(255,255,255,0.5)'; x.lineWidth=3;
  x.strokeRect(0,0,128,128);
  const t=new THREE.CanvasTexture(cv); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(10,10); t.colorSpace=THREE.SRGBColorSpace;
  const grid=new THREE.Mesh(new THREE.PlaneGeometry(40,40), new THREE.MeshBasicMaterial({ map:t, transparent:true, opacity:0.12, depthWrite:false }));
  grid.rotation.x=-Math.PI/2; grid.position.set(0,0.06,0); scene.add(grid);
}
// Decorative grass tufts and flowers (no collision)
function addTuft(x,z){
  const grp=new THREE.Group();
  for(let i=0;i<3;i++){ const b=new THREE.Mesh(new THREE.ConeGeometry(0.06,0.5,5), mat(0x4fb84f,0.9)); b.position.set((Math.random()-0.5)*0.32,0.25,(Math.random()-0.5)*0.32); b.rotation.z=(Math.random()-0.5)*0.5; b.castShadow=true; grp.add(b); }
  grp.position.set(x,0,z); scene.add(grp);
}
function addFlower(x,z,col){
  const stem=new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,0.4,5), mat(0x3a8a3a,0.9)); stem.position.set(x,0.2,z); scene.add(stem);
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.13,10,8), mat(col,0.5,0,col,0.35)); head.position.set(x,0.44,z); head.castShadow=true; scene.add(head);
}
function addDecor(){
  addGroundGrid();
  const flowerCols=[0xff6a8a,0xffd23c,0x8a6aff,0xffffff];
  for(let i=0;i<16;i++){ const a=Math.random()*Math.PI*2, r=4+Math.random()*14; const x=Math.cos(a)*r, z=Math.sin(a)*r; if(Math.abs(x)<2&&z>2&&z<8) continue; addTuft(x,z); }

if (isTouch) {
  document.getElementById('tc').style.display='block';
  const joy=document.getElementById('joy'), knob=document.getElementById('knob');
  let jid=null, cx=0, cy=0; const R=52;
  const set=(tx,ty)=>{ let dx=tx-cx, dy=ty-cy; const d=Math.hypot(dx,dy); if(d>R){dx=dx/d*R; dy=dy/d*R;} knob.style.transform=`translate(${dx}px,${dy}px)`; joyX=dx/R; joyY=dy/R; };
  joy.addEventListener('touchstart', e=>{ e.preventDefault(); const t=e.changedTouches[0]; jid=t.identifier; const r=joy.getBoundingClientRect(); cx=r.left+r.width/2; cy=r.top+r.height/2; joyActive=true; set(t.clientX,t.clientY); }, {passive:false});
  addEventListener('touchmove', e=>{ if(jid===null) return; for(const t of e.changedTouches) if(t.identifier===jid){ set(t.clientX,t.clientY); } }, {passive:false});
  addEventListener('touchend', e=>{ for(const t of e.changedTouches) if(t.identifier===jid){ jid=null; joyActive=false; joyX=joyY=0; knob.style.transform=''; } });
  const bind=(id,on,off)=>{ const el=document.getElementById(id); el.addEventListener('touchstart',e=>{e.preventDefault();on();},{passive:false}); el.addEventListener('touchend',e=>{e.preventDefault();off&&off();},{passive:false}); };
  bind('bJump', ()=>{ jumpQueued=true; keys['Space']=true; }, ()=>{ keys['Space']=false; });
  bind('bCam1', ()=>camRotInput=-1, ()=>camRotInput=0);
  bind('bCam2', ()=>camRotInput=1, ()=>camRotInput=0);
}

// ── Collision helpers ───────────────────────────────────
function overlaps(px, py, pz) {
  const r = [];
  for (const c of colliders) {
    if (px+player.hx > c.min.x && px-player.hx < c.max.x &&
        py+player.hy > c.min.y && py-player.hy < c.max.y &&
        pz+player.hz > c.min.z && pz-player.hz < c.max.z) r.push(c);
  }
  return r;
}

// ── Main loop ───────────────────────────────────────────
const clock = new THREE.Clock();
const GRAV=30, JUMP=11.5, WALK=6.5, RUN=11;
function tick(){
  requestAnimationFrame(tick);
  let dt = clock.getDelta(); if (dt>1/30) dt=1/30;
  const t = performance.now()*0.001;
  scheduleMusic();

  // Animate world (coins, goal, movers) regardless of state
  for (const c of coins){ if(!c.got){ c.mesh.rotation.z += dt*2.2; c.mesh.position.y = c.y + Math.sin(t*2+c.mesh.position.x)*0.16; } }
  for (const s of powerups){ if(!s.got){ s.mesh.rotation.y += dt*2.0; s.mesh.rotation.x += dt*1.1; s.mesh.position.y = s.y + Math.sin(t*2.5)*0.2; } }
  if (goal){ goal.ring.rotation.z += dt*1.5; goal.grp.rotation.y += dt*0.6; }
  for (const cl of clouds){ cl.position.x += dt*cl.userData.spd; if (cl.position.x > 100) cl.position.x = -100; }
  for (const m of movers){
    const off = Math.sin(t*m.spd + m.phase) * m.amp;
    const prev = m.mesh.position.clone();
    if (m.axis==='x') m.mesh.position.x = m.base.x + off;
    else if (m.axis==='z') m.mesh.position.z = m.base.z + off;
    else m.mesh.position.y = m.base.y + off;
    m.delta = m.mesh.position.clone().sub(prev);
    m.refresh();
  }

  if (state==='play') updatePlay(dt, t);

  // Effects
  for (let i=pops.length-1;i>=0;i--){ const p=pops[i]; p.userData.life-=dt; p.userData.v.y-=GRAV*dt; p.position.addScaledVector(p.userData.v, dt); p.scale.multiplyScalar(1-dt*1.5); if(p.userData.life<=0){ scene.remove(p); pops.splice(i,1);} }

  if (composer) composer.render(); else renderer.render(scene, camera);
}

function updatePlay(dt, t){
  elapsed = (performance.now()-startTime)/1000;

  // Camera yaw from input
  if (keys['KeyQ']) camYaw += dt*2.2;
  if (keys['KeyE']) camYaw -= dt*2.2;
  camYaw += camRotInput * dt*2.2;

  // Movement input relative to camera
  let ix=0, iz=0;
  if (keys['KeyW']||keys['ArrowUp']) iz-=1;
  if (keys['KeyS']||keys['ArrowDown']) iz+=1;
  if (keys['KeyA']||keys['ArrowLeft']) ix-=1;
  if (keys['KeyD']||keys['ArrowRight']) ix+=1;
  if (joyActive){ ix+=joyX; iz+=joyY; }

  const fwdX=-Math.sin(camYaw), fwdZ=-Math.cos(camYaw);
  const rightX=-fwdZ, rightZ=fwdX;
  let mx = fwdX*(-iz) + rightX*ix;
  let mz = fwdZ*(-iz) + rightZ*ix;
  const ml = Math.hypot(mx,mz);
  const running = keys['ShiftLeft']||keys['ShiftRight'];
  const speed = (running ? RUN : WALK) * (player.power>0 ? 1.3 : 1);
  if (ml>0.01){ mx/=ml; mz/=ml; const s=Math.min(1,ml)*speed;
    player.vel.x = mx*s; player.vel.z = mz*s;
    player.facing = Math.atan2(mx, mz);
  } else { player.vel.x*=0.6; player.vel.z*=0.6; }

  // Jump (with mid-air double jump)
  if (jumpQueued){
    if (player.grounded){ player.vel.y = JUMP; player.grounded=false; player.jumps=1; sfx.jump(); }
    else if (player.jumps>0){ player.vel.y = JUMP*0.92; player.jumps--; sfx.djump();
      pop(new THREE.Vector3(player.pos.x, player.pos.y-0.6, player.pos.z), 0x9fd8ff, 8); }
  }
  if (!keys['Space'] && player.vel.y>4) player.vel.y = 4; // variable jump height
  jumpQueued=false;

  // Gravity
  player.vel.y -= GRAV*dt;
  if (player.vel.y < -40) player.vel.y = -40;
  if (player.inv>0) player.inv-=dt;
  if (player.power>0) player.power-=dt;

  // Carry on moving platforms (if standing on one)
  // Integrate with axis-separated collision
  const P = player.pos;
  let standingMover = null;
  const wasGrounded = player.grounded, impactVy = player.vel.y;

  // --- Y axis ---
  P.y += player.vel.y*dt;
  player.grounded=false;
  for (const c of overlaps(P.x, P.y, P.z)){
    if (player.vel.y<=0){
      P.y = c.max.y + player.hy;
      if (c.bounce){ player.vel.y = 19; player.grounded=false; player.jumps=2; sfx.bounce(); pop(new THREE.Vector3(P.x,c.max.y+0.2,P.z), 0x6effb0, 12); }
      else { player.vel.y=0; player.grounded=true; player.jumps=2; if(c.delta) standingMover=c; }
    }
    else { P.y = c.min.y - player.hy; player.vel.y=0; }
  }
  // --- X axis ---
  P.x += player.vel.x*dt + (standingMover&&standingMover.delta?standingMover.delta.x:0);
  for (const c of overlaps(P.x, P.y, P.z)){
    if (player.vel.x>0) P.x = c.min.x - player.hx; else if (player.vel.x<0) P.x = c.max.x + player.hx;
    player.vel.x=0;
  }
  // --- Z axis ---
  P.z += player.vel.z*dt + (standingMover&&standingMover.delta?standingMover.delta.z:0);
  for (const c of overlaps(P.x, P.y, P.z)){
    if (player.vel.z>0) P.z = c.min.z - player.hz; else if (player.vel.z<0) P.z = c.max.z + player.hz;
    player.vel.z=0;
  }

  // Landing dust puff
  if (player.grounded && !wasGrounded && impactVy < -7){
    for (let i=0;i<9;i++){
      const m=new THREE.Mesh(new THREE.SphereGeometry(0.1,5,4), mat(0xe6eef6,0.95));
      m.position.set(P.x+(Math.random()-0.5)*0.7, P.y-player.hy+0.1, P.z+(Math.random()-0.5)*0.7);
      const a=Math.random()*Math.PI*2, sp=1.6+Math.random()*1.8;
      m.userData.v=new THREE.Vector3(Math.cos(a)*sp, 0.6+Math.random()*1.2, Math.sin(a)*sp);
      m.userData.life=0.34+Math.random()*0.18; scene.add(m); pops.push(m);
    }
  }

  // Fell off the world
  if (P.y < -12){ loseLife(); }

  // Update player visual
  playerGrp.position.copy(P);
  playerGrp.position.y -= player.hy; // group origin at feet
  // smooth turn toward facing
  let df = player.facing - playerGrp.rotation.y;
  while (df> Math.PI) df-=Math.PI*2; while (df<-Math.PI) df+=Math.PI*2;
  playerGrp.rotation.y += df*Math.min(1,dt*12);
  // blink when invulnerable
  playerGrp.visible = !(player.inv>0 && (Math.floor(t*12)%2===0));
  // invincibility aura (rainbow pulse while powered)
  const aura = playerGrp.getObjectByName('aura');
  if (aura){
    if (player.power>0){
      aura.visible = true;
      const hue = (t*0.6)%1; aura.material.color.setHSL(hue,1,0.6); aura.material.emissive.setHSL(hue,1,0.5);
      const sc = 1 + Math.sin(t*10)*0.06; aura.scale.setScalar(sc);
      aura.material.opacity = player.power<1.5 ? 0.25*(0.4+0.6*Math.abs(Math.sin(t*14))) : 0.25; // flicker out near end
    } else aura.visible = false;
  }
  // simple run bob + leg swing
  const moving = Math.hypot(player.vel.x,player.vel.z)>0.5;
  player.anim += dt*(moving?12:4);
  const swing = moving ? Math.sin(player.anim)*0.5 : 0;
  const lL=playerGrp.getObjectByName('legL'), lR=playerGrp.getObjectByName('legR');
  const aL=playerGrp.getObjectByName('armL'), aR=playerGrp.getObjectByName('armR');
  if(lL){ lL.rotation.x=swing; lR.rotation.x=-swing; aL.rotation.x=-swing*0.7; aR.rotation.x=swing*0.7; }
  if(!player.grounded){ if(lL){lL.rotation.x=-0.5;lR.rotation.x=0.4;} }

  // Coins
  for (const c of coins){ if(c.got) continue; if (P.distanceToSquared(c.mesh.position) < 1.7){ c.got=true; c.mesh.visible=false; player.coins++; updHUD(); refreshGoalLock(); sfx.coin(); pop(c.mesh.position, 0xffd23c, 12);} }

  // Power-up stars
  for (const s of powerups){ if(s.got) continue; if (P.distanceToSquared(s.mesh.position) < 2.0){ s.got=true; s.mesh.visible=false; player.power=8; updHUD(); sfx.win(); pop(s.mesh.position, 0xffe23c, 22); } }

  // Enemies
  for (const e of enemies){
    if(!e.alive) continue;
    e.t += dt;
    if (e.fly){
      e.grp.position.x = e.base.x + Math.cos(e.t*1.1)*e.range;
      e.grp.position.z = e.base.z + Math.sin(e.t*1.1)*e.range;
      e.grp.position.y = e.base.y + Math.sin(e.t*2)*0.4;
      e.grp.rotation.y += dt*3;
    } else {
      const off = Math.sin(e.t*1.4)*e.range;
      if (e.axis==='x') e.grp.position.x = e.base.x + off; else e.grp.position.z = e.base.z + off;
      e.grp.position.y = e.base.y + Math.abs(Math.sin(e.t*4))*0.12;
      e.grp.rotation.y += dt*1.5;
    }
    const d2 = P.distanceToSquared(e.grp.position);
    if (d2 < 1.6){
      const stomp = player.vel.y < -0.5 && P.y - e.grp.position.y > 0.9;
      if (player.power>0){ e.alive=false; scene.remove(e.grp); player.vel.y = Math.max(player.vel.y, JUMP*0.5); sfx.stomp(); pop(e.grp.position, 0xffe23c, 16); }
      else if (stomp){ e.alive=false; scene.remove(e.grp); player.vel.y = JUMP*0.7; player.jumps=1; sfx.stomp(); pop(e.grp.position, 0xff5533, 14); }
      else if (player.inv<=0){ loseLife(); pop(P.clone(), 0xff3344, 8); }
    }
  }

  // Goal reached (only when all stars are collected → ring is green)
  if (goal && !goal.locked && P.distanceToSquared(new THREE.Vector3(goal.x, P.y, goal.z)) < 4 && Math.abs(P.y-goal.y)<3){
    pop(new THREE.Vector3(goal.x,goal.y+2,goal.z), 0x00ff9a, 26); endGame(true);
  }

  // Camera follow (with gentle look-ahead toward movement)
  const desired = new THREE.Vector3(
    P.x + Math.sin(camYaw)*camDist,
    P.y + camHeight,
    P.z + Math.cos(camYaw)*camDist
  );
  camPos.lerp(desired, 1 - Math.pow(0.0015, dt));
  if (camPos.lengthSq()===0) camPos.copy(desired);
  camera.position.copy(camPos);
  camLook.lerp(new THREE.Vector3(P.x + player.vel.x*0.18, P.y+1.0, P.z + player.vel.z*0.18), 1 - Math.pow(0.002, dt));
  camera.lookAt(camLook);

  // keep sun shadow centered on player
  sun.position.set(P.x+28, P.y+46, P.z+20);
  sun.target.position.copy(P);
}

// ── Resize ──────────────────────────────────────────────
function resize(){
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  if (composer) composer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', resize);

// ── Boot ────────────────────────────────────────────────
buildLevel();
buildPlayer();
resize();
camPos.set(0, 7, 18);
initBloom();
window.__cosmo3dBoot = true;
document.getElementById('loading').style.display='none';
showMenu();
tick();
</script>
