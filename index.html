<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0f0f1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #00ff88, #00ccff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    #scoreboard {
      display: flex;
      gap: 40px;
      margin-bottom: 16px;
    }

    .score-box {
      text-align: center;
    }

    .score-label {
      font-size: 0.75rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .score-value {
      font-size: 1.8rem;
      font-weight: bold;
      color: #00ff88;
    }

    #game-wrapper {
      position: relative;
    }

    canvas {
      display: block;
      border: 2px solid #1a1a2e;
      border-radius: 8px;
      box-shadow: 0 0 40px rgba(0, 255, 136, 0.15), 0 0 80px rgba(0, 204, 255, 0.08);
    }

    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 15, 26, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      gap: 16px;
    }

    #overlay h2 {
      font-size: 2rem;
      color: #ff4466;
    }

    #overlay p {
      color: #aaa;
      font-size: 0.95rem;
    }

    #overlay.hidden { display: none; }

    #start-btn {
      margin-top: 8px;
      padding: 12px 36px;
      font-size: 1rem;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #00ff88, #00ccff);
      color: #0f0f1a;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    #start-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
    }

    #controls {
      margin-top: 14px;
      color: #555;
      font-size: 0.8rem;
      text-align: center;
      line-height: 1.8;
    }

    .key {
      display: inline-block;
      background: #1a1a2e;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 1px 7px;
      color: #aaa;
      font-size: 0.75rem;
    }

    #level-badge {
      font-size: 0.8rem;
      color: #00ccff;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <h1>Snake</h1>

  <div id="scoreboard">
    <div class="score-box">
      <div class="score-label">Puntos</div>
      <div class="score-value" id="score">0</div>
    </div>
    <div class="score-box">
      <div class="score-label">Récord</div>
      <div class="score-value" id="high-score">0</div>
    </div>
    <div class="score-box">
      <div class="score-label">Nivel</div>
      <div class="score-value" id="level">1</div>
    </div>
  </div>

  <div id="game-wrapper">
    <canvas id="canvas" width="400" height="400"></canvas>

    <div id="overlay">
      <h2 id="overlay-title">SNAKE</h2>
      <p id="overlay-msg">Usa las flechas o WASD para mover la serpiente</p>
      <div id="level-badge" id="final-score"></div>
      <button id="start-btn">Jugar</button>
    </div>
  </div>

  <div id="controls">
    <span class="key">↑</span> <span class="key">↓</span> <span class="key">←</span> <span class="key">→</span>
    &nbsp;o&nbsp;
    <span class="key">W</span> <span class="key">A</span> <span class="key">S</span> <span class="key">D</span>
    &nbsp;&nbsp;·&nbsp;&nbsp;
    <span class="key">P</span> pausa
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayMsg = document.getElementById('overlay-msg');
    const levelBadge = document.getElementById('level-badge');
    const startBtn = document.getElementById('start-btn');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('high-score');
    const levelEl = document.getElementById('level');

    const GRID = 20;
    const COLS = canvas.width / GRID;
    const ROWS = canvas.height / GRID;

    let snake, dir, nextDir, food, bonus, score, highScore, level, speed, gameLoop, paused, running;

    highScore = parseInt(localStorage.getItem('snakeHigh') || '0');
    highScoreEl.textContent = highScore;

    function init() {
      snake = [
        { x: 10, y: 10 },
        { x: 9,  y: 10 },
        { x: 8,  y: 10 },
      ];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      level = 1;
      speed = 150;
      paused = false;
      running = true;
      bonus = null;
      bonusTimer = 0;

      scoreEl.textContent = '0';
      levelEl.textContent = '1';

      placeFood();
      overlay.classList.add('hidden');
      clearInterval(gameLoop);
      gameLoop = setInterval(tick, speed);
    }

    function placeFood() {
      do {
        food = {
          x: Math.floor(Math.random() * COLS),
          y: Math.floor(Math.random() * ROWS),
        };
      } while (snake.some(s => s.x === food.x && s.y === food.y));
    }

    let bonusTimer = 0;
    const BONUS_DURATION = 8000;

    function maybeSpawnBonus() {
      if (!bonus && Math.random() < 0.15) {
        do {
          bonus = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
        } while (snake.some(s => s.x === bonus.x && s.y === bonus.y) || (bonus.x === food.x && bonus.y === food.y));
        bonusTimer = Date.now() + BONUS_DURATION;
      }
    }

    function tick() {
      if (paused || !running) return;

      dir = { ...nextDir };

      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // Wall collision
      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
        return endGame();
      }

      // Self collision
      if (snake.some(s => s.x === head.x && s.y === head.y)) {
        return endGame();
      }

      snake.unshift(head);

      let grew = false;

      if (head.x === food.x && head.y === food.y) {
        grew = true;
        score += 10 * level;
        scoreEl.textContent = score;
        placeFood();
        maybeSpawnBonus();

        if (score >= level * 80) {
          level++;
          levelEl.textContent = level;
          speed = Math.max(60, 150 - (level - 1) * 12);
          clearInterval(gameLoop);
          gameLoop = setInterval(tick, speed);
        }
      }

      if (bonus && head.x === bonus.x && head.y === bonus.y) {
        grew = true;
        score += 50 * level;
        scoreEl.textContent = score;
        bonus = null;
      }

      if (bonus && Date.now() > bonusTimer) {
        bonus = null;
      }

      if (!grew) snake.pop();

      if (score > highScore) {
        highScore = score;
        highScoreEl.textContent = highScore;
        localStorage.setItem('snakeHigh', highScore);
      }

      draw();
    }

    function draw() {
      // Background
      ctx.fillStyle = '#0f0f1a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid dots
      ctx.fillStyle = '#1a1a2e';
      for (let x = 0; x < COLS; x++) {
        for (let y = 0; y < ROWS; y++) {
          ctx.fillRect(x * GRID + GRID / 2 - 1, y * GRID + GRID / 2 - 1, 2, 2);
        }
      }

      // Food
      drawFood();

      // Bonus
      if (bonus) drawBonus();

      // Snake
      drawSnake();
    }

    function drawFood() {
      const cx = food.x * GRID + GRID / 2;
      const cy = food.y * GRID + GRID / 2;
      const r = GRID / 2 - 2;

      // Glow
      ctx.shadowColor = '#ff4466';
      ctx.shadowBlur = 12;
      ctx.fillStyle = '#ff4466';
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Highlight
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.beginPath();
      ctx.arc(cx - 2, cy - 2, r * 0.4, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawBonus() {
      const cx = bonus.x * GRID + GRID / 2;
      const cy = bonus.y * GRID + GRID / 2;
      const r = GRID / 2 - 1;
      const remaining = (bonusTimer - Date.now()) / BONUS_DURATION;

      ctx.shadowColor = '#ffcc00';
      ctx.shadowBlur = 16;
      ctx.fillStyle = `rgba(255, 204, 0, ${0.5 + 0.5 * remaining})`;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();

      // Star symbol
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#0f0f1a';
      ctx.font = `${GRID - 4}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('★', cx, cy + 1);
    }

    function drawSnake() {
      snake.forEach((seg, i) => {
        const x = seg.x * GRID + 1;
        const y = seg.y * GRID + 1;
        const size = GRID - 2;

        if (i === 0) {
          // Head
          ctx.shadowColor = '#00ff88';
          ctx.shadowBlur = 14;
          const grad = ctx.createLinearGradient(x, y, x + size, y + size);
          grad.addColorStop(0, '#00ff88');
          grad.addColorStop(1, '#00cc66');
          ctx.fillStyle = grad;
        } else {
          ctx.shadowBlur = 0;
          const t = i / snake.length;
          const r = Math.round(0 + t * 0);
          const g = Math.round(255 - t * 80);
          const b = Math.round(136 - t * 60);
          ctx.fillStyle = `rgb(${r},${g},${b})`;
        }

        const radius = i === 0 ? 5 : 3;
        roundRect(ctx, x, y, size, size, radius);
        ctx.fill();

        // Eyes on head
        if (i === 0) {
          ctx.shadowBlur = 0;
          ctx.fillStyle = '#fff';
          const eyeSize = 3;
          let ex1, ey1, ex2, ey2;
          const mid = GRID / 2;
          if (dir.x === 1)       { ex1 = x+size-5; ey1 = y+4;      ex2 = x+size-5; ey2 = y+size-7; }
          else if (dir.x === -1) { ex1 = x+4;      ey1 = y+4;      ex2 = x+4;      ey2 = y+size-7; }
          else if (dir.y === -1) { ex1 = x+4;      ey1 = y+4;      ex2 = x+size-7; ey2 = y+4; }
          else                   { ex1 = x+4;      ey1 = y+size-5; ex2 = x+size-7; ey2 = y+size-5; }
          ctx.beginPath(); ctx.arc(ex1, ey1, eyeSize, 0, Math.PI*2); ctx.fill();
          ctx.beginPath(); ctx.arc(ex2, ey2, eyeSize, 0, Math.PI*2); ctx.fill();
          ctx.fillStyle = '#111';
          ctx.beginPath(); ctx.arc(ex1+1, ey1+1, 1.5, 0, Math.PI*2); ctx.fill();
          ctx.beginPath(); ctx.arc(ex2+1, ey2+1, 1.5, 0, Math.PI*2); ctx.fill();
        }
      });
      ctx.shadowBlur = 0;
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.arcTo(x + w, y, x + w, y + r, r);
      ctx.lineTo(x + w, y + h - r);
      ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
      ctx.lineTo(x + r, y + h);
      ctx.arcTo(x, y + h, x, y + h - r, r);
      ctx.lineTo(x, y + r);
      ctx.arcTo(x, y, x + r, y, r);
      ctx.closePath();
    }

    function endGame() {
      running = false;
      clearInterval(gameLoop);
      overlayTitle.textContent = 'FIN DEL JUEGO';
      overlayTitle.style.color = '#ff4466';
      overlayMsg.textContent = `Puntuación: ${score}`;
      levelBadge.textContent = `Nivel alcanzado: ${level}`;
      startBtn.textContent = 'Jugar de nuevo';
      overlay.classList.remove('hidden');
    }

    document.addEventListener('keydown', e => {
      switch (e.key) {
        case 'ArrowUp':    case 'w': case 'W':
          e.preventDefault();
          if (dir.y !== 1) nextDir = { x: 0, y: -1 }; break;
        case 'ArrowDown':  case 's': case 'S':
          e.preventDefault();
          if (dir.y !== -1) nextDir = { x: 0, y: 1 }; break;
        case 'ArrowLeft':  case 'a': case 'A':
          e.preventDefault();
          if (dir.x !== 1) nextDir = { x: -1, y: 0 }; break;
        case 'ArrowRight': case 'd': case 'D':
          e.preventDefault();
          if (dir.x !== -1) nextDir = { x: 1, y: 0 }; break;
        case 'p': case 'P':
          if (running) {
            paused = !paused;
            if (paused) {
              overlayTitle.textContent = 'PAUSA';
              overlayTitle.style.color = '#00ccff';
              overlayMsg.textContent = 'Pulsa P para continuar';
              levelBadge.textContent = '';
              startBtn.style.display = 'none';
              overlay.classList.remove('hidden');
            } else {
              overlay.classList.add('hidden');
              startBtn.style.display = '';
            }
          }
          break;
      }
    });

    startBtn.addEventListener('click', init);

    // Initial draw
    ctx.fillStyle = '#0f0f1a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  </script>
</body>
</html>
