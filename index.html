<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcade Games</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #0f0f1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: monospace;
      color: #fff;
    }
    h1 {
      font-size: 2rem;
      letter-spacing: 6px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #e63946, #ffdd00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
    }
    p { color: #555; font-size: 12px; margin-bottom: 48px; letter-spacing: 2px; }
    .games {
      display: flex;
      gap: 32px;
    }
    .card {
      background: #1a1a2e;
      border: 2px solid #333;
      border-radius: 12px;
      padding: 32px 40px;
      text-align: center;
      text-decoration: none;
      color: #fff;
      transition: border-color .2s, transform .2s, box-shadow .2s;
      cursor: pointer;
    }
    .card:hover {
      transform: translateY(-4px);
    }
    .card.mario { border-color: #e63946; }
    .card.mario:hover { box-shadow: 0 0 30px rgba(230,57,70,.4); }
    .card.snake { border-color: #00ff88; }
    .card.snake:hover { box-shadow: 0 0 30px rgba(0,255,136,.4); }
    .icon { font-size: 3rem; margin-bottom: 12px; }
    .card h2 { font-size: 1.1rem; letter-spacing: 3px; margin-bottom: 8px; }
    .card span { font-size: 11px; color: #666; }
  </style>
</head>
<body>
  <h1>Arcade Games</h1>
  <p>Selecciona un juego para empezar</p>
  <div class="games">
    <a class="card mario" href="game.html">
      <div class="icon">🎮</div>
      <h2>SUPER ARCADE BROS</h2>
      <span>Plataformas · Enemigos · Monedas</span>
    </a>
    <a class="card snake" href="snake.html">
      <div class="icon">🐍</div>
      <h2>SNAKE</h2>
      <span>Niveles · Récord · Bonus</span>
    </a>
  </div>
</body>
</html>
