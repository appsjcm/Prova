<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcade Games</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      background: #0f0f1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: monospace;
      color: #fff;
    }

    h1 {
      font-size: 2.4rem;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: #ffdd00;
      margin-bottom: 8px;
      text-shadow: 0 0 20px rgba(255,221,0,.4);
    }

    .subtitle {
      color: #444;
      font-size: 12px;
      letter-spacing: 3px;
      margin-bottom: 60px;
      text-transform: uppercase;
    }

    .games {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 340px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 24px 32px;
      text-decoration: none;
      border-radius: 10px;
      text-align: left;
      transition: transform 0.15s, box-shadow 0.15s;
      border: 2px solid transparent;
    }
    .btn:hover {
      transform: translateX(6px);
    }

    .btn-mario {
      background: #1a0a10;
      border-color: #e63946;
      box-shadow: 0 0 0 rgba(230,57,70,0);
    }
    .btn-mario:hover {
      box-shadow: 0 0 24px rgba(230,57,70,.5);
    }

    .btn-snake {
      background: #0a1a10;
      border-color: #00ff88;
      box-shadow: 0 0 0 rgba(0,255,136,0);
    }
    .btn-snake:hover {
      box-shadow: 0 0 24px rgba(0,255,136,.4);
    }

    .btn-title {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 1.2rem;
      font-weight: bold;
      letter-spacing: 3px;
      margin-bottom: 6px;
    }
    .btn-mario .btn-title { color: #e63946; }
    .btn-snake .btn-title { color: #00ff88; }

    .btn-icon { font-size: 1.8rem; }

    .btn-desc {
      font-size: 11px;
      color: #555;
      letter-spacing: 1px;
      padding-left: 48px;
    }

    .arrow {
      float: right;
      font-size: 1.4rem;
      opacity: 0.4;
      margin-top: -2px;
    }
    .btn:hover .arrow { opacity: 1; }

    .footer {
      margin-top: 48px;
      color: #333;
      font-size: 11px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <h1>ARCADE GAMES</h1>
  <p class="subtitle">Elige un juego</p>

  <div class="games">

    <a class="btn btn-mario" href="game.html">
      <div class="btn-title">
        <span class="btn-icon">&#127918;</span>
        SUPER ARCADE BROS
        <span class="arrow">&#8594;</span>
      </div>
      <div class="btn-desc">Plataformas &middot; Enemigos &middot; Monedas &middot; Nivel 1-1</div>
    </a>

    <a class="btn btn-snake" href="snake.html">
      <div class="btn-title">
        <span class="btn-icon">&#128013;</span>
        SNAKE
        <span class="arrow">&#8594;</span>
      </div>
      <div class="btn-desc">Come &middot; Crece &middot; R&eacute;cord &middot; Bonus</div>
    </a>

  </div>

  <p class="footer">Usa el teclado para jugar</p>

</body>
</html>
