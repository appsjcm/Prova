name: Compilar Modulador EXE

on:
  push:
    branches: ["claude/new-session-94jxsw"]
    paths:
      - "voiceicc_v2_4/**"
      - ".github/workflows/compilar_exe.yml"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: voiceicc_v2_4
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Compilar EXE
        run: >
          python -m PyInstaller --noconsole --onefile
          --name VoiceICC
          --icon assets/app_icon.ico
          --add-data "assets;assets"
          src/voiceicc.py

      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Crear instalador de Windows
        run: iscc instalador\VoiceICC.iss

      - name: Publicar EXE
        uses: actions/upload-artifact@v4
        with:
          name: VoiceICC-2.4-EXE
          path: voiceicc_v2_4/dist/VoiceICC.exe
          retention-days: 30

      - name: Publicar instalador
        uses: actions/upload-artifact@v4
        with:
          name: VoiceICC-2.4-Instalador
          path: voiceicc_v2_4/salida_instalador/VoiceICC_Setup_2.4.exe
          retention-days: 30
